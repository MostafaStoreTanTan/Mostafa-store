<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تفاصيل الزبون</title>
<style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Tahoma',sans-serif;background:#667eea;min-height:100vh;padding:20px;display:flex;align-items:center;justify-content:center}
    .box{width:100%;max-width:400px;background:white;border-radius:20px;padding:30px;box-shadow:0 10px 30px rgba(0,0,0,0.2)}
    h2{text-align:center;color:#333;margin-bottom:30px;font-size:26px}
    label{display:block;margin:15px 0 5px;font-weight:bold;color:#555;font-size:16px}
    input{width:100%;padding:15px;border:2px solid #ddd;border-radius:10px;font-size:18px}
    input:focus{border-color:#667eea;outline:none}
    button{width:100%;padding:15px;margin-top:20px;border:none;border-radius:10px;background:#667eea;color:white;font-size:18px;font-weight:bold;cursor:pointer}
    button:active{transform:scale(0.97)}
    .back{margin-top:10px;background:#ccc;color:#333}
    .info{margin:20px 0;padding:15px;background:#f3f4f6;border-radius:10px;text-align:center}
    #name{font-size:24px;font-weight:bold;color:#333}
    #phone{color:#666;margin-top:5px;font-size:16px}
</style>
</head>
<body>

<div class="box">
    <h2>تعديل الزبون</h2>
    
    <div class="info">
        <div id="name">جاري التحميل...</div>
        <div id="phone">...</div>
    </div>

    <label>المبلغ بالدرهم</label>
    <input type="number" id="amount" placeholder="0">

    <label>تاريخ الأداء</label>
    <input type="date" id="date">

    <button id="saveBtn">💾 حفظ التغييرات</button>
    <button class="back" id="backBtn">⬅️ رجوع</button>
</div>

<script type="module">
// Import the functions you need
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

// Your web app's Firebase configuration - الكود ديالك
const firebaseConfig = {
  apiKey: "AIzaSyBCVOOouLET3GDGyHj2i7ncvUZBjUUVB7Y",
  authDomain: "karni-b9b34.firebaseapp.com",
  databaseURL: "https://karni-b9b34-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "karni-b9b34",
  storageBucket: "karni-b9b34.firebasestorage.app",
  messagingSenderId: "489835094040",
  appId: "1:489835094040:web:109e20fe7b65516903236d"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// جيب الـ id من الرابط
const urlParams = new URLSearchParams(window.location.search);
const id = urlParams.get('id');

if(!id){
    alert('خطأ: ما كاينش id فالرابط\nسير لـ index.html وضغط على التفاصيل');
    document.getElementById('name').textContent = 'خطأ في الرابط';
}

// المرجع ديال الزبون
const customerRef = ref(db, 'customers/' + id);

// قرا البيانات من Firebase
get(customerRef).then((snapshot)=>{
    if(snapshot.exists()){
        const data = snapshot.val();
        document.getElementById('name').textContent = data.name || 'بدون اسم';
        document.getElementById('phone').textContent = data.phone || '';
        document.getElementById('amount').value = data.amount || 0;
        document.getElementById('date').value = data.paymentDate || '';
    }else{
        alert('الزبون غير موجود');
        document.getElementById('name').textContent = 'غير موجود';
    }
}).catch((error)=>{
    alert('خطأ في قراءة البيانات: ' + error.message);
    console.error(error);
});

// زر الحفظ
document.getElementById('saveBtn').addEventListener('click', ()=>{
    const amount = parseFloat(document.getElementById('amount').value) || 0;
    const date = document.getElementById('date').value;
    
    update(customerRef, {
        amount: amount,
        paymentDate: date,
        updatedAt: new Date().toISOString()
    }).then(()=>{
        alert('✅ تم الحفظ بنجاح');
        window.location.href = 'index.html';
    }).catch((error)=>{
        alert('خطأ في الحفظ: ' + error.message);
    });
});

// زر الرجوع
document.getElementById('backBtn').addEventListener('click', ()=>{
    window.location.href = 'index.html';
});
</script>
</body>
</html>
