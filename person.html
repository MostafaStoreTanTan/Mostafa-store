<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بيانات الزبون</title>
<style>
body{
  font-family: 'Tajawal', sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  padding: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card{
  background: white;
  padding: 40px;
  border-radius: 25px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  max-width: 450px;
  width: 100%;
}
h2{
  color: #667eea;
  margin-bottom: 25px;
  text-align: center;
}
.info{
  background: #f8f9fa;
  padding: 15px;
  border-radius: 12px;
  margin: 15px 0;
  font-size: 16px;
}
label{
  display: block;
  margin-top: 20px;
  margin-bottom: 8px;
  font-weight: bold;
  color: #333;
}
input{
  width: 100%;
  padding: 15px;
  border: 2px solid #e0e0e0;
  border-radius: 12px;
  font-size: 18px;
  box-sizing: border-box;
}
input:focus{
  border-color: #667eea;
  outline: none;
}
.btn{
  width: 100%;
  padding: 18px;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  border: none;
  border-radius: 15px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 25px;
}
.btn:hover{
  transform: translateY(-2px);
  box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
}
</style>
</head>
<body>

<div class="card">
  <h2>📝 تعديل بيانات الزبون</h2>
  
  <div class="info">
    <strong>ID:</strong> <span id="id">تحميل...</span>
  </div>
  
  <div class="info">
    <strong>الاسم:</strong> <span id="name">تحميل...</span>
  </div>
  
  <label>💰 الثمن/الدفع:</label>
  <input type="number" id="price" placeholder="0">
  
  <button class="btn" onclick="save()">💾 حفظ التعديلات</button>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getDatabase, ref, get, update } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

// قاعدة البيانات ديال karni-b9b34 اللي فيها الزبناء
const firebaseConfig = {
  apiKey: "AIzaSyBCVOOouLET3GDGyHj2i7ncvUZBjUUVB7Y",
  authDomain: "karni-b9b34.firebaseapp.com",
  databaseURL: "https://karni-b9b34-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "karni-b9b34",
  storageBucket: "karni-b9b34.firebasestorage.app",
  messagingSenderId: "489835094040",
  appId: "1:489835094040:web:109e20fe7b65516903236d"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// كنستناو حتى يتحمل HTML كامل عاد كنخدمو
document.addEventListener('DOMContentLoaded', async () => {
  
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  
  // تجربة باش نشوفو واش جاب الـ ID
  alert('الـ ID اللي جاي من الرابط: ' + id);
  
  document.getElementById('id').innerText = id || 'ماكاينش ID';
  
  if(!id || id === 'null') {
    alert('خطأ: الرابط ما فيهش ID ديال الزبون');
    return;
  }
  
  try {
    const snap = await get(ref(db, 'customers/'+id));
    if(snap.exists()){
      const c = snap.val();
      document.getElementById('name').innerText = c.name || 'بلا اسم';
      document.getElementById('price').value = c.depot || 0;
    } else {
      alert('الزبون ما لقيناه فـ قاعدة البيانات karni-b9b34');
      console.log('كنقلب على:', 'customers/'+id);
    }
  } catch(err) {
    alert('خطأ فالاتصال: ' + err.message);
  }
});

// دالة الحفظ
window.save = async () => {
  const id = new URLSearchParams(window.location.search).get('id');
  const newPrice = parseFloat(document.getElementById('price').value) || 0;
  
  try {
    await update(ref(db, 'customers/'+id), {depot: newPrice});
    alert('تم تعديل الثمن بنجاح ✅');
    window.location.href = 'index.html';
  } catch(err) {
    alert('خطأ فالحفظ: ' + err.message);
  }
}
</script>

</body>
</html>
