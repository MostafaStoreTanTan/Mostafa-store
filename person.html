<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تعديل الثمن</title>
<style>
body{font-family:Tajawal,sans-serif;background:#00a8ff;padding:30px}
.card{background:white;border-radius:20px;padding:30px;max-width:400px;margin:0 auto}
h2{text-align:center;color:#1d3557}
input{width:100%;padding:15px;font-size:20px;border:2px solid #ddd;border-radius:12px;margin:15px 0;text-align:center}
button{width:100%;padding:15px;background:#06d6a0;color:white;border:none;border-radius:12px;font-size:18px;font-weight:900;cursor:pointer}
</style>
<script type="importmap">{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js","firebase/database":"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"}}</script>
<script type="module">
import { initializeApp } from 'firebase/app';
import { getDatabase, ref, get, update } from 'firebase/database';

// بيانات karni-b9b34 اللي فالصورة ديالك
const app = initializeApp({
apiKey: "AIzaSyC...حط_apiKey_ديالك_هنا",
databaseURL: "https://karni-b9b34-default-rtdb.europe-west1.firebasedatabase.app",
projectId: "karni-b9b34"
});
const db = getDatabase(app);

const id = new URLSearchParams(window.location.search).get('id');
document.getElementById && (document.getElementById('id').innerText = id);

async function load(){
const snap = await get(ref(db, 'customers/'+id));
if(snap.exists()){
const c = snap.val();
document.getElementById('name').innerText = c.name;
document.getElementById('price').value = c.depot || 0;
} else {
alert('الزبون ما لقيناه');
}
}

window.save = async ()=>{
const newPrice = parseFloat(document.getElementById('price').value);
await update(ref(db, 'customers/'+id), {depot: newPrice});
alert('تم تعديل الثمن ✅');
window.location.href = 'index.html';
}

load();
</script>
</head>
<body>
<div class="card">
<h2>تعديل الثمن فقط</h2>
<p>ID: <b id="id">-</b></p>
<p>الزبون: <b id="name">تحميل...</b></p>
<input type="number" id="price" placeholder="الثمن">
<button onclick="save()">حفظ الثمن</button>
<button style="background:#666;margin-top:10px" onclick="history.back()">رجوع</button>
</div>
</body>
</html>
