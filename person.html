<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تفاصيل الزبون - Karni Pro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a1929;color:#fff;font-family:'Tajawal','Cairo',sans-serif;min-height:100vh;padding:20px}
.container{max-width:800px;margin:0 auto}
.header-card{background:linear-gradient(135deg,#1e3c72 0%,#2a5298 100%);border-radius:20px;padding:30px;margin-bottom:20px;text-align:center;position:relative}
.avatar{width:80px;height:80px;border-radius:50%;margin:0 auto 15px;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:bold;color:#fff}
.customer-name{font-size:28px;font-weight:bold;margin-bottom:10px}
.stars{font-size:24px;cursor:pointer}
.star{color:#444;transition:0.3s;display:inline-block;margin:0 3px}
.star.active{color:#ffd700}
.back-btn{position:absolute;top:20px;right:20px;background:rgba(255,255,255,0.2);border:none;color:#fff;padding:10px 20px;border-radius:10px;cursor:pointer;font-size:16px}
.card{background:#16213e;border-radius:15px;padding:20px;margin-bottom:15px;border:1px solid #2a3f5f}
.card h3{margin-bottom:15px;font-size:18px}
.info-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #2a3f5f}
.info-row:last-child{border-bottom:none}
.balance-row{font-size:24px;font-weight:bold}
.balance-positive{color:#2ecc71}
.balance-negative{color:#e74c3c}
.actions{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.btn{flex:1;min-width:120px;padding:15px;border:none;border-radius:12px;font-size:16px;font-weight:bold;cursor:pointer;transition:0.3s;color:#fff}
.btn-deposit{background:linear-gradient(135deg,#27ae60,#2ecc71)}
.btn-paid{background:linear-gradient(135deg,#c0392b,#e74c3c)}
.btn:hover{transform:translateY(-3px)}
table{width:100%;border-collapse:collapse}
th{background:#2a3f5f;padding:12px;text-align:center}
td{padding:12px;text-align:center;border-bottom:1px solid #2a3f5f}
.amount-deposit{color:#2ecc71;font-weight:bold}
.amount-paid{color:#e74c3c;font-weight:bold}
.popup{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:1000;align-items:center;justify-content:center}
.popup.active{display:flex}
.popup-content{background:#16213e;padding:30px;border-radius:20px;width:90%;max-width:400px}
.popup-content h3{margin-bottom:20px;text-align:center}
.popup-content input{width:100%;padding:12px;margin-bottom:15px;border-radius:10px;border:1px solid #2a3f5f;background:#0a1929;color:#fff;font-size:16px}
.popup-btns{display:flex;gap:10px}
.popup-btn{flex:1;padding:12px;border:none;border-radius:10px;cursor:pointer;font-weight:bold;font-size:16px}
.btn-confirm{background:#27ae60;color:#fff}
.btn-cancel{background:#7f8c8d;color:#fff}
.date-editable{cursor:pointer;color:#3498db}
textarea{width:100%;min-height:80px;padding:10px;border-radius:10px;border:1px solid #2a3f5f;background:#0a1929;color:#fff;font-family:inherit}
@media(max-width:600px){
.customer-name{font-size:22px}
.actions{flex-direction:column}
.btn{min-width:100%}
}
@keyframes fadeInUp{
from{opacity:0;transform:translateY(20px)}
to{opacity:1;transform:translateY(0)}
}
</style>
</head>
<body>
<div class="container">
<button class="back-btn" onclick="window.close()">رجوع</button>

<div class="header-card">
<div class="avatar" id="avatar">أ</div>
<div class="customer-name" id="customerName">جاري التحميل...</div>
<div class="stars" id="stars">
<span class="star" data-star="1">⭐</span>
<span class="star" data-star="2">⭐</span>
<span class="star" data-star="3">⭐</span>
<span class="star" data-star="4">⭐</span>
<span class="star" data-star="5">⭐</span>
</div>
</div>

<div class="card">
<div class="info-row"><span>رقم الهاتف</span><span id="customerPhone">-</span></div>
<div class="info-row"><span>تاريخ الإنشاء</span><span id="customerDate">-</span></div>
<div class="info-row balance-row"><span>الرصيد الحالي</span><span id="balance">0 درهم</span></div>
</div>

<div class="actions">
<button class="btn btn-deposit" onclick="openPopup('deposit')">إضافة إيداع 🟢</button>
<button class="btn btn-paid" onclick="openPopup('paid')">إضافة دفع 🔴</button>
<button class="btn" style="background:#8e44ad" onclick="exportToPDF()">📄 تصدير</button>
<button class="btn" style="background:#16a085" onclick="window.print()">🖨️ طباعة</button>
</div>

<div class="card">
<h3>📝 ملاحظات</h3>
<textarea id="notes" placeholder="اكتب ملاحظات عن الزبون..." onblur="saveNotes()"></textarea>
</div>

<div class="card">
<h3>📍 الموقع</h3>
<input type="text" id="locationInput" placeholder="أدخل العنوان أو رابط Google Maps" style="width:100%;padding:10px;border-radius:10px;border:1px solid #2a3f5f;background:#0a1929;color:#fff" onblur="saveLocation()">
<div id="locationLink" style="margin-top:10px"></div>
</div>

<div class="card">
<h3>📊 العمليات</h3>
<div style="display:flex;gap:10px;margin-bottom:15px">
<button class="btn" style="flex:1;background:#34495e" onclick="filterOps('all')">الكل</button>
<button class="btn" style="flex:1;background:#34495e" onclick="filterOps('deposit')">الإيداعات</button>
<button class="btn" style="flex:1;background:#34495e" onclick="filterOps('paid')">الدفعات</button>
</div>
<table>
<thead>
<tr><th>التاريخ</th><th>النوع</th><th>المبلغ</th></tr>
</thead>
<tbody id="operationsBody">
<tr><td colspan="3">لا توجد عمليات</td></tr>
</tbody>
</table>
<div class="info-row" style="margin-top:15px">
<span>مجموع الإيداع:</span><span id="totalDeposit" class="amount-deposit">0 درهم</span>
</div>
<div class="info-row">
<span>مجموع الدفع:</span><span id="totalPaid" class="amount-paid">0 درهم</span>
</div>
</div>

</div>

<div class="popup" id="popup">
<div class="popup-content">
<h3 id="popupTitle">إضافة عملية</h3>
<input type="number" id="amountInput" placeholder="المبلغ بالدرهم" step="0.01">
<input type="datetime-local" id="dateInput">
<div class="popup-btns">
<button class="popup-btn btn-confirm" onclick="saveOperation()">تأكيد</button>
<button class="popup-btn btn-cancel" onclick="closePopup()">إلغاء</button>
</div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, update, push, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

// ====== إعدادات Firebase ======
const firebaseConfig = {
databaseURL: "https://karni-pro-default-rtdb.firebaseio.com/"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ====== المتغيرات العامة ======
const urlParams = new URLSearchParams(window.location.search);
const customerId = urlParams.get('id');
let customerData = {};
let operations = [];
let currentOpType = '';
let currentFilter = 'all';

// ====== تحميل بيانات الزبون ======
function loadCustomer() {
if(!customerId) {
alert('خطأ: لا يوجد معرف الزبون');
return;
}

onValue(ref(db, 'customers/' + customerId), (snapshot) => {
const data = snapshot.val();
if(data) {
customerData = data;
operations = data.operations || [];
updateUI();
} else {
alert('الزبون غير موجود');
}
});
}

// ====== تحديث الواجهة ======
function updateUI() {
document.getElementById('customerName').textContent = customerData.name || 'بدون اسم';
document.getElementById('customerPhone').textContent = customerData.phone || '-';
document.getElementById('customerDate').textContent = new Date(customerData.createdAt).toLocaleDateString('ar-MA');
document.getElementById('notes').value = customerData.notes || '';
document.getElementById('locationInput').value = customerData.location || '';

const avatar = document.getElementById('avatar');
const firstLetter = customerData.name? customerData.name.charAt(0) : 'أ';
avatar.textContent = firstLetter;
avatar.style.background = getAvatarColor(customerData.name);

updateStars(customerData.rating || 0);
updateBalance();
displayOperations();
updateLocationLink();
}

// ====== لون الدائرة حسب الاسم ======
function getAvatarColor(name) {
const colors = ['#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6','#1abc9c','#e67e22'];
let hash = 0;
for(let i = 0; i < name.length; i++) {
hash = name.charCodeAt(i) + ((hash << 5) - hash);
}
return colors[Math.abs(hash) % colors.length];
}

// ====== النجوم ======
function updateStars(rating) {
document.querySelectorAll('.star').forEach((star, index) => {
if(index < rating) star.classList.add('active');
else star.classList.remove('active');
});
}

document.querySelectorAll('.star').forEach(star => {
star.addEventListener('click', function() {
const rating = parseInt(this.dataset.star);
update(ref(db, 'customers/' + customerId), { rating });
});
});

// ====== الرصيد ======
function updateBalance() {
const totalDeposit = operations.filter(op => op.type === 'deposit').reduce((sum, op) => sum + parseFloat(op.amount), 0);
const totalPaid = operations.filter(op => op.type === 'paid').reduce((sum, op) => sum + parseFloat(op.amount), 0);
const balance = totalDeposit - totalPaid;

document.getElementById('balance').textContent = balance.toLocaleString() + ' درهم';
document.getElementById('balance').className = balance >= 0? 'balance-positive' : 'balance-negative';
document.getElementById('totalDeposit').textContent = totalDeposit.toLocaleString() + ' درهم';
document.getElementById('totalPaid').textContent = totalPaid.toLocaleString() + ' درهم';
}

// ====== عرض العمليات ======
function displayOperations() {
let filteredOps = operations;
if(currentFilter === 'deposit') filteredOps = operations.filter(op => op.type === 'deposit');
if(currentFilter === 'paid') filteredOps = operations.filter(op => op.type === 'paid');

filteredOps.sort((a,b) => new Date(b.date) - new Date(a.date));

const tbody = document.getElementById('operationsBody');
if(filteredOps.length === 0) {
tbody.innerHTML = '<tr><td colspan="3">لا توجد عمليات</td></tr>';
return;
}

tbody.innerHTML = filteredOps.map(op => `
<tr>
<td class="date-editable" onclick="editDate(${op.id})">${new Date(op.date).toLocaleString('ar-MA')}</td>
<td>${op.type === 'deposit'? 'إيداع' : 'دفع'}</td>
<td class="${op.type === 'deposit'? 'amount-deposit' : 'amount-paid'}">
${op.type === 'deposit'? '+' : '-'} ${parseFloat(op.amount).toLocaleString()} درهم
</td>
</tr>
`).join('');
}

// ====== فلترة العمليات ======
window.filterOps = function(type) {
currentFilter = type;
displayOperations();
}

// ====== البوب أب ======
window.openPopup = function(type) {
currentOpType = type;
document.getElementById('popupTitle').textContent = type === 'deposit'? 'إضافة إيداع' : 'إضافة دفع';
document.getElementById('dateInput').value = new Date().toISOString().slice(0,16);
document.getElementById('amountInput').value = '';
document.getElementById('popup').classList.add('active');
}

window.closePopup = function() {
document.getElementById('popup').classList.remove('active');
}

// ====== حفظ العملية ======
window.saveOperation = function() {
const amount = parseFloat(document.getElementById('amountInput').value);
const date = document.getElementById('dateInput').value;

if(!amount || amount <= 0) {
alert('أدخل مبلغ صحيح');
return;
}

const newOp = {
id: Date.now(),
type: currentOpType,
amount: amount,
date: date
};

operations.push(newOp);
update(ref(db, 'customers/' + customerId), { operations });
closePopup();
}

// ====== تعديل التاريخ ======
window.editDate = function(opId) {
const newDate = prompt('أدخل التاريخ الجديد بصيغة YYYY-MM-DDTHH:MM');
if(newDate) {
const op = operations.find(o => o.id === opId);
if(op) {
op.date = newDate;
update(ref(db, 'customers/' + customerId), { operations });
}
}

// ====== الملاحظات ======
window.saveNotes = function() {
update(ref(db, 'customers/' + customerId), { notes: document.getElementById('notes').value });
}

// ====== الموقع ======
window.saveLocation = function() {
update(ref(db, 'customers/' + customerId), { location: document.getElementById('locationInput').value });
updateLocationLink();
}

function updateLocationLink() {
const loc = customerData.location;
const div = document.getElementById('locationLink');
if(loc && loc.includes('http')) {
div.innerHTML = `<a href="${loc}" target="_blank" style="color:#3498db">فتح في Google Maps 📍</a>`;
} else {
div.innerHTML = '';
}
}

// ====== تصدير PDF ======
window.exportToPDF = function() {
let content = 'كشف حساب - ' + customerData.name + '\n\n';
content += 'الإيداع: ' + document.getElementById('totalDeposit').textContent + '\n';
content += 'الدفع: ' + document.getElementById('totalPaid').textContent + '\n';
content += 'الرصيد: ' + document.getElementById('balance').textContent + '\n\n';
content += 'العمليات:\n';

operations.sort((a,b) => new Date(b.date) - new Date(a.date)).forEach(op => {
const type = op.type === 'deposit'? 'إيداع' : 'دفع';
const date = new Date(op.date).toLocaleString('ar-MA');
content += `${date} - ${type} - ${op.amount} درهم\n`;
});

const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
const link = document.createElement('a');
link.href = URL.createObjectURL(blob);
link.download = customerData.name + '_كشف_حساب.txt';
link.click();
}

// ====== تشغيل ======
loadCustomer();
</script>
</body>
</html>
