<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تجربة</title>
<style>body{padding:30px;font-family:Tajawal} .card{background:white;padding:30px;border-radius:20px;max-width:400px;margin:auto} input{width:100%;padding:15px;margin:10px 0} button{width:100%;padding:15px;background:#06d6a0;color:white;border:none;border-radius:12px;font-size:18px}</style>
<script type="importmap">{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js","firebase/database":"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"}}</script>
<script type="module">
import { initializeApp } from 'firebase/app';
import { getDatabase, ref, get, update } from 'firebase/database';

const firebaseConfig = {
  apiKey: "AIzaSyBCVOOouLET3GDGyHj2i7ncvUZBjUUVB7Y",
  authDomain: "karni-b9b34.firebaseapp.com",
  databaseURL: "https://karni-b9b34-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "karni-b9b34",
  storageBucket: "karni-b9b34.firebasestorage.app",
  messagingSenderId: "489835094040",
  appId: "1:489835094040:web:109e20fe7b65516903236d"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const id = new URLSearchParams(window.location.search).get('id');
document.getElementById('id').innerText = id;

get(ref(db, 'customers/'+id)).then(snap=>{
  if(snap.exists()){
    const c = snap.val();
    document.getElementById('name').innerText = c.name;
    document.getElementById('price').value = c.depot || 0;
  } else {
    alert('الزبون ما لقيناه - المشكل مزال');
  }
});

window.save = ()=>{
  const newPrice = parseFloat(document.getElementById('price').value);
  update(ref(db, 'customers/'+id), {depot: newPrice}).then(()=>{
    alert('تم تعديل الثمن ✅');
    window.location.href = 'index.html';
  });
}
</script>
</head>
<body>
<div class="card">
<h2>تعديل الثمن</h2>
<p>ID: <b id="id"></b></p>
<p>الزبون: <b id="name">تحميل...</b></p>
<input type="number" id="price">
<button onclick="save()">حفظ</button>
</div>
</body>
</html>
