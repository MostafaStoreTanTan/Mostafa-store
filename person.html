<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إضافة زبون - Karni</title>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<style>
body{font-family:Arial;background:#0f172a;color:white;text-align:center;padding:30px}
h2{color:#22c55e}
input,button{padding:12px;margin:8px;width:85%;max-width:400px;border-radius:8px;border:none;font-size:16px}
input{background:#1e293b;color:white}
button{background:#22c55e;color:white;cursor:pointer;font-weight:bold}
button:hover{background:#16a34a}
#msg{margin-top:15px;font-size:18px}
</style>
</head>
<body>
<h2>➕ إضافة زبون جديد</h2>
<input id="name" placeholder="الاسم الكامل" required><br>
<input id="phone" placeholder="رقم الهاتف" required><br>
<input id="amount" placeholder="المبلغ بالدرهم" type="number" required><br>
<button onclick="addCustomer()">حفظ الزبون</button>
<div id="msg"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBCVOOouLET3GDGyHj2i7ncvUZBjUUVB7Y",
  authDomain: "karni-b9b34.firebaseapp.com",
  databaseURL: "https://karni-b9b34-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "karni-b9b34",
  storageBucket: "karni-b9b34.firebasestorage.app",
  messagingSenderId: "489835094040",
  appId: "1:489835094040:web:109e20fe7b65516903236d"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function addCustomer(){
  const name = document.getElementById('name').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const amount = document.getElementById('amount').value.trim();
  const msg = document.getElementById('msg');
  
  if(!name || !phone || !amount){
    msg.innerHTML = '⚠️ عمر جميع الخانات';
    msg.style.color = 'orange';
    return;
  }
  
  db.ref('customers').push({
    name: name,
    phone: phone,
    amount: amount,
    date: new Date().toLocaleDateString('ar-MA'),
    time: new Date().toLocaleTimeString('ar-MA')
  });
  
  msg.innerHTML = '✅ تم حفظ الزبون بنجاح!';
  msg.style.color = '#22c55e';
  document.getElementById('name').value = '';
  document.getElementById('phone').value = '';
  document.getElementById('amount').value = '';
  
  setTimeout(()=>{msg.innerHTML=''}, 3000);
}
</script>
</body>
</html>
