<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Customer Profile</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fb;
padding:15px;
padding-bottom:100px;
}

.card{
background:white;
border-radius:20px;
padding:20px;
margin-bottom:15px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.profile{
text-align:center;
}

.photo{
width:140px;
height:140px;
border-radius:50%;
background:#e5e7eb;
margin:auto;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
font-size:60px;
cursor:pointer;
}

.photo img{
width:100%;
height:100%;
object-fit:cover;
}

.name{
font-size:30px;
font-weight:bold;
margin-top:15px;
}

.rating{
font-size:30px;
margin-top:10px;
}

.phone{
margin-top:10px;
font-size:18px;
color:#666;
}

.action-row{
display:flex;
gap:10px;
margin-top:15px;
}

.action-btn{
flex:1;
padding:14px;
border:none;
border-radius:12px;
color:white;
font-size:16px;
font-weight:bold;
text-decoration:none;
text-align:center;
}

.call-btn{
background:#16a34a;
}

.whatsapp-btn{
background:#22c55e;
}

.edit-btn{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#2563eb;
color:white;
font-weight:bold;
margin-top:10px;
}

.summary{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-bottom:15px;
}

.summary-card{
background:white;
padding:15px;
border-radius:18px;
text-align:center;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.summary-title{
font-size:14px;
color:#666;
}

.summary-value{
font-size:22px;
font-weight:bold;
margin-top:5px;
}

.depot-color{
color:#16a34a;
}

.paid-color{
color:#dc2626;
}

.balance-color{
color:#2563eb;
}

.calendar-box{
text-align:center;
}

.calendar-month{
font-size:26px;
font-weight:bold;
color:#0F766E;
}

.calendar-day{
font-size:75px;
font-weight:bold;
margin:10px 0;
}

.calendar-year{
font-size:20px;
color:#666;
}

.big-btn{
width:100%;
padding:16px;
border:none;
border-radius:15px;
font-size:18px;
font-weight:bold;
color:white;
margin-top:12px;
}

.calendar-btn{
background:#0F766E;
}

.depot-btn{
background:#16a34a;
}

.paid-btn{
background:#dc2626;
}

.section-title{
font-size:22px;
font-weight:bold;
margin-bottom:15px;
}

.operation-item{
background:#f8fafc;
padding:15px;
border-radius:15px;
margin-top:10px;
}

.note-item{
background:#f8fafc;
padding:15px;
border-radius:15px;
margin-top:10px;
}

.note-date{
margin-top:8px;
font-size:13px;
color:#666;
}

</style>

</head>

<body>

<div class="card profile">

<div
class="photo"
id="photoContainer">
📷
</div>

<input
type="file"
id="photoInput"
style="display:none">

<div
class="name"
id="customerName">
Customer
</div>

<div
class="rating"
id="customerStars">
⭐⭐⭐⭐⭐
</div>

<div
class="phone"
id="customerPhone">
📞 -
</div>

<div class="action-row">

<a
href="#"
id="callLink"
class="action-btn call-btn">
📞 Call
</a>

<a
href="#"
id="whatsappLink"
class="action-btn whatsapp-btn">
💬 WhatsApp
</a>

</div>

<button
class="edit-btn"
id="editNameBtn">
✏️ Edit Name
</button>

<button
class="edit-btn"
id="editPhoneBtn">
📞 Edit Phone
</button>

<button
class="edit-btn"
id="editLocationBtn">
📍 Edit Location
</button>

</div>

<div class="summary">

<div class="summary-card">
<div class="summary-title">
Depot
</div>
<div
class="summary-value depot-color"
id="totalDepot">
0
</div>
</div>

<div class="summary-card">
<div class="summary-title">
Paid
</div>
<div
class="summary-value paid-color"
id="totalPaid">
0
</div>
</div>

<div class="summary-card">
<div class="summary-title">
Balance
</div>
<div
class="summary-value balance-color"
id="currentBalance">
0
</div>
</div>

</div>

<div class="card calendar-box">

<div
class="calendar-month"
id="calendarMonth">
JUN
</div>

<div
class="calendar-day"
id="calendarDay">
01
</div>

<div
class="calendar-year"
id="calendarYear">
2026
</div>

<button
class="big-btn calendar-btn"
id="changeDateBtn">
📅 Change Date
</button>

</div>

<div class="card">

<div class="section-title">
💵 Money
</div>

<button
class="big-btn depot-btn"
id="depotBtn">
🟢 Add Depot
</button>

<button
class="big-btn paid-btn"
id="paidBtn">
🔴 Add Paid
</button>

</div>

<div class="card">

<div class="section-title">
📜 Operations
</div>

<div id="operationsList">

</div>

</div>

<div class="card">

<div class="section-title">
📝 Notes
</div>

<button
class="big-btn calendar-btn"
id="addNoteBtn">
➕ Add Note
</button>

<div id="notesList">

</div>

</div>

<div class="card">

<div class="section-title">
📍 Location
</div>

<button
class="big-btn calendar-btn"
id="openLocationBtn">
📍 Open Location
</button>

</div>

<script>

let people =
JSON.parse(
localStorage.getItem("people")
) || [];

let selectedIndex =
localStorage.getItem(
"selectedCustomer"
);

let person =
people[selectedIndex];

if(!person){

document.body.innerHTML =
"<h2>Customer Not Found</h2>";

}

if(!person.operations){
person.operations = [];
}

if(!person.notes){
person.notes = [];
}

document.getElementById(
"customerName"
).innerText =
person.name || "Customer";

document.getElementById(
"customerPhone"
).innerText =
"📞 " +
(person.phone || "-");

let stars =
"⭐".repeat(
person.rating || 0
);

document.getElementById(
"customerStars"
).innerText =
stars || "☆☆☆☆☆";

document.getElementById(
"callLink"
).href =
"tel:" +
(person.phone || "");

let whatsappNumber =
(person.phone || "")
.replace(/^0/,"212");

document.getElementById(
"whatsappLink"
).href =
"https://wa.me/" +
whatsappNumber;

if(person.photo){

document.getElementById(
"photoContainer"
).innerHTML =
`<img src="${person.photo}">`;

}

let totalDepot = 0;
let totalPaid = 0;

person.operations.forEach(op=>{

if(op.type === "Depot"){
totalDepot += Number(op.amount);
}

if(op.type === "Paid"){
totalPaid += Number(op.amount);
}

});

let balance =
totalDepot - totalPaid;

document.getElementById(
"totalDepot"
).innerText =
totalDepot + " MAD";

document.getElementById(
"totalPaid"
).innerText =
totalPaid + " MAD";

document.getElementById(
"currentBalance"
).innerText =
balance + " MAD";

renderOperations();
renderNotes();

function renderOperations(){

let html = "";

if(
person.operations.length === 0
){

html = `

<div class="operation-item">
No Operations Yet
</div>

`;

}

person.operations.forEach(op=>{

html += `

<div class="operation-item">

<b>
${op.type==="Depot"
?"🟢 Depot"
:"🔴 Paid"}
</b>

<br><br>

${op.amount} MAD

<br><br>

📅 ${op.date}

</div>

`;

});

document.getElementById(
"operationsList"
).innerHTML =
html;

}

function renderNotes(){

let html = "";

if(
person.notes.length === 0
){

html = `

<div class="note-item">
No Notes Yet
</div>

`;

}

person.notes.forEach(note=>{

html += `

<div class="note-item">

<b>
📝 Note
</b>

<br><br>

${note.text}

<div class="note-date">

📅 ${note.date}
•
🕒 ${note.time}

</div>

</div>

`;

});

document.getElementById(
"notesList"
).innerHTML =
html;

}

document.getElementById(
"addNoteBtn"
).onclick = function(){

let text =
prompt(
"Write Note"
);

if(!text) return;

person.notes.unshift({

text:text,

date:new Date()
.toLocaleDateString(),

time:new Date()
.toLocaleTimeString()

});

people[selectedIndex] =
person;

localStorage.setItem(
"people",
JSON.stringify(people)
);

location.reload();

};

document.getElementById(
"photoContainer"
).onclick = function(){

document.getElementById(
"photoInput"
).click();

};

document.getElementById(
"photoInput"
).onchange = function(e){

let file =
e.target.files[0];

if(!file) return;

let reader =
new FileReader();

reader.onload =
function(event){

person.photo =
event.target.result;

people[selectedIndex] =
person;

localStorage.setItem(
"people",
JSON.stringify(people)
);

location.reload();

};

reader.readAsDataURL(file);

};

document.getElementById(
"editNameBtn"
).onclick = function(){

let name =
prompt(
"Name",
person.name
);

if(!name) return;

person.name = name;

people[selectedIndex] =
person;

localStorage.setItem(
"people",
JSON.stringify(people)
);

location.reload();

};

document.getElementById(
"editPhoneBtn"
).onclick = function(){

let phone =
prompt(
"Phone",
person.phone
);

if(!phone) return;

person.phone = phone;

people[selectedIndex] =
person;

localStorage.setItem(
"people",
JSON.stringify(people)
);

location.reload();

};

document.getElementById(
"editLocationBtn"
).onclick = function(){

let location =
prompt(
"Google Maps Link",
person.location || ""
);

if(location === null)
return;

person.location =
location;

people[selectedIndex] =
person;

localStorage.setItem(
"people",
JSON.stringify(people)
);

};

document.getElementById(
"openLocationBtn"
).onclick = function(){

if(
!person.location
){

alert(
"No Location Saved"
);

return;

}

window.open(
person.location,
"_blank"
);

};

document.getElementById(
"depotBtn"
).onclick = function(){

let amount =
prompt(
"Depot Amount"
);

if(!amount) return;

person.operations.unshift({

type:"Depot",

amount:Number(amount),

date:new Date()
.toLocaleDateString()

});

people[selectedIndex] =
person;

localStorage.setItem(
"people",
JSON.stringify(people)
);

location.reload();

};

document.getElementById(
"paidBtn"
).onclick = function(){

let amount =
prompt(
"Paid Amount"
);

if(!amount) return;

person.operations.unshift({

type:"Paid",

amount:Number(amount),

date:new Date()
.toLocaleDateString()

});

people[selectedIndex] =
person;

localStorage.setItem(
"people",
JSON.stringify(people)
);

location.reload();

};

document.getElementById(
"changeDateBtn"
).onclick = function(){

let date =
prompt(
"YYYY-MM-DD",
person.dueDate || ""
);

if(!date) return;

person.dueDate =
date;

let parts =
date.split("-");

if(parts.length === 3){

document.getElementById(
"calendarYear"
).innerText =
parts[0];

document.getElementById(
"calendarDay"
).innerText =
parts[2];

let months = [
"JAN","FEB","MAR",
"APR","MAY","JUN",
"JUL","AUG","SEP",
"OCT","NOV","DEC"
];

document.getElementById(
"calendarMonth"
).innerText =
months[
Number(parts[1]) - 1
];

}

people[selectedIndex] =
person;

localStorage.setItem(
"people",
JSON.stringify(people)
);

};
    
</script>

</body>

</html>
