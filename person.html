<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تفاصيل الزبون</title>
<style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Tahoma',sans-serif;background:#667eea;padding:20px}
    .box{max-width:400px;margin:auto;background:white;border-radius:20px;padding:30px;box-shadow:0 10px 30px rgba(0,0,0,0.2)}
    h2{text-align:center;color:#333;margin-bottom:30px}
    label{display:block;margin:15px 0 5px;font-weight:bold;color:#555}
    input{width:100%;padding:15px;border:2px solid #ddd;border-radius:10px;font-size:18px}
    input:focus{border-color:#667eea;outline:none}
    button{width:100%;padding:15px;margin-top:20px;border:none;border-radius:10px;background:#667eea;color:white;font-size:18px;font-weight:bold;cursor:pointer}
    button:active{transform:scale(0.97)}
    .back{margin-top:10px;background:#ccc;color:#333}
    .info{margin:20px 0;padding:15px;background:#f3f4f6;border-radius:10px;text-align:center}
</style>
</head>
<body>

<div class="box">
    <h2>تعديل الزبون</h2>
    
    <div class="info">
        <div style="font-size:24px;font-weight:bold" id="name">...</div>
        <div style="color:#666;margin-top:5px" id="phone">...</div>
    </div>

    <label>المبلغ بالدرهم</label>
    <input type="number" id="amount" placeholder="0">

    <label>تاريخ الأداء</label>
    <input type="date" id="date">

    <button onclick="save()">💾 حفظ التغييرات</button>
    <button class="back" onclick="goBack()">⬅️ رجوع</button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
// ⚠️ بدل هاد الكود بالـ config ديالك من Firebase
const firebaseConfig = {
    apiKey: "AIzaSyDUMMY-KEY-REPLACE-WITH-YOURS",
    authDomain: "karni-pro.firebaseapp.com",
    databaseURL: "https://karni-pro-default-rtdb.firebaseio.com",
    projectId: "karni-pro",
    storageBucket: "karni-pro.appspot.com",
    messagingSenderId: "123456789",
    appId: "1:123456789:web:abcdef123456"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const urlParams = new URLSearchParams(window.location.search);
const id = urlParams.get('id');

if(!id){
    alert('خطأ: ما كاينش id فالرابط');
    goBack();
}

const ref = db.ref('customers/' + id);

// قرا البيانات
ref.once('value').then(snap=>{
    if(snap.exists()){
        const data = snap.val();
        document.getElementById('name').textContent = data.name || 'بدون اسم';
        document.getElementById('phone').textContent = data.phone || '';
        document.getElementById('amount').value = data.amount || 0;
        document.getElementById('date').value = data.paymentDate || '';
    }else{
        alert('الزبون غير موجود');
        goBack();
    }
});

// حفظ التغييرات
function save(){
    const amount = parseFloat(document.getElementById('amount').value) || 0;
    const date = document.getElementById('date').value;
    
    ref.update({
        amount: amount,
        paymentDate: date,
        updatedAt: new Date().toISOString()
    }).then(()=>{
        alert('✅ تم الحفظ بنجاح');
        goBack();
    }).catch(err=>{
        alert('خطأ: ' + err.message);
    });
}

function goBack(){
    window.location.href = 'index.html';
}
</script>
</body>
</html>
