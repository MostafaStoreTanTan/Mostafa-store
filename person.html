<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karni Pro - تجربة الاتصال</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Cairo', sans-serif; background: #f0fdfa; padding: 20px; text-align: center; color: #0f172a; }
        .test-card { background: white; max-width: 400px; margin: 30px auto; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(15,118,110,0.15); border: 2px solid #ccfbf1; }
        .status-badge { display: inline-block; padding: 6px 15px; border-radius: 50px; font-weight: bold; margin-bottom: 20px; font-size: 14px; }
        .success { background: #dcfce7; color: #16a34a; }
        .warning { background: #fef9c3; color: #ca8a04; }
        .info-box { background: #f8fafc; padding: 12px; border-radius: 10px; margin: 10px 0; font-size: 14px; font-weight: bold; word-break: break-all; text-align: right; }
        .btn-test { background: linear-gradient(135deg, #0f766e, #14b8a6); color: white; border: none; padding: 12px 20px; border-radius: 10px; font-family: 'Cairo'; font-weight: bold; cursor: pointer; width: 100%; margin-top: 15px; }
        .btn-test:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <h2>📓 لوحة فحص المزامنة والـ ID</h2>
    
    <div class="test-card">
        <div id="idBadge" class="status-badge">جاري فحص الرابط...</div>
        
        <div class="info-box">
            <i class="fas fa-link" style="color: #0f766e;"></i> الـ ID المستخدم حالياً:
            <p id="displayId" style="color: #2563eb; margin-top: 5px;">-</p>
        </div>

        <div class="info-box">
            <i class="fas fa-user" style="color: #0f766e;"></i> اسم الزبون في قاعدة البيانات:
            <p id="displayName" style="color: #0f766e; margin-top: 5px;">جاري جلب البيانات حياً...</p>
        </div>

        <div class="info-box">
            <i class="fas fa-money-bill-wave" style="color: #16a34a;"></i> الدين الحالي المسجل له:
            <p id="displayAmount" style="color: #16a34a; margin-top: 5px;">0.00 درهم</p>
        </div>

        <button class="btn-test" onclick="addTestDebt()">
            <i class="fas fa-plus"></i> إضافة دين تجريبي (+50 درهم)
        </button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getDatabase, ref, onValue, update, push } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

        // إعدادات الـ Firebase الخاصة بمشروعك الحالي
        const firebaseConfig = {
            apiKey: "AIzaSyD5KnoOye-Ns7RNQq9KqGNSmakYydIoLAw",
            authDomain: "my-store-4f430.firebaseapp.com",
            databaseURL: "https://my-store-4f430-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "my-store-4f430",
            storageBucket: "my-store-4f430.firebasestorage.app",
            messagingSenderId: "674007434765",
            appId: "1:674007434765:web:c4005d096ab86167cc3744"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let customerId = "";

        // 1. قراءة وفحص الـ ID
        const urlParams = new URLSearchParams(window.location.search);
        customerId = urlParams.get('id');

        const idBadge = document.getElementById('idBadge');
        const displayId = document.getElementById('displayId');

        if (customerId) {
            // في حال تم فتح الصفحة من الـ index.html بشكل صحيح
            idBadge.className = "status-badge success";
            idBadge.innerHTML = `<i class="fas fa-check-circle"></i> تم استقبال الـ ID بنجاح من الصفحة الرئيسية`;
            displayId.textContent = customerId;
        } else {
            // في حال فتحت الصفحة مباشرة للتجربة (تجاوز الخطأ أوتوماتيكياً)
            customerId = "test_customer_123"; 
            idBadge.className = "status-badge warning";
            idBadge.innerHTML = `<i class="fas fa-exclamation-triangle"></i> الرابط لا يحتوي على ID! تم تفعيل ID تجريبي للفحص`;
            displayId.textContent = customerId + " (تجريبي)";
        }

        // 2. جلب ومراقبة بيانات هذا العميل حياً من Firebase
        const customerRef = ref(db, `customers/${customerId}`);
        onValue(customerRef, (snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.val();
                document.getElementById('displayName').textContent = data.name || "زبون بدون اسم";
                document.getElementById('displayAmount').textContent = (data.amount || 0).toFixed(2) + " درهم";
            } else {
                // إذا كان الـ ID التجريبي أو المرسل غير موجود في السيرفر بعد
                document.getElementById('displayName').textContent = "الزبون غير مسجل في السيرفر";
                document.getElementById('displayAmount').textContent = "0.00 درهم";
            }
        });

        // 3. دالة إضافة حركة تجريبية للتأكد من أن الإرسال للسيرفر يعمل
        window.addTestDebt = function() {
            const currentText = document.getElementById('displayAmount').textContent;
            const currentAmount = parseFloat(currentText) || 0;
            const newAmount = currentAmount + 50;

            const updates = {};
            // تحديث المبلغ الإجمالي للزبون
            updates[`customers/${customerId}/amount`] = newAmount;
            updates[`customers/${customerId}/name`] = document.getElementById('displayName').textContent === "الزبون غير مسجل في السيرفر" ? "زبون تجريبي جديد" : document.getElementById('displayName').textContent;
            
            // إضافة الحركة في سجل المعاملات التاريخي ليتوافق مع كود الـ 1500 سطر
            const transRef = push(ref(db, `customers/${customerId}/transactions`));
            updates[`customers/${customerId}/transactions/${transRef.key}`] = {
                amount: 50,
                date: new Date().toISOString().split('T')[0],
                note: "دين تجريبي فحص الاتصال",
                type: "debt",
                timestamp: Date.now()
            };

            update(ref(db), updates)
                .then(() => alert("ممتاز! تم تحديث البيانات وإرسالها إلى Firebase بنجاح!"))
                .catch(err => alert("فشل الإرسال: " + err.message));
        };
    </script>
</body>
</html>
