<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Customer Profile</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fb;
padding:15px;
padding-bottom:100px;
}

.card{
background:white;
border-radius:20px;
padding:20px;
margin-bottom:15px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.profile{
text-align:center;
}

.photo{
width:120px;
height:120px;
border-radius:50%;
background:#ddd;
margin:auto;
display:flex;
align-items:center;
justify-content:center;
font-size:50px;
overflow:hidden;
cursor:pointer;
}

.photo img{
width:100%;
height:100%;
object-fit:cover;
}

.name{
font-size:32px;
font-weight:bold;
margin-top:15px;
}

.rating{
font-size:28px;
margin-top:10px;
cursor:pointer;
}

.rating-text{
font-size:18px;
font-weight:bold;
margin-top:5px;
}

.phone{
margin-top:15px;
font-size:18px;
}

.actions{
display:flex;
gap:10px;
margin-top:15px;
}

.actions a{
flex:1;
padding:14px;
border-radius:12px;
text-decoration:none;
color:white;
font-weight:bold;
text-align:center;
}

.call-btn{
background:#16a34a;
}

.whatsapp-btn{
background:#22c55e;
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-bottom:15px;
}

.stat{
padding:15px;
border-radius:15px;
color:white;
text-align:center;
}

.green{
background:#16a34a;
}

.red{
background:#dc2626;
}

.blue{
background:#2563eb;
}

.stat-value{
font-size:28px;
font-weight:bold;
}

.calendar-card{
text-align:center;
}

.calendar-month{
font-size:18px;
font-weight:bold;
color:#2563eb;
}

.calendar-day{
font-size:60px;
font-weight:bold;
margin:10px 0;
}

.calendar-year{
font-size:18px;
color:#666;
}

.big-btn{
width:100%;
padding:15px;
border:none;
border-radius:12px;
font-size:18px;
font-weight:bold;
cursor:pointer;
margin-top:10px;
}

.depot-btn{
background:#16a34a;
color:white;
}

.paid-btn{
background:#dc2626;
color:white;
}

</style>

</head>

<body>

<div class="card profile">

<div
class="photo"
id="photoContainer">
📷
</div>

<input
type="file"
id="photoInput"
style="display:none">

<div
class="name"
id="customerName">
Customer
</div>

<div
class="rating"
id="customerStars">
⭐⭐⭐⭐⭐
</div>

<div
class="rating-text"
id="ratingText">
Excellent
</div>

<div
class="phone"
id="customerPhone">
📞 -
</div>

<div class="actions">

<a
href="#"
id="callLink"
class="call-btn">
📞 Call
</a>

<a
href="#"
id="whatsappLink"
class="whatsapp-btn">
💬 WhatsApp
</a>

</div>

</div>

<div class="stats">

<div class="stat green">
<div>Total Debt</div>
<div
class="stat-value"
id="totalDebt">
0
</div>
</div>

<div class="stat red">
<div>Total Paid</div>
<div
class="stat-value"
id="totalPaid">
0
</div>
</div>

<div class="stat blue">
<div>Balance</div>
<div
class="stat-value"
id="balance">
0
</div>
</div>

</div>

<div class="card calendar-card">

<div class="calendar-month"
id="calendarMonth">
JUN
</div>

<div class="calendar-day"
id="calendarDay">
20
</div>

<div class="calendar-year"
id="calendarYear">
2026
</div>

<button
class="big-btn"
id="changeDateBtn">
📅 Change Payment Date
</button>

<input
type="date"
id="datePicker"
style="display:none">

</div>

<div class="card">

<button
class="big-btn depot-btn"
id="addDepotBtn">
🟢 Depot
</button>

<button
class="big-btn paid-btn"
id="addPaidBtn">
🔴 Paid
</button>

</div>

<div class="card">

<h2>
📜 Operations
</h2>

<div id="operationsList">
</div>

</div>

<script>

let people =
JSON.parse(
localStorage.getItem("people")
) || [];

let selectedIndex =
localStorage.getItem(
"selectedCustomer"
);

let person =
people[selectedIndex];

if(!person){

document.body.innerHTML =
"<h2>Customer Not Found</h2>";

}

if(!person.operations){
person.operations = [];
}

if(!person.rating){
person.rating = 5;
}

function savePerson(){

people[selectedIndex] =
person;

localStorage.setItem(
"people",
JSON.stringify(people)
);

}

document.getElementById(
"customerName"
).innerText =
person.name || "Customer";

document.getElementById(
"customerPhone"
).innerText =
"📞 " +
(person.phone || "-");

document.getElementById(
"callLink"
).href =
"tel:" +
(person.phone || "");

let whatsappNumber =
(person.phone || "")
.replace(/^0/,"212");

document.getElementById(
"whatsappLink"
).href =
"https://wa.me/" +
whatsappNumber;

function renderRating(){

let stars =
"⭐".repeat(
person.rating
);

document.getElementById(
"customerStars"
).innerText =
stars;

let text = "";

switch(person.rating){

case 1:
text = "Very Bad";
break;

case 2:
text = "Bad";
break;

case 3:
text = "Average";
break;

case 4:
text = "Good";
break;

case 5:
text = "Excellent";
break;

}

document.getElementById(
"ratingText"
).innerText =
text;

}

renderRating();

document.getElementById(
"customerStars"
).onclick = function(){

let rating =
prompt(
"Rating 1-5",
person.rating
);

if(
!rating ||
rating < 1 ||
rating > 5
){
return;
}

person.rating =
Number(rating);

savePerson();

renderRating();

};

if(person.photo){

document.getElementById(
"photoContainer"
).innerHTML =
`<img src="${person.photo}">`;

}

document.getElementById(
"photoContainer"
).onclick = function(){

document
.getElementById(
"photoInput"
)
.click();

};

document.getElementById(
"photoInput"
).onchange = function(e){

let file =
e.target.files[0];

if(!file) return;

let reader =
new FileReader();

reader.onload =
function(event){

person.photo =
event.target.result;

savePerson();

location.reload();

};

reader.readAsDataURL(file);

};

function renderCalendar(){

if(!person.dueDate){

document.getElementById(
"calendarDay"
).innerText = "--";

return;

}

let parts =
person.dueDate.split("-");

const months = [
"JAN","FEB","MAR",
"APR","MAY","JUN",
"JUL","AUG","SEP",
"OCT","NOV","DEC"
];

document.getElementById(
"calendarDay"
).innerText =
parts[2];

document.getElementById(
"calendarMonth"
).innerText =
months[
Number(parts[1]) - 1
];

document.getElementById(
"calendarYear"
).innerText =
parts[0];

}

renderCalendar();

document.getElementById(
"changeDateBtn"
).onclick = function(){

let picker =
document.getElementById(
"datePicker"
);

picker.value =
person.dueDate || "";

picker.showPicker();

};

document.getElementById(
"datePicker"
).onchange = function(){

person.dueDate =
this.value;

savePerson();

renderCalendar();

};

function renderOperations(){

let html = "";

let totalDebt = 0;
let totalPaid = 0;

person.operations.forEach(
(op,index)=>{

if(op.type === "Depot"){
totalDebt += op.amount;
}

if(op.type === "Paid"){
totalPaid += op.amount;
}

html += `

<div style="
background:white;
padding:15px;
margin-top:10px;
border-radius:15px;
border-left:6px solid ${
op.type === "Depot"
? "#16a34a"
: "#dc2626"
};
">

<h3>
${op.type === "Depot"
? "🟢 Depot"
: "🔴 Paid"}
</h3>

<p>
💰 ${op.amount} MAD
</p>

<p>
📅 ${op.date}
</p>

<p>
🕒 ${op.time}
</p>

<button
onclick="editOperation(${index})">
✏️ Edit
</button>

<button
onclick="deleteOperation(${index})">
🗑 Delete
</button>

</div>

`;

});

document.getElementById(
"operationsList"
).innerHTML = html;

document.getElementById(
"totalDebt"
).innerText =
totalDebt + " MAD";

document.getElementById(
"totalPaid"
).innerText =
totalPaid + " MAD";

document.getElementById(
"balance"
).innerText =
(totalDebt - totalPaid)
+ " MAD";

}

renderOperations();

document.getElementById(
"addDepotBtn"
).onclick = function(){

let amount =
prompt("Amount");

if(!amount) return;

let date =
prompt(
"Date YYYY-MM-DD",
new Date()
.toISOString()
.split("T")[0]
);

let time =
prompt(
"Time HH:MM",
new Date()
.toTimeString()
.slice(0,5)
);

person.operations.push({

type:"Depot",

amount:Number(amount),

date:date,

time:time

});

savePerson();

renderOperations();

};

document.getElementById(
"addPaidBtn"
).onclick = function(){

let amount =
prompt("Amount");

if(!amount) return;

let date =
prompt(
"Date YYYY-MM-DD",
new Date()
.toISOString()
.split("T")[0]
);

let time =
prompt(
"Time HH:MM",
new Date()
.toTimeString()
.slice(0,5)
);

person.operations.push({

type:"Paid",

amount:Number(amount),

date:date,

time:time

});

savePerson();

renderOperations();

};

function deleteOperation(index){

if(
!confirm(
"Delete operation?"
)
){
return;
}

person.operations.splice(
index,
1
);

savePerson();

renderOperations();

}

function editOperation(index){

let op =
person.operations[index];

let amount =
prompt(
"Amount",
op.amount
);

if(!amount) return;

let date =
prompt(
"Date",
op.date
);

let time =
prompt(
"Time",
op.time
);

op.amount =
Number(amount);

op.date =
date;

op.time =
time;

savePerson();

renderOperations();

}    
    
</script>

</body>
</html>
