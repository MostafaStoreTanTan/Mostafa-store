<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تفاصيل الزبون - Karni Pro</title>
<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
}

body {
background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
min-height: 100vh;
padding: 20px;
color: #fff;
}

.container {
max-width: 900px;
margin: 0 auto;
}

.header-card {
background: rgba(255, 255, 255, 0.1);
backdrop-filter: blur(10px);
border-radius: 20px;
padding: 30px;
text-align: center;
margin-bottom: 20px;
border: 1px solid rgba(255, 255, 255, 0.2);
box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
}

.avatar-circle {
width: 100px;
height: 100px;
border-radius: 50%;
background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
display: flex;
align-items: center;
justify-content: center;
font-size: 48px;
font-weight: bold;
margin: 0 auto 20px;
box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

.customer-name {
font-size: 28px;
font-weight: bold;
margin-bottom: 10px;
}

.rating {
font-size: 24px;
margin-top: 10px;
}

.card {
background: rgba(255, 255, 255, 0.08);
backdrop-filter: blur(10px);
border-radius: 15px;
padding: 25px;
margin-bottom: 15px;
border: 1px solid rgba(255, 255, 255, 0.15);
}

.info-row {
display: flex;
justify-content: space-between;
align-items: center;
padding: 15px 0;
border-bottom: 1px solid rgba(255, 255, 255, 0.1);
font-size: 18px;
}

.info-row:last-child {
border-bottom: none;
}

.info-label {
font-weight: 600;
opacity: 0.9;
}

.info-value {
font-weight: bold;
}

.balance-positive {
color: #2ecc71;
font-size: 24px;
}

.balance-negative {
color: #e74c3c;
font-size: 24px;
}

.btn {
width: 100%;
padding: 18px;
border: none;
border-radius: 12px;
font-size: 18px;
font-weight: bold;
cursor: pointer;
margin-bottom: 12px;
transition: all 0.3s;
color: white;
}

.btn:hover {
transform: translateY(-2px);
box-shadow: 0 5px 20px rgba(0,0,0,0.3);
}

.btn-deposit {
background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
}

.btn-paid {
background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
}

.btn-export {
background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%);
}

.popup {
display: none;
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: rgba(0,0,0,0.7);
z-index: 1000;
align-items: center;
justify-content: center;
}

.popup-content {
background: #2c3e50;
padding: 30px;
border-radius: 20px;
width: 90%;
max-width: 400px;
}

.popup-content h3 {
margin-bottom: 20px;
text-align: center;
font-size: 22px;
}

.popup-content input {
width: 100%;
padding: 15px;
margin-bottom: 15px;
border-radius: 10px;
border: none;
font-size: 18px;
background: #34495e;
color: white;
}

.popup-content button {
width: 48%;
padding: 12px;
border: none;
border-radius: 10px;
font-size: 16px;
font-weight: bold;
cursor: pointer;
margin: 1%;
}

.btn-confirm {
background: #2ecc71;
color: white;
}

.btn-cancel {
background: #95a5a6;
color: white;
}

.loading {
text-align: center;
font-size: 20px;
padding: 50px;
}

@media (max-width: 768px) {
.container {
padding: 10px;
}
.header-card {
padding: 20px;
}
.customer-name {
font-size: 22px;
}
</style>
</head>
<body>
<div class="container">
<div class="header-card">
<div class="avatar-circle" id="avatarCircle">أ</div>
<div class="customer-name" id="customerName">جاري التحميل...</div>
<div class="rating" id="customerRating">⭐</div>
</div>

<div class="card">
<div class="info-row">
<span class="info-label">رقم الهاتف 📱</span>
<span class="info-value" id="customerPhone">-</span>
</div>
<div class="info-row">
<span class="info-label">تاريخ الإنشاء 📅</span>
<span class="info-value" id="customerDate">-</span>
</div>
<div class="info-row">
<span class="info-label">الرصيد الحالي 💰</span>
<span class="info-value" id="balance">0 درهم</span>
</div>
</div>

<button class="btn btn-deposit" onclick="openPopup('deposit')">🟢 إضافة إيداع +</button>
<button class="btn btn-paid" onclick="openPopup('paid')">🔴 إضافة دفع -</button>
<button class="btn btn-export" onclick="exportToPDF()">📄 تصدير PDF</button>

</div>

<div class="popup" id="popup">
<div class="popup-content">
<h3 id="popupTitle">إضافة عملية</h3>
<input type="number" id="amountInput" placeholder="المبلغ بالدرهم" min="1">
<input type="datetime-local" id="dateInput">
<button class="btn-confirm" onclick="confirmOperation()">تأكيد</button>
<button class="btn-cancel" onclick="closePopup()">إلغاء</button>
</div>
</div>

<script type="module">
// ====== الجزء 1: Firebase + المتغيرات العامة ======
// لا تغلق الـ script - الجزء 2 غيجي تحتها

import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getDatabase, ref, onValue, update, push } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

const firebaseConfig = {
apiKey: "AIzaSyDummyKey",
authDomain: "my-store-4f430.firebaseapp.com",
databaseURL: "https://my-store-4f430-default-rtdb.europe-west1.firebasedatabase.app",
projectId: "my-store-4f430",
storageBucket: "my-store-4f430.appspot.com",
messagingSenderId: "123456789",
appId: "1:123456789:web:abc123"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const urlParams = new URLSearchParams(window.location.search);
const customerId = urlParams.get('id');

let customerData = {};
let operations = [];
let currentOperationType = '';

function getInitials(name) {
if(!name) return 'أ';
return name.charAt(0).toUpperCase();
}

function formatArabicDate(dateString) {
const date = new Date(dateString);
return date.toLocaleDateString('ar-MA', {
year: 'numeric',
month: 'long',
day: 'numeric',
hour: '2-digit',
minute: '2-digit'
});
}

function calculateBalance() {
let totalDeposit = 0;
let totalPaid = 0;

operations.forEach(op => {
if(op.type === 'deposit') {
totalDeposit += parseFloat(op.amount);
} else if(op.type === 'paid') {
totalPaid += parseFloat(op.amount);
}
});

return totalDeposit - totalPaid;
}

window.openPopup = function(type) {
currentOperationType = type;
document.getElementById('popup').style.display = 'flex';
document.getElementById('popupTitle').textContent = type === 'deposit'? 'إضافة إيداع 🟢' : 'إضافة دفع 🔴';
document.getElementById('dateInput').value = new Date().toISOString().slice(0,16);
document.getElementById('amountInput').focus();
}

window.closePopup = function() {
document.getElementById('popup').style.display = 'none';
document.getElementById('amountInput').value = '';
}

window.confirmOperation = function() {
const amount = document.getElementById('amountInput').value;
const date = document.getElementById('dateInput').value;

if(!amount || amount <= 0) {
alert('عمر المبلغ صحيح');
return;
}

const newOperation = {
id: Date.now(),
type: currentOperationType,
amount: parseFloat(amount),
date: date || new Date().toISOString()
};

operations.push(newOperation);

update(ref(db, 'customers/' + customerId), {
operations: operations
}).then(() => {
closePopup();
alert('تمت الإضافة بنجاح ✅');
}).catch((error) => {
alert('خطأ: ' + error.message);
});
}

function loadCustomer() {
if(!customerId) {
document.getElementById('customerName').textContent = 'خطأ: لا يوجد ID';
return;
}

const customerRef = ref(db, 'customers/' + customerId);
onValue(customerRef, (snapshot) => {
const data = snapshot.val();
if(data) {
customerData = data;
operations = data.operations || [];

document.getElementById('customerName').textContent = data.name || 'بدون اسم';
document.getElementById('avatarCircle').textContent = getInitials(data.name);
document.getElementById('customerPhone').textContent = data.phone || 'غير محدد';
document.getElementById('customerDate').textContent = formatArabicDate(data.createdAt || new Date());
document.getElementById('customerRating').textContent = '⭐'.repeat(data.rating || 5);

const balance = calculateBalance();
const balanceEl = document.getElementById('balance');
balanceEl.textContent = balance.toLocaleString('ar-MA') + ' درهم';
balanceEl.className = balance >= 0? 'info-value balance-positive' : 'info-value balance-negative';

} else {
document.getElementById('customerName').textContent = 'الزبون غير موجود';
}
});
}

// ====== الجزء 2: التحسينات المتقدمة ======
// نكمل من بعد الجزء 1 مباشرة

// ====== الأنيميشن عند تحميل الكروت ======
function addCardAnimations() {
const cards = document.querySelectorAll('.card,.header-card');
cards.forEach((card, index) => {
card.style.opacity = '0';
card.style.transform = 'translateY(20px)';
setTimeout(() => {
card.style.transition = 'all 0.5s ease';
card.style.opacity = '1';
card.style.transform = 'translateY(0)';
}, index * 150);
});
}

// ====== تقويم متقدم ======
function setupAdvancedCalendar() {
const dateInput = document.getElementById('dateInput');
const now = new Date();
now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
dateInput.value = now.toISOString().slice(0,16);
dateInput.max = now.toISOString().slice(0,16);
}

// ====== تصدير PDF احترافي ======
window.exportToPDF = function() {
let content = '=================================\n';
content += ' كشف حساب الزبون\n';
content += ' Karni Pro System\n';
content += '=================================\n\n';
content += 'الاسم: ' + (customerData.name || '-') + '\n';
content += 'الهاتف: ' + (customerData.phone || '-') + '\n';
content += 'تاريخ الإنشاء: ' + (customerData.createdAt? new Date(customerData.createdAt).toLocaleDateString('ar-MA') : '-') + '\n';
content += 'تاريخ التصدير: ' + new Date().toLocaleString('ar-MA') + '\n\n';
content += '=================================\n';
content += 'الملخص المالي\n';
content += '=================================\n';

const balance = calculateBalance();
const totalDeposit = operations.filter(op => op.type === 'deposit').reduce((s,op) => s + parseFloat(op.amount), 0);
const totalPaid = operations.filter(op => op.type === 'paid').reduce((s,op) => s + parseFloat(op.amount), 0);

content += 'مجموع الإيداعات: ' + totalDeposit.toLocaleString('ar-MA') + ' درهم\n';
content += 'مجموع الدفعات: ' + totalPaid.toLocaleString('ar-MA') + ' درهم\n';
content += 'الرصيد الحالي: ' + balance.toLocaleString('ar-MA') + ' درهم\n';
content += '=================================\n';
content += 'سجل العمليات\n';
content += '=================================\n\n';

operations.sort((a,b) => new Date(b.date) - new Date(a.date)).forEach((op, index) => {
const type = op.type === 'deposit'? 'إيداع 🟢' : 'دفع 🔴';
const date = formatArabicDate(op.date);
const sign = op.type === 'deposit'? '+' : '-';
content += `${index + 1}. ${date}\n`;
content += ` النوع: ${type}\n`;
content += ` المبلغ: ${sign} ${parseFloat(op.amount).toLocaleString('ar-MA')} درهم\n`;
content += '---------------------------------\n';
});

if(customerData.notes) {
content += '\n=================================\n';
content += 'الملاحظات\n';
content += '=================================\n';
content += customerData.notes + '\n';
}

const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
const link = document.createElement('a');
link.href = URL.createObjectURL(blob);
link.download = (customerData.name || 'زبون') + '_كشف_حساب_' + new Date().toISOString().slice(0,10) + '.txt';
document.body.appendChild(link);
link.click();
document.body.removeChild(link);

alert('تم تصدير الكشف بنجاح ✅');
}

// ====== نسخ احتياطي JSON ======
window.backupCustomer = function() {
const backup = {
customer: {
name: customerData.name,
phone: customerData.phone,
createdAt: customerData.createdAt,
rating: customerData.rating,
notes: customerData.notes
},
operations: operations,
statistics: {
totalDeposit: operations.filter(op => op.type === 'deposit').reduce((s,op) => s + parseFloat(op.amount), 0),
totalPaid: operations.filter(op => op.type === 'paid').reduce((s,op) => s + parseFloat(op.amount), 0),
operationsCount: operations.length
},
exportDate: new Date().toISOString(),
version: '2.0'
};

const dataStr = JSON.stringify(backup, null, 2);
const blob = new Blob([dataStr], { type: 'application/json;charset=utf-8' });
const link = document.createElement('a');
link.href = URL.createObjectURL(blob);
link.download = (customerData.name || 'زبون') + '_backup_' + Date.now() + '.json';
document.body.appendChild(link);
link.click();
document.body.removeChild(link);

alert('تم إنشاء النسخة الاحتياطية بنجاح 💾');
}

// ====== حذف عملية معينة ======
window.deleteOperation = function(opId) {
if(confirm('هل تريد حذف هذه العملية نهائيا؟')) {
operations = operations.filter(op => op.id!== opId);
update(ref(db, 'customers/' + customerId), { operations });
alert('تم الحذف ✅');
}
}

// ====== إحصائيات متقدمة ======
function getAdvancedStats() {
const deposits = operations.filter(op => op.type === 'deposit');
const paids = operations.filter(op => op.type === 'paid');

const stats = {
totalDeposit: deposits.reduce((s,op) => s + parseFloat(op.amount), 0),
totalPaid: paids.reduce((s,op) => s + parseFloat(op.amount), 0),
avgDeposit: deposits.length > 0? deposits.reduce((s,op) => s + parseFloat(op.amount), 0) / deposits.length : 0,
avgPaid: paids.length > 0? paids.reduce((s,op) => s + parseFloat(op.amount), 0) / paids.length : 0,
maxDeposit: deposits.length > 0? Math.max(...deposits.map(op => parseFloat(op.amount))) : 0,
maxPaid: paids.length > 0? Math.max(...paids.map(op => parseFloat(op.amount))) : 0,
lastOperation: operations.length > 0? operations.sort((a,b) => new Date(b.date) - new Date(a.date))[0] : null
};

return stats;
}

// ====== تنبيه الرصيد السالب ======
function checkNegativeBalance() {
const balance = calculateBalance();
if(balance < 0) {
console.warn('⚠️ تحذير: رصيد الزبون سالب بمقدار', Math.abs(balance).toLocaleString('ar-MA'), 'درهم');
document.getElementById('balance').style.animation = 'blink 1s infinite';
}
}

// ====== أنيميشن الوميض ======
const blinkStyle = document.createElement('style');
blinkStyle.textContent = `
@keyframes blink {
0%, 100% { opacity: 1; }
50% { opacity: 0.5; }
}
`;
document.head.appendChild(blinkStyle);

// ====== حفظ تلقائي كل 30 ثانية ======
setInterval(() => {
if(customerId && operations.length > 0) {
update(ref(db, 'customers/' + customerId), {
lastAutoSave: Date.now()
});
console.log('💾 حفظ تلقائي:', new Date().toLocaleTimeString('ar-MA'));
}
}, 30000);

// ====== فحص التغييرات قبل الخروج ======
window.addEventListener('beforeunload', function(e) {
if(operations.length > 0) {
e.preventDefault();
e.returnValue = '';
}
});

// ====== تحسينات الموبايل ======
function mobileOptimizations() {
if(window.innerWidth < 768) {
document.body.classList.add('mobile-view');
document.querySelectorAll('.btn').forEach(btn => {
btn.style.minHeight = '50px';
btn.style.fontSize = '18px';
});
}
}

window.addEventListener('resize', mobileOptimizations);
mobileOptimizations();

// ====== اختصارات الكيبورد ======
document.addEventListener('keydown', function(e) {
if(e.ctrlKey && e.key === 'd') {
e.preventDefault();
openPopup('deposit');
}
if(e.ctrlKey && e.key === 'p') {
e.preventDefault();
openPopup('paid');
}
if(e.ctrlKey && e.key === 'e') {
e.preventDefault();
exportToPDF();
}
if(e.key === 'Escape') {
closePopup();
}
});

// ====== معالجة الأخطاء العامة ======
window.addEventListener('error', function(e) {
console.error('❌ خطأ في الصفحة:', e.message);
});

// ====== تشغيل الدوال عند التحميل ======
addCardAnimations();
setupAdvancedCalendar();

// ====== الجزء 3: الخاتمة والتشغيل ======
// نكمل من بعد الجزء 2 مباشرة

// ====== دوال مساعدة للتواريخ ======
function daysDifference(date1, date2) {
const d1 = new Date(date1);
const d2 = new Date(date2);
const diffTime = Math.abs(d2 - d1);
return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
}

function isToday(dateString) {
const today = new Date().toDateString();
const date = new Date(dateString).toDateString();
return today === date;
}

// ====== تصدير CSV للإكسل ======
window.exportToCSV = function() {
let csv = 'التاريخ,النوع,المبلغ\n';
operations.sort((a,b) => new Date(a.date) - new Date(b.date)).forEach(op => {
const type = op.type === 'deposit'? 'إيداع' : 'دفع';
const date = new Date(op.date).toLocaleString('ar-MA');
csv += `${date},${type},${op.amount}\n`;
});

const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
const link = document.createElement('a');
link.href = URL.createObjectURL(blob);
link.download = (customerData.name || 'زبون') + '_عمليات.csv';
link.click();
alert('تم تصدير ملف Excel CSV ✅');
}

// ====== وضع المطور ======
window.devMode = function() {
console.log('========== Developer Mode ==========');
console.log('Customer ID:', customerId);
console.log('Customer Data:', customerData);
console.log('Operations:', operations);
console.log('Stats:', getAdvancedStats());
console.log('====================================');
alert('تم فتح Developer Mode - شوف Console F12');
}

// ====== فحص سلامة البيانات ======
function validateDataIntegrity() {
let errors = [];
operations.forEach((op, index) => {
if(!op.id) errors.push(`العملية ${index} بدون ID`);
if(!op.type ||!['deposit','paid'].includes(op.type)) errors.push(`العملية ${index} نوع خاطئ`);
if(!op.amount || isNaN(op.amount)) errors.push(`العملية ${index} مبلغ خاطئ`);
});

if(errors.length > 0) {
console.warn('⚠️ أخطاء في البيانات:', errors);
return false;
}
console.log('✅ البيانات سليمة 100%');
return true;
}

// ====== تشغيل الصفحة ======
if(customerId) {
loadCustomer();
console.log('✅ صفحة الزبون جاهزة - ID:', customerId);
setTimeout(() => {
validateDataIntegrity();
checkNegativeBalance();
}, 2000);
} else {
document.body.innerHTML = `
<div style="text-align:center;padding:100px;font-size:24px">
❌ خطأ: لا يوجد معرف الزبون في الرابط<br><br>
تأكد من فتح الصفحة بهاد الشكل:<br>
person.html?id=معرف_الزبون
</div>
`;
}

// ====== معلومات المطور ======
console.log('%c Karni Pro - صفحة تفاصيل الزبون v3.0', 'color:#3498db;font-size:18px;font-weight:bold');
console.log('%c Firebase: my-store-4f430 ✅', 'color:#2ecc71;font-size:14px');
console.log('%c الاختصارات: Ctrl+D إيداع | Ctrl+P دفع | Ctrl+E تصدير', 'color:#f39c12;font-size:13px');

// ====== نهاية الكود الكامل ======
</script>
</body>
</html>
