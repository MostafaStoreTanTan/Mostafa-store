<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تفاصيل الزبون - Karni Pro</title>
<style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Tahoma',sans-serif}
    body{background:#f5f7fa;min-height:100vh}

   .header{
        background:linear-gradient(135deg, #00b894 0%, #00cec9 100%);
        padding:30px 20px 60px;
        border-radius:0 0 30px 30px;
        box-shadow:0 4px 20px rgba(0,184,148,0.3);
        position:relative;
    }
   .header h1{
        color:white;
        font-size:28px;
        text-align:center;
        margin-bottom:10px;
    }
   .back-btn{
        position:absolute;
        top:20px;
        right:20px;
        width:45px;
        height:45px;
        border-radius:15px;
        background:rgba(255,255,255,0.2);
        border:none;
        color:white;
        font-size:22px;
        cursor:pointer;
        backdrop-filter:blur(10px);
    }
   .back-btn:active{transform:scale(0.95)}

   .container{
        padding:20px;
        margin-top:-40px;
        position:relative;
        z-index:2;
    }

   .card{
        background:white;
        border-radius:25px;
        padding:25px;
        margin-bottom:15px;
        box-shadow:0 4px 15px rgba(0,0,0,0.08);
        animation:slideUp 0.4s ease;
    }
    @keyframes slideUp{
        from{opacity:0;transform:translateY(20px)}
        to{opacity:1;transform:translateY(0)}
    }

   .avatar{
        width:80px;
        height:80px;
        border-radius:25px;
        background:linear-gradient(135deg, #00b894, #00cec9);
        color:white;
        font-size:36px;
        font-weight:bold;
        display:flex;
        align-items:center;
        justify-content:center;
        margin:0 auto 15px;
    }

   .name{
        text-align:center;
        font-size:24px;
        font-weight:bold;
        color:#2d3436;
        margin-bottom:5px;
    }

   .phone{
        text-align:center;
        color:#636e72;
        font-size:16px;
        margin-bottom:20px;
    }

   .total-box{
        background:linear-gradient(135deg, #00b894 0%, #00cec9 100%);
        color:white;
        padding:20px;
        border-radius:20px;
        text-align:center;
        margin-bottom:20px;
    }
   .total-label{font-size:14px;opacity:0.9;margin-bottom:5px}
   .total-value{font-size:32px;font-weight:bold}

   .label{
        display:block;
        font-weight:bold;
        color:#2d3436;
        margin:15px 0 8px;
        font-size:15px;
    }

   .input{
        width:100%;
        padding:16px;
        border:2px solid #dfe6e9;
        border-radius:15px;
        font-size:18px;
        background:#f8f9fa;
        transition:0.3s;
    }
   .input:focus{
        border-color:#00b894;
        background:white;
        outline:none;
        box-shadow:0 0 0 3px rgba(0,184,148,0.1);
    }

   .row{
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:12px;
    }

   .save-btn{
        width:100%;
        padding:18px;
        border:none;
        border-radius:15px;
        background:linear-gradient(135deg, #00b894 0%, #00cec9 100%);
        color:white;
        font-size:18px;
        font-weight:bold;
        cursor:pointer;
        margin-top:25px;
        box-shadow:0 4px 15px rgba(0,184,148,0.3);
        transition:0.2s;
    }
   .save-btn:active{
        transform:scale(0.97);
        box-shadow:0 2px 8px rgba(0,184,148,0.2);
    }

   .loading{
        text-align:center;
        padding:50px;
        color:#636e72;
        font-size:18px;
    }

   .date-label{
        font-size:12px;
        color:#74b9ff;
        margin-top:5px;
        font-weight:normal;
    }
</style>
</head>
<body>

<div class="header">
    <button class="back-btn" id="backBtn">⬅️</button>
    <h1>📒 Karni Pro</h1>
</div>

<div class="container">
    <div id="loading" class="loading">جاري التحميل...</div>

    <div id="content" style="display:none">
        <div class="card">
            <div class="avatar" id="avatar">B</div>
            <div class="name" id="name">...</div>
            <div class="phone" id="phone">...</div>

            <div class="total-box">
                <div class="total-label">المبلغ الإجمالي</div>
                <div class="total-value" id="totalAmount">0 درهم</div>
            </div>

            <label class="label">💰 المبلغ الأساسي</label>
            <input type="number" id="amount" class="input" placeholder="0">

            <label class="label">📅 تاريخ الأداء</label>
            <input type="date" id="date" class="input">

            <div class="row">
                <div>
                    <label class="label">📤 دفع - انت عطيتي</label>
                    <input type="number" id="paid" class="input" placeholder="0">
                    <div class="date-label" id="paidDate">تاريخ الدفع: --</div>
                </div>
                <div>
                    <label class="label">📥 استلام - انت خديتي</label>
                    <input type="number" id="received" class="input" placeholder="0">
                    <div class="date-label" id="receivedDate">تاريخ الاستلام: --</div>
                </div>
            </div>

            <button class="save-btn" id="saveBtn">💾 حفظ التغييرات</button>
        </div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBCVOOouLET3GDGyHj2i7ncvUZBjUUVB7Y",
  authDomain: "karni-b9b34.firebaseapp.com",
  databaseURL: "https://karni-b9b34-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "karni-b9b34",
  storageBucket: "karni-b9b34.firebasestorage.app",
  messagingSenderId: "489835094040",
  appId: "1:489835094040:web:109e20fe7b65516903236d"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const urlParams = new URLSearchParams(window.location.search);
const id = urlParams.get('id');

const loading = document.getElementById('loading');
const content = document.getElementById('content');

if(!id){
    alert('خطأ: ما كاينش id\nرجع لـ index.html');
    window.location.href = 'index.html';
}

const customerRef = ref(db, 'customers/' + id);

// دالة حساب المبلغ الإجمالي
function calculateTotal(){
    const amount = parseFloat(document.getElementById('amount').value) || 0;
    const paid = parseFloat(document.getElementById('paid').value) || 0;
    const received = parseFloat(document.getElementById('received').value) || 0;
    const total = amount + received - paid;
    document.getElementById('totalAmount').textContent = total.toFixed(2) + ' درهم';
}

// قرا البيانات
get(customerRef).then((snapshot)=>{
    loading.style.display = 'none';
    content.style.display = 'block';

    if(snapshot.exists()){
        const data = snapshot.val();
        const name = data.name || 'بدون اسم';

        document.getElementById('name').textContent = name;
        document.getElementById('phone').textContent = data.phone || 'لا يوجد هاتف';
        document.getElementById('avatar').textContent = name.charAt(0).toUpperCase();
        document.getElementById('amount').value = data.amount || 0;
        document.getElementById('date').value = data.paymentDate || '';
        document.getElementById('paid').value = data.paid || 0;
        document.getElementById('received').value = data.received || 0;

        if(data.paidDate) document.getElementById('paidDate').textContent = 'تاريخ الدفع: ' + data.paidDate;
        if(data.receivedDate) document.getElementById('receivedDate').textContent = 'تاريخ الاستلام: ' + data.receivedDate;

        calculateTotal();
    }else{
        alert('الزبون غير موجود');
        window.location.href = 'index.html';
    }
}).catch((error)=>{
    alert('خطأ: ' + error.message);
    window.location.href = 'index.html';
});

// حساب تلقائي منين كتبدل أي مبلغ
document.getElementById('amount').addEventListener('input', calculateTotal);
document.getElementById('paid').addEventListener('input', calculateTotal);
document.getElementById('received').addEventListener('input', calculateTotal);

// حفظ
document.getElementById('saveBtn').addEventListener('click', ()=>{
    const btn = document.getElementById('saveBtn');
    btn.textContent = '⏳ جاري الحفظ...';
    btn.disabled = true;

    const amount = parseFloat(document.getElementById('amount').value) || 0;
    const date = document.getElementById('date').value;
    const paid = parseFloat(document.getElementById('paid').value) || 0;
    const received = parseFloat(document.getElementById('received').value) || 0;

    const today = new Date().toISOString().split('T')[0];

    const updateData = {
        amount: amount,
        paymentDate: date,
        paid: paid,
        received: received,
        updatedAt: new Date().toISOString()
    };

    // إلا عطيتي مبلغ، سجل تاريخ الدفع
    if(paid > 0) updateData.paidDate = today;

    // إلا خديتي مبلغ، سجل تاريخ الاستلام
    if(received > 0) updateData.receivedDate = today;

    update(customerRef, updateData).then(()=>{
        btn.textContent = '✅ تم الحفظ';
        setTimeout(()=>{
            window.location.href = 'index.html';
        }, 800);
    }).catch((error)=>{
        alert('خطأ: ' + error.message);
        btn.textContent = '💾 حفظ التغييرات';
        btn.disabled = false;
    });
});

// رجوع
document.getElementById('backBtn').addEventListener('click', ()=>{
    window.location.href = 'index.html';
});
</script>
</body>
</html>
