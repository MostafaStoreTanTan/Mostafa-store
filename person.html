<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تعديل الزبون</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
<style>
*{font-family:'Tajawal',sans-serif;box-sizing:border-box;margin:0;padding:0}
body{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);padding:20px;min-height:100vh}
.card{background:white;border-radius:25px;padding:30px;max-width:500px;margin:0 auto;box-shadow:0 15px 50px rgba(0,0,0,0.2)}
h2{text-align:center;color:#1d3557;margin-bottom:25px;font-size:28px}
.name{font-size:32px;font-weight:900;text-align:center;color:#4361ee;margin-bottom:20px}
.info-box{background:#f8f9fa;border-radius:15px;padding:20px;margin:20px 0;text-align:center}
.label{font-size:16px;color:#666;margin-bottom:8px}
.value{font-size:36px;font-weight:900;color:#ef476f}
.input-group{margin:20px 0}
.input-group label{display:block;font-weight:800;margin-bottom:10px;color:#1d3557;font-size:17px}
.input{width:100%;padding:16px;border:2px solid #ddd;border-radius:14px;font-size:18px;background:#fafafa}
.input:focus{border-color:#4361ee;outline:none;background:white}
.btn{width:100%;padding:18px;background:linear-gradient(135deg,#06d6a0 0%,#1dd1a1 100%);color:white;border:none;border-radius:15px;font-size:18px;font-weight:900;cursor:pointer;margin-top:15px}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(6,214,160,0.4)}
.back-btn{background:#6c757d;margin-top:10px}
.loading{text-align:center;padding:50px;color:white;font-size:20px}
</style>
<script type="importmap">{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js","firebase/database":"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"}}</script>
<script type="module">
import { initializeApp } from 'firebase/app';
import { getDatabase, ref, get, update } from 'firebase/database';

const app = initializeApp({
apiKey: "AIzaSyBCVOOouLET3GDGyHj2i7ncvUZBjUUVB7Y",
databaseURL: "https://users-1eecc-default-rtdb.firebaseio.com",
projectId: "users-1eecc"
});
const db = getDatabase(app);

// جيب ID ديال الزبون من الرابط ?id=xxx
const urlParams = new URLSearchParams(window.location.search);
const customerId = urlParams.get('id');

if(!customerId){
document.body.innerHTML = '<div class="loading">❌ خطأ: لا يوجد ID للزبون</div>';
}

// تحميل بيانات الزبون
async function loadCustomer(){
const snap = await get(ref(db, 'customers/' + customerId));
const c = snap.val();
if(!c){
document.body.innerHTML = '<div class="loading">❌ الزبون غير موجود</div>';
return;
}

document.getElementById('customerName').innerText = c.name;
document.getElementById('originalAmount').innerText = (c.depot || 0).toFixed(2);
document.getElementById('paidAmount').innerText = (c.paid || 0).toFixed(2);
document.getElementById('remainingAmount').innerText = ((c.depot || 0) - (c.paid || 0)).toFixed(2);
document.getElementById('nextDate').value = c.paymentDate || '';
}

// حفظ التعديل
window.savePayment = async function(){
const paidNow = parseFloat(document.getElementById('paidNow').value) || 0;
const nextDate = document.getElementById('nextDate').value;

if(paidNow <= 0){
alert('⚠️ دخل المبلغ اللي عطاك الزبون');
return;
}

const snap = await get(ref(db, 'customers/' + customerId));
const c = snap.val();
const newPaid = (c.paid || 0) + paidNow;
const remaining = c.depot - newPaid;

await update(ref(db, 'customers/' + customerId), {
paid: newPaid,
paymentDate: nextDate,
balance: remaining,
status: remaining <= 0 ? 'paid' : 'pending',
updatedAt: Date.now()
});

alert(`✅ تم الحفظ!\nالمبلغ المدفوع الآن: ${paidNow} درهم\nالباقي: ${remaining.toFixed(2)} درهم\nالموعد القادم: ${nextDate}`);

// رجوع للائحة
window.location.href = 'index.html';
}

// حساب الباقي مباشر
window.calculateRemaining = function(){
const paidNow = parseFloat(document.getElementById('paidNow').value) || 0;
const original = parseFloat(document.getElementById('originalAmount').innerText);
const alreadyPaid = parseFloat(document.getElementById('paidAmount').innerText);
const remaining = original - alreadyPaid - paidNow;
document.getElementById('willRemain').innerText = remaining.toFixed(2);
}

loadCustomer();
</script>
</head>
<body>
<div class="card">
<h2>💰 تسجيل دفعة</h2>
<div class="name" id="customerName">جاري التحميل...</div>

<div class="info-box">
<div class="label">المبلغ الأصلي</div>
<div class="value" id="originalAmount">0</div>
</div>

<div class="info-box" style="background:#e8f5e9">
<div class="label">المدفوع من قبل</div>
<div class="value" style="color:#06d6a0" id="paidAmount">0</div>
</div>

<div class="info-box" style="background:#fff3cd">
<div class="label">الباقي حالياً</div>
<div class="value" style="color:#ff9f1c" id="remainingAmount">0</div>
</div>

<div class="input-group">
<label>💵 المبلغ اللي عطاني دابا:</label>
<input class="input" type="number" step="0.01" id="paidNow" placeholder="مثال: 600" oninput="calculateRemaining()">
<small style="color:#666">مثال: عندو 1000، عطاك 600 → كتب 600</small>
</div>

<div class="info-box" style="background:#e3f2fd">
<div class="label">غيبقى ليه بعد هاد الدفعة</div>
<div class="value" style="color:#4361ee" id="willRemain">0</div>
</div>

<div class="input-group">
<label>📅 تاريخ المرة الجاية:</label>
<input class="input" type="date" id="nextDate">
<small style="color:#666">فاش غترجع عندو</small>
</div>

<button class="btn" onclick="savePayment()">💾 حفظ الدفعة والتاريخ</button>
<button class="btn back-btn" onclick="window.location.href='index.html'">↩️ إلغاء ورجوع</button>
</div>
</body>
</html>
