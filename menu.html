<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الرئيسية - Mostafa Clean Shop</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap');
    * { font-family: 'Cairo', sans-serif; }
  body { background: #f8fafc; }
 .scrollbar-hide::-webkit-scrollbar { display: none; }
 .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

  /* Tablet First Gallery Grid */
 .products-grid{
    display:grid;
    grid-template-columns:repeat(2, minmax(0,1fr));
    gap:12px;
  }
  @media(min-width:600px){.products-grid{grid-template-columns:repeat(3, minmax(0,1fr)); gap:14px;} }
  @media(min-width:900px){.products-grid{grid-template-columns:repeat(4, minmax(0,1fr)); gap:16px;} }
  @media(min-width:1280px){.products-grid{grid-template-columns:repeat(5, minmax(0,1fr));} }
  @media(min-width:1536px){.products-grid{grid-template-columns:repeat(6, minmax(0,1fr));} }

 .product-card{
    background:#fff;
    border-radius:18px;
    border:1px solid #f1f5f9;
    overflow:hidden;
    transition:all.25s ease;
    display:flex;
    flex-direction:column;
  }
 .product-card:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 28px rgba(0,0,0,.08);
    border-color:#e2e8f0;
  }
 .product-image-wrap{
    position:relative;
    aspect-ratio:1/1;
    background:#f8fafc;
    overflow:hidden;
    cursor:zoom-in;
  }
 .product-image-wrap.skeleton{
    position:absolute; inset:0;
    background:linear-gradient(90deg,#f1f5f9 25%,#e2e8f0 50%,#f1f5f9 75%);
    background-size:200% 100%;
    animation:shimmer 1.2s infinite;
  }
  @keyframes shimmer{ 0%{background-position:200% 0} 100%{background-position:-200% 0} }
 .product-img{
    width:100%; height:100%;
    object-fit:contain;
    padding:12px;
    opacity:0;
    transition:opacity.35s ease;
    background:#fff;
  }
 .product-img.loaded{opacity:1}
 .product-info{
    padding:12px 12px 14px;
    display:flex;
    flex-direction:column;
    gap:4px;
    flex:1;
  }
 .product-name{
    font-size:13px;
    font-weight:600;
    color:#0f172a;
    line-height:1.4;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
    min-height:36px;
  }
 .product-price{
    font-size:13.5px;
    font-weight:800;
    color:#059669;
    margin-top:2px;
  }

  /* Lightbox */
 .lightbox{
    position:fixed; inset:0;
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
 .lightbox.active{display:flex}
 .lightbox-backdrop{
    position:absolute; inset:0;
    background:rgba(15,23,42,.85);
    backdrop-filter:blur(8px);
    animation:fadeIn.25s ease;
  }
 .lightbox-content{
    position:relative;
    max-width:95vw;
    max-height:90vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    animation:lightboxIn.28s cubic-bezier(.16,1,.3,1);
  }
  @keyframes lightboxIn{ from{opacity:0;transform:scale(.92)} to{opacity:1;transform:scale(1)} }
  @keyframes fadeIn{ from{opacity:0} to{opacity:1} }
 .lightbox-img{
    max-width:95vw;
    max-height:84vh;
    width:auto; height:auto;
    object-fit:contain;
    border-radius:16px;
    background:#fff;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
  }
 .lightbox-caption{
    margin-top:12px;
    color:#e2e8f0;
    font-size:13px;
    font-weight:600;
    text-align:center;
    max-width:90vw;
  }
 .lightbox-close{
    position:absolute;
    top:-12px; left:-12px;
    width:40px; height:40px;
    border-radius:12px;
    background:#fff;
    border:1px solid #e2e8f0;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    box-shadow:0 4px 16px rgba(0,0,0,.2);
    transition:.2s;
    z-index:2;
  }
 .lightbox-close:hover{background:#f8fafc; transform:scale(1.05)}

 .side-menu { transition: transform 0.3s ease-out; }
 .side-menu.hidden { transform: translateX(100%); }
 .animate-fade-in { animation: fadeInUp 0.3s ease-out; }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body class="pb-24">

  <!-- Header -->
  <header class="bg-white shadow-sm sticky top-0 z-40">
    <div class="max-w-[1600px] mx-auto px-4 py-4">
      <div class="flex items-center justify-between">
        <button id="menuBtn" class="w-10 h-10 flex items-center justify-center rounded-lg hover:bg-gray-100 transition">
          <i class="fa-solid fa-bars text-xl text-gray-700"></i>
        </button>
        <div class="flex items-center gap-2">
          <div class="w-10 h-10 bg-emerald-600 rounded-lg flex items-center justify-center">
            <i class="fa-solid fa-broom text-white"></i>
          </div>
          <div>
            <h1 class="text-lg font-bold text-gray-900">Mostafa Clean Shop</h1>
            <p class="text-xs text-gray-500">متجر المنظفات</p>
          </div>
        </div>
        <button class="w-10 h-10 flex items-center justify-center rounded-lg hover:bg-gray-100 transition relative">
          <i class="fa-solid fa-cart-shopping text-xl text-gray-700"></i>
          <span id="cartBadge" class="hidden absolute -top-1 -right-1 w-5 h-5 bg-red-500 text-white text-xs rounded-full flex items-center justify-center">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Side Menu -->
  <div id="sideMenuBackdrop" class="hidden fixed inset-0 bg-black/50 z-40"></div>
  <aside id="sideMenu" class="side-menu hidden fixed top-0 right-0 w-72 h-full bg-white shadow-2xl z-50">
    <div class="p-6 border-b border-gray-100">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-xl font-bold text-gray-900">القائمة</h2>
        <button id="closeMenuBtn" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-gray-100 transition">
          <i class="fa-solid fa-xmark text-gray-500"></i>
        </button>
      </div>
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 bg-emerald-100 rounded-full flex items-center justify-center">
          <i class="fa-solid fa-user text-emerald-600 text-xl"></i>
        </div>
        <div>
          <p class="font-semibold text-gray-900">مصطفى</p>
          <p class="text-xs text-gray-500">مدير المتجر</p>
        </div>
      </div>
    </div>
    <nav class="p-4 space-y-2">
      <a href="menu.html" class="flex items-center gap-3 px-4 py-3 rounded-lg bg-emerald-50 text-emerald-600 font-semibold">
        <i class="fa-solid fa-house w-5"></i>
        <span>الرئيسية</span>
      </a>
      <a href="index.html" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-gray-50 text-gray-700 transition">
        <i class="fa-solid fa-box w-5"></i>
        <span>المنتجات</span>
      </a>
      <a href="customers.html" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-gray-50 text-gray-700 transition">
        <i class="fa-solid fa-users w-5"></i>
        <span>العملاء</span>
      </a>
      <a href="sales.html" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-gray-50 text-gray-700 transition">
        <i class="fa-solid fa-cart-shopping w-5"></i>
        <span>المبيعات</span>
      </a>
      <a href="reports.html" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-gray-50 text-gray-700 transition">
        <i class="fa-solid fa-chart-simple w-5"></i>
        <span>التقارير</span>
      </a>
    </nav>
  </aside>

  <main class="max-w-[1600px] mx-auto px-4 pt-6 pb-6">
    <!-- Welcome -->
    <div class="mb-5">
      <h2 class="text-[22px] md:text-[26px] font-bold text-gray-900 mb-1">أهلاً بك في متجر مصطفى كلين</h2>
      <p class="text-[13px] text-gray-500">تصفح المنتجات - اضغط على الصورة للتكبير</p>
    </div>

    <!-- Search -->
    <div class="bg-white rounded-2xl shadow-sm p-3.5 mb-4 border border-gray-100">
      <div class="relative">
        <input
          type="text"
          id="searchInput"
          placeholder="البحث عن منتج..."
          class="w-full pr-10 pl-4 py-3 rounded-xl border border-gray-200 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 outline-none transition text-[14px]"
        >
        <i class="fa-solid fa-magnifying-glass absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
      </div>
    </div>

    <!-- Category Pills -->
    <div class="mb-5 overflow-x-auto scrollbar-hide">
      <div class="flex gap-2 pb-1" id="categoryContainer"></div>
    </div>

    <!-- Products Grid - Tablet First -->
    <div id="productsGrid" class="products-grid"></div>

    <!-- No Results -->
    <div id="noResults" class="hidden text-center py-16">
      <div class="w-20 h-20 mx-auto mb-4 bg-gray-100 rounded-full flex items-center justify-center">
        <i class="fa-solid fa-search text-2xl text-gray-400"></i>
      </div>
      <h3 class="text-lg font-semibold text-gray-900 mb-1">لا توجد نتائج</h3>
      <p class="text-sm text-gray-500">لم نعثر على منتجات تطابق بحثك</p>
    </div>
  </main>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox" aria-hidden="true">
    <div id="lightboxBackdrop" class="lightbox-backdrop"></div>
    <div class="lightbox-content">
      <button id="lightboxClose" class="lightbox-close" aria-label="إغلاق الصورة">
        <i class="fa-solid fa-xmark text-gray-700"></i>
      </button>
      <img id="lightboxImg" class="lightbox-img" alt="">
      <div id="lightboxCaption" class="lightbox-caption"></div>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-lg z-40">
    <div class="max-w-7xl mx-auto">
      <div class="grid grid-cols-5 h-16">
        <button class="flex flex-col items-center justify-center gap-1 text-emerald-600 relative">
          <div class="absolute -top-1 w-12 h-1 bg-emerald-600 rounded-full"></div>
          <i class="fa-solid fa-house text-xl"></i>
          <span class="text-xs font-semibold">الرئيسية</span>
        </button>
        <button onclick="window.location.href='customers.html'" class="flex flex-col items-center justify-center gap-1 text-gray-500 hover:text-emerald-600 transition">
          <i class="fa-solid fa-users text-xl"></i>
          <span class="text-xs font-medium">العملاء</span>
        </button>
        <button onclick="window.location.href='products.html'" class="flex flex-col items-center justify-center gap-1 text-gray-500 hover:text-emerald-600 transition">
          <i class="fa-solid fa-box text-xl"></i>
          <span class="text-xs font-medium">المنتجات</span>
        </button>
        <button onclick="window.location.href='sales.html'" class="flex flex-col items-center justify-center gap-1 text-gray-500 hover:text-emerald-600 transition">
          <i class="fa-solid fa-cart-shopping text-xl"></i>
          <span class="text-xs font-medium">المبيعات</span>
        </button>
        <button onclick="window.location.href='reports.html'" class="flex flex-col items-center justify-center gap-1 text-gray-500 hover:text-emerald-600 transition">
          <i class="fa-solid fa-chart-simple text-xl"></i>
          <span class="text-xs font-medium">التقارير</span>
        </button>
      </div>
    </div>
  </nav>

<script type="module">
  import { db } from "./firebase.js";
  import { ref, get } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";

  let allProducts = [];
  let filteredProducts = [];
  let currentCategory = 'الكل';
  let searchQuery = '';

  const productsGrid = document.getElementById('productsGrid');
  const noResults = document.getElementById('noResults');
  const searchInput = document.getElementById('searchInput');
  const categoryContainer = document.getElementById('categoryContainer');
  const menuBtn = document.getElementById('menuBtn');
  const closeMenuBtn = document.getElementById('closeMenuBtn');
  const sideMenu = document.getElementById('sideMenu');
  const sideMenuBackdrop = document.getElementById('sideMenuBackdrop');

  // Lightbox Elements
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const lightboxCaption = document.getElementById('lightboxCaption');
  const lightboxClose = document.getElementById('lightboxClose');
  const lightboxBackdrop = document.getElementById('lightboxBackdrop');

  async function init() {
    await loadProducts();
    setupEventListeners();
    setupLightbox();
  }

  async function loadProducts() {
    const snapshot = await get(ref(db, "products"));
    if (snapshot.exists()) {
        const products = Object.values(snapshot.val());
        allProducts = products.filter(p => p.hidden === false || p.hidden === undefined);
    } else {
        allProducts = [];
    }
    performSearch();
    renderCategories();
  }

  function renderCategories() {
    const categories = ['الكل',...new Set(allProducts.map(p => p.category).filter(Boolean))];
    categoryContainer.innerHTML = categories.map(cat => `
      <button
        class="category-pill ${cat === 'الكل'? 'bg-emerald-600 text-white shadow-sm' : 'bg-white text-gray-700 border border-gray-200 hover:border-emerald-300'} px-4 py-2 rounded-full text-[13px] font-medium whitespace-nowrap transition"
        data-category="${cat}"
      >
        ${cat}
      </button>
    `).join('');

    document.querySelectorAll('.category-pill').forEach(pill => {
      pill.addEventListener('click', () => {
        currentCategory = pill.dataset.category;
        updateCategoryUI(pill);
        performSearch();
      });
    });
  }

  function updateCategoryUI(activePill) {
    document.querySelectorAll('.category-pill').forEach(p => {
      p.classList.remove('bg-emerald-600', 'text-white', 'shadow-sm');
      p.classList.add('bg-white', 'text-gray-700', 'border', 'border-gray-200');
    });
    activePill.classList.remove('bg-white', 'text-gray-700', 'border', 'border-gray-200');
    activePill.classList.add('bg-emerald-600', 'text-white', 'shadow-sm');
  }

  function renderProducts() {
    if (filteredProducts.length === 0) {
      productsGrid.innerHTML = '';
      noResults.classList.remove('hidden');
    } else {
      noResults.classList.add('hidden');
      productsGrid.innerHTML = filteredProducts.map((p, idx) => createProductCard(p, idx)).join('');
    }
  }

  function createProductCard(product, index) {
    const hasValidPrice = product.price!== null && product.price!== undefined &&!isNaN(Number(product.price)) && Number(product.price) > 0;
    const priceText = hasValidPrice? `${Number(product.price).toFixed(2)} درهم` : '';
    const isFirstRow = index < 8;

    return `
      <div class="product-card animate-fade-in">
        <div class="product-image-wrap" data-image="${(product.image||'').replace(/"/g,'&quot;')}" data-name="${(product.name||'').replace(/"/g,'&quot;')}">
          <div class="skeleton"></div>
          <img
            src="${product.image || ''}"
            alt="${product.name || 'منتج'}"
            class="product-img"
            loading="${isFirstRow? 'eager' : 'lazy'}"
            decoding="async"
            ${isFirstRow? 'fetchpriority="high"' : ''}
            onerror="this.style.display='none'; this.nextElementSibling && (this.nextElementSibling.style.display='flex')"
            onload="this.classList.add('loaded'); this.previousElementSibling && (this.previousElementSibling.style.display='none')"
          >
          <div style="display:none; position:absolute; inset:0; align-items:center; justify-content:center; background:#f8fafc; color:#94a3b8; font-size:12px;">
            <i class="fa-solid fa-image"></i>
          </div>
        </div>
        <div class="product-info">
          <div class="product-name">${product.name || 'بدون اسم'}</div>
          ${hasValidPrice? `<div class="product-price">${priceText}</div>` : ''}
        </div>
      </div>
    `;
  }

  function setupLightbox(){
    // Open on image click - delegation
    productsGrid.addEventListener('click', (e)=>{
      const wrap = e.target.closest('.product-image-wrap');
      if(!wrap) return;
      const imgSrc = wrap.getAttribute('data-image');
      const name = wrap.getAttribute('data-name');
      if(imgSrc) openLightbox(imgSrc, name);
    });

    lightboxClose.addEventListener('click', closeLightbox);
    lightboxBackdrop.addEventListener('click', closeLightbox);

    document.addEventListener('keydown', (e)=>{
      if(e.key === 'Escape' && lightbox.classList.contains('active')){
        closeLightbox();
      }
    });
  }

  function openLightbox(src, name){
    lightboxImg.src = src;
    lightboxImg.alt = name || '';
    lightboxCaption.textContent = name || '';
    lightbox.classList.add('active');
    lightbox.setAttribute('aria-hidden','false');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox(){
    lightbox.classList.remove('active');
    lightbox.setAttribute('aria-hidden','true');
    document.body.style.overflow = '';
    // تأخير إزالة الصورة لتجنب الوميض
    setTimeout(()=>{
      if(!lightbox.classList.contains('active')){
        lightboxImg.src = '';
      }
    }, 200);
  }

  function performSearch() {
    filteredProducts = allProducts.filter(p => {
      const matchesSearch = (p.name || "").toLowerCase().includes(searchQuery.toLowerCase());
      const matchesCategory = currentCategory === 'الكل' || p.category === currentCategory;
      return matchesSearch && matchesCategory;
    });
    filteredProducts.sort((a, b) => (a.name||'').localeCompare(b.name||''));
    renderProducts();
  }

  function setupEventListeners() {
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      performSearch();
    });

    menuBtn.addEventListener('click', () => {
      sideMenu.classList.remove('hidden');
      sideMenuBackdrop.classList.remove('hidden');
    });

    closeMenuBtn.addEventListener('click', closeSideMenu);
    sideMenuBackdrop.addEventListener('click', closeSideMenu);
  }

  function closeSideMenu() {
    sideMenu.classList.add('hidden');
    sideMenuBackdrop.classList.add('hidden');
  }

  window.addEventListener('storage', (e) => {
    if (e.key === 'products') {
      loadProducts();
    }
  });

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      loadProducts();
    }
  });

  // نحتفظ بالدالة للتوافق لكن لا نستخدمها عند الضغط على الصورة
  window.openProductDetails = function(productId) {
    window.location.href = `product-details.html?id=${productId}`;
  }

  document.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
