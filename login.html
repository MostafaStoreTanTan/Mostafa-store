<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Karni Pro Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Cairo,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:
linear-gradient(
135deg,
#0f766e,
#14b8a6,
#5eead4
);
overflow:hidden;
}

.box{
width:340px;
background:rgba(255,255,255,.15);
backdrop-filter:blur(15px);
padding:30px;
border-radius:30px;
box-shadow:0 15px 40px rgba(0,0,0,.25);
border:1px solid rgba(255,255,255,.2);
}

.logo{
text-align:center;
font-size:90px;
margin-bottom:10px;
}

.title{
text-align:center;
color:white;
font-size:35px;
font-weight:bold;
margin-bottom:5px;
}

.subtitle{
text-align:center;
color:#e6fffb;
font-size:14px;
margin-bottom:25px;
}

.input{
width:100%;
padding:14px;
border:none;
outline:none;
border-radius:15px;
margin-bottom:15px;
background:rgba(255,255,255,.25);
color:white;
font-size:15px;
}

.input::placeholder{
color:#e5e7eb;
}

.password-box{
position:relative;
}

.eye{
position:absolute;
left:15px;
top:50%;
transform:translateY(-50%);
cursor:pointer;
font-size:20px;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:15px;
background:white;
color:#0f766e;
font-size:16px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.03);
}

#error{
margin-top:15px;
text-align:center;
color:#ffdddd;
font-size:14px;
}

</style>
</head>
<body>

<div class="box">

<div class="logo">
🧾
</div>

<div class="title">
Karni Pro
</div>

<div class="subtitle">
نظام إدارة الزبناء والديون
</div>

<input
type="email"
id="email"
class="input"
placeholder="البريد الإلكتروني">

<div class="password-box">

<input
type="password"
id="password"
class="input"
placeholder="كلمة المرور">

<span
class="eye"
onclick="togglePassword()">
👁️
</span>

</div>

<button onclick="login()">
تسجيل الدخول
</button>

<div id="error"></div>

</div>

<script>

function togglePassword(){

const pass =
document.getElementById("password");

pass.type =
pass.type==="password"
? "text"
: "password";

}

function login(){

window.location.href="index.html";

}

</script>

</body>
</html>
