<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Karni Pro Login</title>

<style>

body{
font-family:Cairo,sans-serif;
background:#f0fdfd;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.box{
background:white;
padding:30px;
border-radius:20px;
width:320px;
box-shadow:0 10px 30px rgba(0,0,0,.1);
}

h1{
text-align:center;
color:#0f766e;
}

input{
width:100%;
padding:12px;
margin-top:10px;
margin-bottom:15px;
border:2px solid #ccfbf1;
border-radius:10px;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#0f766e;
color:white;
font-weight:bold;
cursor:pointer;
}

#error{
color:red;
text-align:center;
margin-top:10px;
}

</style>
</head>
<body>

<div class="box">

<h1>🔒 Karni Pro</h1>

<input
type="email"
id="email"
placeholder="البريد الإلكتروني">

<input
type="password"
id="password"
placeholder="كلمة المرور">

<button onclick="login()">
تسجيل الدخول
</button>

<div id="error"></div>

</div>

<script type="module">

import { initializeApp }
from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';

import {
getAuth,
signInWithEmailAndPassword
}
from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

const firebaseConfig = {

apiKey: "AIzaSyBCVOOouLET3GDGyHj2i7ncvUZBjUUVB7Y",
authDomain: "karni-b9b34.firebaseapp.com",
databaseURL: "https://karni-b9b34-default-rtdb.europe-west1.firebasedatabase.app",
projectId: "karni-b9b34",
storageBucket: "karni-b9b34.firebasestorage.app",
messagingSenderId: "489835094040",
appId: "1:489835094040:web:109e20fe7b65516903236d"

};

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

window.login = async function(){

const email =
document.getElementById('email').value;

const password =
document.getElementById('password').value;

try{

await signInWithEmailAndPassword(
auth,
email,
password
);

window.location.href =
'index.html';

}catch(error){

document.getElementById('error')
.textContent =
'البريد أو كلمة المرور غير صحيحة';

}

}

</script>

</body>
</html>
