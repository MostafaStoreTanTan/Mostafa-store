<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Products</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>

.product-card{
display:flex;
align-items:center;
gap:15px;
background:white;
padding:12px;
border-radius:18px;
box-shadow:0 3px 10px rgba(0,0,0,.08);
cursor:pointer;
transition:.25s;
}

.product-card:hover{
transform:translateY(-2px);
box-shadow:0 8px 18px rgba(0,0,0,.12);
}

.product-image{
width:90px;
height:90px;
border-radius:16px;
object-fit:cover;
background:#f1f5f9;
flex-shrink:0;
}

.product-info{
flex:1;
}

.product-info h3{
font-size:18px;
color:#111827;
margin-bottom:6px;
}

.product-info p{
font-size:14px;
color:#6b7280;
}

.grid-view{
grid-template-columns:repeat(2,1fr)!important;
}

.grid-view .product-card{
display:block;
padding:10px;
text-align:center;
}

.grid-view .product-image{
width:100%;
height:170px;
margin-bottom:10px;
}

.grid-view .product-info{
display:none;
}

.grid-view .product-card{
border-radius:20px;
overflow:hidden;
padding:0;
background:white;
}

.grid-view .product-image{
width:100%;
height:220px;
object-fit:cover;
margin:0;
display:block;
}

.grid-view .product-card:hover{
transform:scale(1.03);
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:#f4f7fb;
direction:rtl;
overflow-x:hidden;
padding-bottom:90px;
}

.header{
background:linear-gradient(135deg,#0F766E,#14B8A6);
padding:20px;
border-radius:0 0 25px 25px;
color:white;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.header-top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px;
}

.back-btn{
width:42px;
height:42px;
border:none;
border-radius:12px;
background:white;
color:#0F766E;
font-size:22px;
font-weight:bold;
cursor:pointer;
}

.title{
font-size:24px;
font-weight:bold;
}

.view-btn{
width:42px;
height:42px;
border:none;
border-radius:12px;
background:white;
color:#0F766E;
font-size:20px;
cursor:pointer;
}

.search-box{
margin-top:10px;
}

.search-box input{
width:100%;
padding:14px;
border:none;
border-radius:14px;
font-size:16px;
outline:none;
}

.container{
padding:15px;
}

#productsContainer{
display:grid;
grid-template-columns:1fr;
gap:15px;
}

</style>

</head>

<body>

<div class="header">

<div class="header-top">

<button
class="back-btn"
onclick="window.location.href='index.html'">
⬅️
</button>

<div class="title">
📦 المنتجات
</div>

<button
class="view-btn"
id="toggleView">
🖼️
</button>

</div>

<div class="search-box">

<input
type="text"
id="searchInput"
placeholder="🔍 ابحث عن منتج">

</div>

</div>

<div class="container">

<div id="productsContainer">

</div>

</div>

  <script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";

import {
getDatabase,
ref,
onValue
} from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

const firebaseConfig = {

apiKey:"AIzaSyBCVOOouLET3GDGyHj2i7ncvUZBjUUVB7Y",

authDomain:"karni-b9b34.firebaseapp.com",

databaseURL:"https://karni-b9b34-default-rtdb.europe-west1.firebasedatabase.app",

projectId:"karni-b9b34",

storageBucket:"karni-b9b34.firebasestorage.app",

messagingSenderId:"489835094040",

appId:"1:489835094040:web:109e20fe7b65516903236d"

};

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

let products = [];

const container =
document.getElementById("productsContainer");

onValue(
ref(db,"products"),
(snapshot)=>{

products = snapshot.exists()
? Object.values(snapshot.val())
: [];

renderProducts(products);

});

function renderProducts(list){

container.innerHTML="";

list.forEach(product=>{

container.innerHTML +=`

<div class="product-card"
onclick="window.location.href='product.html?id=${product.id}'">

<img
src="${product.image || 'https://placehold.co/400x400?text=No+Image'}"
class="product-image"
loading="lazy"
onerror="this.src='https://placehold.co/400x400?text=No+Image'">

<div class="product-info">

<h3>${product.name}</h3>

<p>${product.category || ""}</p>

</div>

</div>

`;

});

}

// البحث

document.getElementById("searchInput")
.addEventListener("input",e=>{

const value =
e.target.value.toLowerCase();

const filtered =
products.filter(product=>

(product.name||"")
.toLowerCase()
.includes(value)

);

renderProducts(filtered);

});

// تغيير شكل العرض

let grid = false;

document
.getElementById("toggleView")
.onclick=()=>{

grid=!grid;

if(grid){

container.classList.add("grid-view");

}else{

container.classList.remove("grid-view");

}

};
    
</script>
</body>
</html>
