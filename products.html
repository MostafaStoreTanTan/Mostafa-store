<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام تحضير البون</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background: #e8f5f1; padding: 30px; }
       .container { max-width: 1400px; margin: auto; background: white; padding: 50px; border-radius: 25px; box-shadow: 0 5px 30px rgba(0,0,0,0.15); }
        h1 { color: #0d7377; text-align: center; margin-bottom: 15px; font-size: 3rem; font-weight: 800; }
       .subtitle { text-align: center; color: #666; margin-bottom: 40px; font-size: 1.3rem; }
        
        /* قسم الإضافة */
       .add-section { background: #f0f9f6; padding: 35px; border-radius: 20px; margin-bottom: 40px; border: 3px solid #0d7377; }
       .add-section h2 { color: #0d7377; margin-bottom: 25px; font-size: 1.8rem; }
       .input-grid { display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 20px; align-items: end; }
        label { display: block; margin-bottom: 8px; font-weight: 700; color: #333; font-size: 1.1rem; }
        select, input { width: 100%; padding: 15px; border: 3px solid #ddd; border-radius: 12px; font-size: 18px; }
        select:focus, input:focus { outline: none; border-color: #0d7377; }
       .btn-add { background: #0d7377; color: white; padding: 15px 40px; border: none; border-radius: 12px; cursor: pointer; font-size: 20px; font-weight: 700; height: 56px; }
       .btn-add:hover { background: #0a5a5e; }
        
        /* الجدول */
       .table-box { margin-top: 40px; }
       .table-box h2 { color: #0d7377; margin-bottom: 20px; font-size: 1.8rem; }
        table { width: 100%; border-collapse: collapse; font-size: 18px; }
        th, td { border: 2px solid #ddd; padding: 20px; text-align: right; }
        th { background: #0d7377; color: white; font-size: 20px; font-weight: 700; }
        tr { background: white; transition: 0.3s; }
        tr.done { background: #c8e6c9!important; }
        tr.done td { color: #1b5e20; font-weight: 700; }
       .checkbox { width: 35px; height: 35px; cursor: pointer; accent-color: #10b981; }
       .result-text { color: #0d7377; font-weight: 800; font-size: 22px; }
       .remainder-text { color: #f59e0b; font-weight: 800; font-size: 22px; }
       .btn-delete { background: #ef4444; color: white; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
       .btn-delete:hover { background: #dc2626; }
        
        /* الملخص */
       .summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-top: 30px; }
       .summary-card { background: #f0f9f6; padding: 25px; border-radius: 15px; text-align: center; border: 2px solid #0d7377; }
       .summary-card.value { font-size: 2.5rem; font-weight: 800; color: #0d7377; }
       .summary-card.label { font-size: 1.1rem; color: #666; margin-top: 5px; }
        
        @media (max-width: 768px) {
           .input-grid { grid-template-columns: 1fr; }
           .summary { grid-template-columns: repeat(2, 1fr); }
            h1 { font-size: 2rem; }
            table { font-size: 14px; }
            th, td { padding: 12px 8px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>نظام تحضير البون</h1>
        <p class="subtitle">اختر المنتج وأدخل الكمية وعدد القطع في العلبة</p>
        
        <div class="add-section">
            <h2>إضافة منتج للبون</h2>
            <div class="input-grid">
                <div>
                    <label>اسم المنتج</label>
                    <select id="productSelect">
                        <option value="">-- اختر المنتج --</option>
                    </select>
                </div>
                <div>
                    <label>الكمية المطلوبة</label>
                    <input type="number" id="qtyInput" placeholder="العدد" min="1">
                </div>
                <div>
                    <label>عدد القطع في العلبة</label>
                    <input type="number" id="piecesInput" placeholder="العدد" min="1">
                </div>
                <button class="btn-add" onclick="addToBon()">إضافة</button>
            </div>
        </div>

        <div class="table-box">
            <h2>البون النهائي</h2>
            <table id="bonTable">
                <thead>
                    <tr>
                        <th style="width:60px;">#</th>
                        <th>اسم المنتج</th>
                        <th style="width:150px;">الكمية المطلوبة</th>
                        <th style="width:150px;">عدد القطع في العلبة</th>
                        <th style="width:250px;">النتيجة</th>
                        <th style="width:80px;">تم</th>
                        <th style="width:80px;">حذف</th>
                    </tr>
                </thead>
                <tbody id="bonBody">
                    <tr><td colspan="7" style="text-align:center; color:#999; padding:40px;">لم يتم إضافة أي منتج بعد</td></tr>
                </tbody>
            </table>
        </div>

        <div class="summary">
            <div class="summary-card">
                <div class="value" id="totalProducts">0</div>
                <div class="label">إجمالي المنتجات</div>
            </div>
            <div class="summary-card">
                <div class="value" id="doneProducts" style="color:#10b981;">0</div>
                <div class="label">المنتجات المجهزة</div>
            </div>
            <div class="summary-card">
                <div class="value" id="remainProducts" style="color:#ef4444;">0</div>
                <div class="label">المتبقي</div>
            </div>
            <div class="summary-card">
                <div class="value" id="percentProducts" style="color:#0d7377;">0%</div>
                <div class="label">نسبة الإنجاز</div>
            </div>
        </div>
    </div>

    <script>
        // جميع المنتجات المستخرجة من الصور
        const products = [
            "aryalya","ariel matik 3LT","bay bay 2","bay bay 3","baygon","bic","big rollo","balaï pinar 194",
            "cal bakal4","cal bakal5","cal bakal6","cal vp 4","calin rp 2","calin rp 3","calin rp 4","calin rp 5","calin rp 6",
            "cadum 190 ml","chifon sfar","colgate 25 ml protection","colgate 100 ml","colgate max whaite coffee","colgate maxe white","colgate triple action 125 ml","colgete 25 ml triple action",
            "dalaa 300","dalaa 550","dalaa bakal 4","dalaa bakal 5","dalaa bakal 6","dalaa new born","dalaa rp 2","dalaa rp 3","dalaa rp 5","dalaa vp 2","dalaa vp 3","dalaa vp 4","dalaa vp 5","dalaa vp 6",
            "diva classique","diva maxi","dove","dossy m Marseille","dossy Marseille 1.25","dossy Marseille 1.25",
            "ELSADA noix coco","ELSADA sec du mar","Elsada secret de maroc","faida","Film 1.800","Film 300 m","film 1200",
            "GOT A GOT","head & scholders ne3na3","head & scholders rose","indomie","javel dossy","javel dossy 5L",
            "lingette 60","lingette 100","manche 1.40m milk","manche bois 1.3","Mia 14","mia 8","mia 9","mia 12","mia xxl","mia maternit","microfibre 2 pièce","microfibre 5 pièce",
            "nova kh","nova pp","onesto","pando","peros 3 LT","peros 9 kg","prima","prima pant","purex ph 9","Raclette 55 cm","rexy","Rimy 1.25 cit","Rimy 1.25 lav","rimy sav des mains",
            "sac pobelle 10*35","sac pobelle 20*35","sac poubelle 40*35","sango cit","sango floral","sango lav","sango oceon","sango oud","sango rose","sango vanille","sango sachet lav",
            "sany ph","savon zhar zaytoun 12","shampoing chapo","silk deter","silk jumbo 6","square","storm","tiger","yes 1=10","yes 2","yes 3","yes 5","yes 6","yes eco 4","yes eco 6","zayna"
        ];

        let bon = [];
        let bonCounter = 1;

        // تعبئة القائمة المنسدلة
        window.onload = function() {
            const select = document.getElementById('productSelect');
            products.sort().forEach(p => {
                const option = document.createElement('option');
                option.value = p;
                option.textContent = p;
                select.appendChild(option);
            });
        }

        function addToBon() {
            const product = document.getElementById('productSelect').value;
            const qty = parseInt(document.getElementById('qtyInput').value);
            const pieces = parseInt(document.getElementById('piecesInput').value);
            
            if (!product) {
                alert('الرجاء اختيار المنتج');
                return;
            }
            if (!qty || qty < 1) {
                alert('الرجاء إدخال الكمية المطلوبة');
                return;
            }
            if (!pieces || pieces < 1) {
                alert('الرجاء إدخال عدد القطع في العلبة');
                return;
            }

            bon.push({ id: bonCounter++, name: product, qty: qty, pieces: pieces, done: false });
            
            // تفريغ الخانات
            document.getElementById('productSelect').value = '';
            document.getElementById('qtyInput').value = '';
            document.getElementById('piecesInput').value = '';
            
            renderBon();
        }

        function renderBon() {
            const tbody = document.getElementById('bonBody');
            
            if (bon.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:#999; padding:40px;">لم يتم إضافة أي منتج بعد</td></tr>';
                updateSummary();
                return;
            }

            tbody.innerHTML = bon.map((item, i) => {
                const boxes = Math.floor(item.qty / item.pieces);
                const remainder = item.qty % item.pieces;
                
                let resultHtml = '';
                if (boxes > 0) resultHtml += `<span class="result-text">${boxes} علبة</span>`;
                if (remainder > 0) {
                    if (resultHtml) resultHtml += ' + ';
                    resultHtml += `<span class="remainder-text">${remainder} قطع</span>`;
                }
                if (!resultHtml) resultHtml = `<span class="remainder-text">${item.qty} قطع</span>`;
                
                return `
                    <tr class="${item.done ? 'done' : ''}">
                        <td>${i + 1}</td>
                        <td><strong style="font-size:20px;">${item.name}</strong></td>
                        <td style="font-size:20px; font-weight:700;">${item.qty}</td>
                        <td style="font-size:20px;">${item.pieces} قطع</td>
                        <td>${resultHtml}</td>
                        <td><input type="checkbox" class="checkbox" ${item.done ? 'checked' : ''} onchange="toggleDone(${item.id})"></td>
                        <td><button class="btn-delete" onclick="deleteItem(${item.id})">حذف</button></td>
                    </tr>
                `;
            }).join('');
            
            updateSummary();
        }

        function toggleDone(id) {
            const item = bon.find(i => i.id === id);
            if (item) {
                item.done = !item.done;
                renderBon();
            }
        }

        function deleteItem(id) {
            if (confirm('هل تريد حذف هذا المنتج من البون؟')) {
                bon = bon.filter(i => i.id !== id);
                renderBon();
            }
        }

        function updateSummary() {
            const total = bon.length;
            const done = bon.filter(i => i.done).length;
            const remain = total - done;
            const percent = total > 0 ? Math.round((done / total) * 100) : 0;
            
            document.getElementById('totalProducts').textContent = total;
            document.getElementById('doneProducts').textContent = done;
            document.getElementById('remainProducts').textContent = remain;
            document.getElementById('percentProducts').textContent = percent + '%';
        }

        // Enter key للإضافة
        document.getElementById('piecesInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') addToBon();
        });
    </script>
</body>
</html>
