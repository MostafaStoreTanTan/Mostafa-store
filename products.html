<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karni Pro - Products</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
--primary:#0f766e;
--primary-light:#14b8a6;
--bg:#f0fdfd;
--card:#ffffff;
--text:#0f172a;
--border:#ccfbf1;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:var(--bg);
padding-bottom:100px;
}

.header{
background:linear-gradient(135deg,#0f766e,#14b8a6);
color:white;
padding:25px;
text-align:center;
font-size:28px;
font-weight:800;
}

.search-box{
padding:15px;
}

.search-box input{
width:100%;
padding:14px;
border-radius:14px;
border:2px solid var(--border);
font-size:16px;
}

.products-list{
padding:15px;
display:flex;
flex-direction:column;
gap:15px;
}

.product-card{
background:white;
border-radius:18px;
padding:15px;
box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.product-name{
font-size:20px;
font-weight:800;
margin-bottom:8px;
}

.product-price{
color:#0f766e;
font-size:18px;
font-weight:700;
}

.product-stock{
margin-top:8px;
font-size:14px;
}

.fab{
position:fixed;
bottom:25px;
left:25px;
width:65px;
height:65px;
border:none;
border-radius:50%;
background:#0f766e;
color:white;
font-size:34px;
cursor:pointer;
}

.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.5);
align-items:center;
justify-content:center;
padding:20px;
}

.modal.active{
display:flex;
}

.modal-content{
background:white;
width:100%;
max-width:500px;
padding:20px;
border-radius:20px;
}

.form-group{
margin-bottom:15px;
}

.form-group label{
display:block;
margin-bottom:5px;
font-weight:700;
}

.form-group input{
width:100%;
padding:12px;
border-radius:12px;
border:1px solid #ddd;
}

.save-btn{
width:100%;
padding:14px;
border:none;
border-radius:14px;
background:#0f766e;
color:white;
font-size:16px;
font-weight:700;
}

</style>
</head>
<body>

<div class="header">
📦 المنتجات
</div>

<div class="search-box">
<input type="text" placeholder="ابحث عن منتج..." id="searchInput">
</div>

<div class="products-list" id="productsList">
</div>

<button class="fab" onclick="openModal()">+</button>

<div class="modal" id="productModal">
<div class="modal-content">

<h2>إضافة منتج</h2>

<div class="form-group">
<label>اسم المنتج</label>
<input type="text" id="productName">
</div>

<div class="form-group">
<label>التصنيف</label>
<input type="text" id="productCategory">
</div>

<div class="form-group">
<label>ثمن البيع</label>
<input type="number" id="productPrice">
</div>

<div class="form-group">
<label>عدد القطع</label>
<input type="number" id="productStock">
</div>

<div class="form-group">
<label>عدد القطع في الكارطونة</label>
<input type="number" id="productCarton">
</div>

<div class="form-group">
<label>صور المنتج</label>
<input type="file"
id="productImages"
accept="image/*"
multiple>
</div>

<button class="save-btn" onclick="saveProduct()">
حفظ المنتج
</button>

</div>
</div>

<script type="module">

import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import {
getDatabase,
ref,
push,
set,
onValue
}
from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

import {
getStorage,
ref as storageRef,
uploadBytes,
getDownloadURL
}
from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js';

const firebaseConfig = {

apiKey: "AIzaSyBCVOOouLET3GDGyHj2i7ncvUZBjUUVB7Y",
authDomain: "karni-b9b34.firebaseapp.com",
databaseURL: "https://karni-b9b34-default-rtdb.europe-west1.firebasedatabase.app",
projectId: "karni-b9b34",
storageBucket: "karni-b9b34.firebasestorage.app",
messagingSenderId: "489835094040",
appId: "1:489835094040:web:109e20fe7b65516903236d"

};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const storage = getStorage(app);

const productsRef = ref(db,'products');

window.openModal = function(){
document.getElementById('productModal').classList.add('active');
}

window.saveProduct = async function(){

const imageFiles =
document.getElementById('productImages').files;

let images = [];

for(const file of imageFiles){

const fileRef = storageRef(
storage,
'products/' + Date.now() + '_' + file.name
);

await uploadBytes(fileRef,file);

const url =
await getDownloadURL(fileRef);

images.push(url);

}

const newRef = push(productsRef);

await set(newRef,{

name:document.getElementById('productName').value,

category:document.getElementById('productCategory').value,

sellPrice:Number(
document.getElementById('productPrice').value
),

stock:Number(
document.getElementById('productStock').value
),

cartonQty:Number(
document.getElementById('productCarton').value
),

images:images,

hidden:false,

createdAt:new Date().toISOString()

});

alert('تم حفظ المنتج');

location.reload();

}

onValue(productsRef,(snapshot)=>{

const data = snapshot.val() || {};

const container =
document.getElementById('productsList');

container.innerHTML='';

Object.keys(data).forEach(id=>{

const p = data[id];

container.innerHTML += `
<div class="product-card">

<div class="product-name">
${p.name}
</div>

<div class="product-price">
${p.sellPrice} درهم
</div>

<div class="product-stock">
المخزون: ${p.stock}
</div>

</div>
`;

});

});

</script>

</body>
</html>
