<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raport Pro</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:#f0fdfd;
padding-bottom:100px;
}

.header{
background:linear-gradient(135deg,#0f766e,#14b8a6);
padding:25px;
text-align:center;
color:white;
box-shadow:0 4px 15px rgba(0,0,0,.15);
}

.header h1{
font-size:28px;
font-weight:bold;
}

.container{
padding:15px;
}

.stats-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-bottom:15px;
}

.stat-card{
background:white;
border-radius:18px;
padding:18px;
text-align:center;
box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.stat-value{
font-size:28px;
font-weight:bold;
color:#0f766e;
margin-bottom:5px;
}

.stat-label{
font-size:14px;
color:#666;
}

.tools-box{
display:flex;
flex-direction:column;
gap:10px;
margin-bottom:20px;
}

.tools-box input{
padding:14px;
border-radius:12px;
border:2px solid #ccfbf1;
font-size:16px;
background:white;
}

.report-section{
background:white;
padding:15px;
border-radius:18px;
margin-bottom:15px;
box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.report-section h2{
margin-bottom:15px;
font-size:18px;
}

.report-row{
display:flex;
justify-content:space-between;
padding:10px 0;
border-bottom:1px solid #eee;
font-size:15px;
}

.report-row:last-child{
border-bottom:none;
}

.bottom-buttons{
position:fixed;
bottom:0;
left:0;
right:0;
background:white;
padding:10px;
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
box-shadow:0 -3px 15px rgba(0,0,0,.1);
}

.bottom-buttons button{
padding:14px;
border:none;
border-radius:12px;
font-size:15px;
font-weight:bold;
cursor:pointer;
}

#whatsappBtn{
background:#25D366;
color:white;
}

#pdfBtn{
background:#ef4444;
color:white;
}

#excelBtn{
background:#22c55e;
color:white;
}

#homeBtn{
background:#0f766e;
color:white;
}



.report-type-wrap{margin-bottom:12px;}
.report-type-btn{
width:100%;padding:15px 18px;border:2px solid #ccfbf1;border-radius:16px;background:white;
font-size:18px;font-weight:800;color:#0f766e;box-shadow:0 3px 10px rgba(0,0,0,.06);cursor:pointer;
transition:.2s;display:flex;align-items:center;justify-content:space-between;
}
.report-type-btn:active{transform:scale(.99);}
.report-type-btn span:last-child{font-size:14px;color:#64748b;}
.mode-panel{display:none;margin-top:10px;background:white;border:1px solid #dff7f3;border-radius:16px;padding:8px;box-shadow:0 3px 10px rgba(0,0,0,.06);}
.mode-panel.show{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.mode-option{border:0;background:#f0fdfa;color:#0f766e;border-radius:12px;padding:12px;font-weight:800;font-size:15px;cursor:pointer;}
.mode-option.active{background:linear-gradient(135deg,#0f766e,#14b8a6);color:white;}

.filters-chart{display:block;margin-bottom:20px;}
.filters-panel{display:flex;flex-direction:column;gap:10px;}
.filters-panel input{width:100%;padding:14px;border-radius:12px;border:2px solid #ccfbf1;font-size:16px;background:white;}
.month-picker{display:none;}
.month-picker.show{display:block;}
.day-picker.hide{display:none;}
.report-row{cursor:pointer;transition:background .15s,transform .15s;}
.report-row:active{background:#f0fdfa;transform:scale(.995);}
.report-row .person-link{color:#0f172a;font-weight:700;}
@media(max-width:520px){
 .report-type-btn{font-size:16px;}
}

</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</head>
<body>

<header class="header">
    <h1>📊 Raport Pro</h1>
</header>

<div class="container">

    <div class="stats-grid">

        <div class="stat-card">
            <div class="stat-value" id="totalReceived">0</div>
            <div class="stat-label">🟢 الاستلامات</div>
        </div>

        <div class="stat-card">
            <div class="stat-value" id="totalPaid">0</div>
            <div class="stat-label">🔴 الدفعات</div>
        </div>

        <div class="stat-card">
            <div class="stat-value" id="netTotal">0</div>
            <div class="stat-label">📈 الصافي</div>
        </div>

        <div class="stat-card">
            <div class="stat-value" id="customersCount">0</div>
            <div class="stat-label">👥 الزبناء</div>
        </div>

    </div>

    <div class="report-type-wrap">
      <button type="button" class="report-type-btn" id="reportTypeBtn">
        <span id="reportTypeLabel">📅 تقرير يومي</span>
        <span>⌄</span>
      </button>
      <div class="mode-panel" id="modePanel">
        <button type="button" class="mode-option active" id="dailyModeBtn">📅 يومي</button>
        <button type="button" class="mode-option" id="monthlyModeBtn">🗓️ شهري</button>
      </div>
    </div>

    <div class="filters-chart">
      <div class="filters-panel">
        <input class="day-picker" type="date" id="reportDate">
        <input class="month-picker" type="month" id="reportMonth">
        <input type="time" id="fromTime" value="00:00">
        <input type="time" id="toTime" value="23:59">
      </div>
    </div>

    <div class="tools-box" style="margin-bottom:20px;">
      <input type="text" id="searchInput" placeholder="🔍 ابحث عن زبون">
    </div>

    <div class="report-section">

        <h2>🟢 الاستلامات</h2>

        <div id="receivedList">

        </div>

    </div>

    <div class="report-section">

        <h2>🔴 الدفعات</h2>

        <div id="paidList">

        </div>

    </div>

</div>

<div class="bottom-buttons">

    <button id="whatsappBtn">
        📱 واتساب
    </button>

    <button id="pdfBtn">
        📄 PDF
    </button>

    <button id="excelBtn">
        📊 Excel
    </button>

    <button id="homeBtn">
        🏠 الرئيسية
    </button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";

import {
    getDatabase,
    ref,
    get
} from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

const firebaseConfig = {

  apiKey: "AIzaSyBCVOOouLET3GDGyHj2i7ncvUZBjUUVB7Y",
  authDomain: "karni-b9b34.firebaseapp.com",
  databaseURL: "https://karni-b9b34-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "karni-b9b34",
  storageBucket: "karni-b9b34.firebasestorage.app",
  messagingSenderId: "489835094040",
  appId: "1:489835094040:web:109e20fe7b65516903236d"

};

const app =
initializeApp(firebaseConfig);

const db =
getDatabase(app);

let allCustomers = {};
let reportMode = 'daily';

const reportDate = document.getElementById('reportDate');
const reportMonth = document.getElementById('reportMonth');
const reportTypeBtn = document.getElementById('reportTypeBtn');
const modePanel = document.getElementById('modePanel');
const reportTypeLabel = document.getElementById('reportTypeLabel');
const dailyModeBtn = document.getElementById('dailyModeBtn');
const monthlyModeBtn = document.getElementById('monthlyModeBtn');

function getLocalDateString(date = new Date()){
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
}

function addLocalDays(dateString, days){
    const d = new Date(`${dateString}T12:00:00`);
    d.setDate(d.getDate() + days);
    return getLocalDateString(d);
}

function getOperationDate(op){
    const date = op.date;
    const time = String(op.time || '00:00').slice(0,5);
    if(!date) return '';
    if(/^00:[0-5]\d$/.test(time)) return addLocalDays(date, 1);
    return date;
}

function timeToMinutes(time){
    const m = String(time || '00:00').match(/^(\d{1,2}):(\d{2})/);
    if(!m) return 0;
    return Number(m[1]) * 60 + Number(m[2]);
}

function formatAmount(value){
    const n = Number(value || 0);
    return Number.isInteger(n) ? String(n) : String(Number(n.toFixed(2)));
}

function escapeHtml(value){
    return String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
}

function operationNet(op){
    const amount = Number(op.amount || 0);
    return op.type === 'received' ? amount : -amount;
}

function monthLabel(year, monthIndex){
    const names = ['يناير','فبراير','مارس','أبريل','ماي','يونيو','يوليوز','غشت','شتنبر','أكتوبر','نونبر','دجنبر'];
    return names[monthIndex] + ' ' + year;
}

function setReportMode(mode){
    reportMode = mode;
    const monthly = mode === 'monthly';
    reportTypeLabel.textContent = monthly ? '🗓️ تقرير شهري' : '📅 تقرير يومي';
    reportMonth.classList.toggle('show', monthly);
    reportDate.classList.toggle('hide', monthly);
    document.getElementById('fromTime').style.display = monthly ? 'none' : '';
    document.getElementById('toTime').style.display = monthly ? 'none' : '';
    dailyModeBtn.classList.toggle('active', !monthly);
    monthlyModeBtn.classList.toggle('active', monthly);
    modePanel.classList.remove('show');
    if(monthly) generateMonthlyReport(reportMonth.value);
    else generateReport(reportDate.value);
}

const today = getLocalDateString();
reportDate.value = today;
reportMonth.value = today.slice(0,7);

async function loadCustomers(){
    const snapshot = await get(ref(db,'customers'));
    if(!snapshot.exists()) return;
    allCustomers = snapshot.val() || {};
    generateReport(today);
}

loadCustomers();

function generateReport(selectedDate){
    const receivedMap={}, receivedTimesMap={}, paidMap={}, paidTimesMap={}, remainingMap={};
    let totalReceived=0,totalPaid=0;
    const fromTime=document.getElementById('fromTime').value||'00:00';
    const toTime=document.getElementById('toTime').value||'23:59';
    const fromMinutes=timeToMinutes(fromTime), toMinutes=timeToMinutes(toTime);
    Object.entries(allCustomers).forEach(([customerId,customer])=>{
        const operations=customer.operations||[];
        let paidAll=0,receivedAll=0;
        operations.forEach(op=>{
            if(op.type==='paid') paidAll+=Number(op.amount||0);
            if(op.type==='received') receivedAll+=Number(op.amount||0);
            if(getOperationDate(op)!==selectedDate) return;
            const opTime=String(op.time||'00:00').slice(0,5), mins=timeToMinutes(opTime);
            const inRange=fromMinutes<=toMinutes ? mins>=fromMinutes&&mins<=toMinutes : mins>=fromMinutes||mins<=toMinutes;
            if(!inRange) return;
            if(op.type==='received'){totalReceived+=Number(op.amount||0);receivedMap[customerId]=(receivedMap[customerId]||0)+Number(op.amount||0);(receivedTimesMap[customerId] ||= []).push(opTime);}
            if(op.type==='paid'){totalPaid+=Number(op.amount||0);paidMap[customerId]=(paidMap[customerId]||0)+Number(op.amount||0);(paidTimesMap[customerId] ||= []).push(opTime);}
        });
        remainingMap[customerId]=Number(customer.amount||0)+paidAll-receivedAll;
    });
    const receivedList=document.getElementById('receivedList'), paidList=document.getElementById('paidList');
    receivedList.innerHTML=''; paidList.innerHTML='';
    Object.keys(receivedMap).sort((a,b)=>Number(receivedMap[b])-Number(receivedMap[a])).forEach(customerId=>{
        const customer=allCustomers[customerId]||{}, name=escapeHtml(customer.name||'بدون اسم');
        const times=[...new Set(receivedTimesMap[customerId]||[])].sort((a,b)=>timeToMinutes(a)-timeToMinutes(b));
        const remaining=Math.round(Number(remainingMap[customerId]||0));
        receivedList.innerHTML += `<div class="report-row report-operation" data-customer-id="${escapeHtml(customerId)}" data-time="${times[0]||'00:00'}" style="display:block"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><span class="person-link">${name}</span><span>${formatAmount(receivedMap[customerId])} درهم</span></div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:7px;font-size:13px"><span style="color:#64748b">🕐 ${times.length?times.join(' • '):'--:--'}</span><span style="font-weight:bold;color:${remaining>0?'red':'green'}">${remaining>0?`🔴 باقي : ${formatAmount(remaining)} درهم`:`🟢 خالص 0 درهم`}</span></div></div>`;
    });
    Object.keys(paidMap).sort((a,b)=>Number(paidMap[b])-Number(paidMap[a])).forEach(customerId=>{
        const customer=allCustomers[customerId]||{}, name=escapeHtml(customer.name||'بدون اسم');
        const times=[...new Set(paidTimesMap[customerId]||[])].sort((a,b)=>timeToMinutes(a)-timeToMinutes(b));
        paidList.innerHTML += `<div class="report-row report-operation" data-customer-id="${escapeHtml(customerId)}" data-time="${times[0]||'00:00'}" style="display:block"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><span class="person-link">${name}</span><span>${formatAmount(paidMap[customerId])} درهم</span></div><div style="margin-top:7px;color:#64748b;font-size:13px">🕐 ${times.length?times.join(' • '):'--:--'}</div></div>`;
    });
    updateStats(totalReceived,totalPaid,new Set([...Object.keys(receivedMap),...Object.keys(paidMap)]).size);
}

function generateMonthlyReport(selectedMonth){
    const receivedMap = {}, paidMap = {}, remainingMap = {};
    let totalReceived=0,totalPaid=0;
    const prefix=String(selectedMonth||reportMonth.value||'').slice(0,7);
    Object.entries(allCustomers).forEach(([customerId,customer])=>{
        const operations=customer.operations||[];
        let paidAll=0, receivedAll=0;
        operations.forEach(op=>{
            if(op.type==='paid') paidAll += Number(op.amount||0);
            if(op.type==='received') receivedAll += Number(op.amount||0);
            const d=getOperationDate(op);
            if(!String(d).startsWith(prefix)) return;
            if(op.type==='received'){ totalReceived+=Number(op.amount||0); receivedMap[customerId]=(receivedMap[customerId]||0)+Number(op.amount||0); }
            if(op.type==='paid'){ totalPaid+=Number(op.amount||0); paidMap[customerId]=(paidMap[customerId]||0)+Number(op.amount||0); }
        });
        remainingMap[customerId]=Number(customer.amount||0)+paidAll-receivedAll;
    });
    renderReportLists(receivedMap,paidMap,remainingMap);
    updateStats(totalReceived,totalPaid,new Set([...Object.keys(receivedMap),...Object.keys(paidMap)]).size);
}

function renderReportLists(receivedMap, paidMap, remainingMap){
    const receivedList=document.getElementById('receivedList'), paidList=document.getElementById('paidList');
    receivedList.innerHTML=''; paidList.innerHTML='';
    const sortByAmount=(map,a,b)=>Number(map[b]||0)-Number(map[a]||0);
    Object.keys(receivedMap).sort((a,b)=>sortByAmount(receivedMap,a,b)).forEach(customerId=>{
        const customer=allCustomers[customerId]||{};
        const name=escapeHtml(customer.name||'بدون اسم');
        const amount=Number(receivedMap[customerId]||0);
        const remaining=Math.round(Number(remainingMap[customerId]||0));
        receivedList.innerHTML += `<div class="report-row report-operation" data-customer-id="${escapeHtml(customerId)}" style="display:block"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><span class="person-link">${name}</span><span>${formatAmount(amount)} درهم</span></div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:7px;font-size:13px"><span style="color:#64748b">🟢 استلام</span><span style="font-weight:bold;color:${remaining>0?'red':'green'}">${remaining>0?`🔴 باقي : ${formatAmount(remaining)} درهم`:`🟢 خالص 0 درهم`}</span></div></div>`;
    });
    Object.keys(paidMap).sort((a,b)=>sortByAmount(paidMap,a,b)).forEach(customerId=>{
        const customer=allCustomers[customerId]||{};
        const name=escapeHtml(customer.name||'بدون اسم');
        const amount=Number(paidMap[customerId]||0);
        paidList.innerHTML += `<div class="report-row report-operation" data-customer-id="${escapeHtml(customerId)}" style="display:block"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><span class="person-link">${name}</span><span>${formatAmount(amount)} درهم</span></div><div style="margin-top:7px;color:#64748b;font-size:13px">🔴 دفع</div></div>`;
    });
}

function updateStats(totalReceived,totalPaid,count){
    document.getElementById('totalReceived').textContent=formatAmount(totalReceived);
    document.getElementById('totalPaid').textContent=formatAmount(totalPaid);
    document.getElementById('netTotal').textContent=formatAmount(totalReceived-totalPaid);
    document.getElementById('customersCount').textContent=count;
}

reportTypeBtn.addEventListener('click',()=>modePanel.classList.toggle('show'));
dailyModeBtn.addEventListener('click',()=>setReportMode('daily'));
monthlyModeBtn.addEventListener('click',()=>setReportMode('monthly'));
reportDate.addEventListener('change',()=>{ if(reportMode==='daily'){generateReport(reportDate.value);} });
reportMonth.addEventListener('change',()=>{ if(reportMode==='monthly'){generateMonthlyReport(reportMonth.value);} });
document.getElementById('fromTime').addEventListener('change',()=>{if(reportMode==='daily')generateReport(reportDate.value);});
document.getElementById('toTime').addEventListener('change',()=>{if(reportMode==='daily')generateReport(reportDate.value);});
document.getElementById('searchInput').addEventListener('input',()=>{
    const search=document.getElementById('searchInput').value.trim().toLowerCase();
    document.querySelectorAll('.report-row').forEach(row=>{row.style.display=row.textContent.toLowerCase().includes(search)?'block':'none';});
});

// الضغط على اسم الزبون يفتح الملف الشخصي ديالو مباشرة.
document.addEventListener('click',e=>{
    const row=e.target.closest('.report-operation');
    if(!row) return;
    const customerId=row.dataset.customerId;
    if(customerId) window.location.href=`person.html?id=${encodeURIComponent(customerId)}`;
});

document.getElementById('homeBtn').addEventListener('click',()=>{window.location.href='index.html';});

document.getElementById('whatsappBtn').addEventListener('click',()=>{
    const monthly=reportMode==='monthly';
    const title=monthly?`📊 تقرير شهر ${reportMonth.value}`:`📊 تقرير يوم ${reportDate.value}`;
    let reportText=title+'\n\n';
    const receivedRows=document.querySelectorAll('#receivedList .report-row:not([style*="display: none"])');
    if(receivedRows.length){reportText+='🟢 الاستلامات\n\n';receivedRows.forEach(row=>{const spans=row.querySelectorAll('span');reportText+=`${spans[0].textContent} - ${spans[1].textContent}\n`;});}
    const paidRows=document.querySelectorAll('#paidList .report-row:not([style*="display: none"])');
    if(paidRows.length){reportText+='\n🔴 الدفعات\n\n';paidRows.forEach(row=>{const spans=row.querySelectorAll('span');reportText+=`${spans[0].textContent} - ${spans[1].textContent}\n`;});}
    reportText+=`\n📈 الصافي: ${document.getElementById('netTotal').textContent} درهم\n👥 عدد الزبناء: ${document.getElementById('customersCount').textContent}\n\nKarni Pro`;
    window.open('https://wa.me/212708457258?text='+encodeURIComponent(reportText),'_blank');
});

document.getElementById('pdfBtn')
.addEventListener('click',()=>{

    const { jsPDF } = window.jspdf;

    const doc = new jsPDF();

    const selectedDate = reportMode === 'monthly' ? reportMonth.value : reportDate.value;

    let content =
`Raport Pro

Report: ${selectedDate}

Received:
${document.getElementById('receivedList').innerText}

Paid:
${document.getElementById('paidList').innerText}

Net:
${document.getElementById('netTotal').textContent}

Customers:
${document.getElementById('customersCount').textContent}
`;

    doc.text(content,10,10);

    doc.save(
        'Raport-' +
        selectedDate +
        '.pdf'
    );

});

</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

</body>
</html>
