<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Route Today</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Tahoma',sans-serif;
}

body{
background:#f4f7fb;
padding:15px;
padding-bottom:100px;
}

.header{
background:#0F766E;
color:white;
padding:25px;
border-radius:20px;
text-align:center;
font-size:28px;
font-weight:bold;
margin-bottom:15px;
box-shadow:0 4px 12px rgba(15,118,110,0.3);
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-bottom:15px;
}

.stat-card{
background:white;
padding:18px 15px;
border-radius:18px;
text-align:center;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.stat-number{
font-size:28px;
font-weight:bold;
color:#0F766E;
}

.stat-label{
font-size:13px;
color:#666;
margin-top:5px;
}

.legend{
display:flex;
overflow:auto;
gap:8px;
padding:10px 0;
margin-bottom:15px;
}

.legend-item{
background:white;
padding:10px 15px;
border-radius:15px;
display:flex;
align-items:center;
gap:8px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
white-space:nowrap;
font-size:14px;
font-weight:500;
}

.dot{
width:14px;
height:14px;
border-radius:50%;
}

.green{background:#16a34a;}
.blue{background:#2563eb;}
.gray{background:#9ca3af;}
.yellow{background:#facc15;}
.orange{background:#f97316;}

.route-list{
margin-top:15px;
}

.route-card{
background:white;
padding:18px;
border-radius:20px;
margin-bottom:12px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.route-top{
display:flex;
align-items:center;
gap:12px;
margin-bottom:8px;
}

.route-number{
width:45px;
height:45px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
color:white;
font-weight:bold;
font-size:18px;
flex-shrink:0;
}

.route-number.visited{background:#16a34a;}
.route-number.current{background:#2563eb;}
.route-number.pending{background:#9ca3af;}
.route-number.closed{background:#facc15;color:#000;}
.route-number.comeback{background:#f97316;}

.route-info{
flex:1;
}

.route-name{
font-size:22px;
font-weight:bold;
color:#1e293b;
margin-bottom:4px;
}

.route-balance{
font-size:18px;
font-weight:bold;
color:#0F766E;
display:flex;
align-items:center;
gap:5px;
}

.route-status{
margin-top:6px;
font-weight:bold;
font-size:15px;
display:flex;
align-items:center;
gap:6px;
}

.status-visited{color:#16a34a;}
.status-current{color:#2563eb;}
.status-pending{color:#9ca3af;}
.status-closed{color:#facc15;}
.status-comeback{color:#f97316;}

.actions{
display:flex;
gap:8px;
margin-top:15px;
flex-wrap:wrap;
}

.actions button{
border:none;
padding:10px 14px;
border-radius:12px;
color:white;
font-weight:bold;
cursor:pointer;
font-size:14px;
flex:1;
min-width:90px;
}
.actions button:active{transform:scale(0.96);}

.btn-gray{background:#cbd5e1;color:#475569;}
.btn-green{background:#16a34a;}
.btn-yellow{background:#facc15;color:#000;}
.btn-orange{background:#f97316;}

.finish-btn{
width:100%;
padding:18px;
border:none;
border-radius:18px;
background:#16a34a;
color:white;
font-size:18px;
font-weight:bold;
margin-top:15px;
box-shadow:0 4px 12px rgba(22,163,74,0.3);
}
.finish-btn:active{transform:scale(0.98);}
</style>
</head>

<body>

<div class="header">
🗺️ Route Today
</div>

<div class="stats">
<div class="stat-card">
<div class="stat-number" id="totalCustomers">0</div>
<div class="stat-label">Customers</div>
</div>
<div class="stat-card">
<div class="stat-number" id="collectedCount">0</div>
<div class="stat-label">Collected</div>
</div>
<div class="stat-card">
<div class="stat-number" id="pendingCount">0</div>
<div class="stat-label">Pending</div>
</div>
</div>

<div class="legend">
<div class="legend-item"><div class="dot green"></div>Collected</div>
<div class="legend-item"><div class="dot blue"></div>Current</div>
<div class="legend-item"><div class="dot gray"></div>Pending</div>
<div class="legend-item"><div class="dot yellow"></div>Closed</div>
<div class="legend-item"><div class="dot orange"></div>Come Back</div>
</div>

<div id="routeList" class="route-list"></div>

<button id="finishRouteBtn" class="finish-btn">✅ Finish Route</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBCVOOouLET3GDGyHj2i7ncvUZBjUUVB7Y",
  authDomain: "karni-b9b34.firebaseapp.com",
  databaseURL: "https://karni-b9b34-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "karni-b9b34",
  storageBucket: "karni-b9b34.firebasestorage.app",
  messagingSenderId: "489835094040",
  appId: "1:489835094040:web:109e20fe7b65516903236d"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let customers = [];

// تاريخ اليوم بدون وقت
function getTodayDate(){
    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const day = String(now.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
}

const today = getTodayDate();

// جيب الزبناء من Firebase
get(ref(db, 'customers')).then((snapshot)=>{
    if(snapshot.exists()){
        snapshot.forEach(child => {
            const data = child.val();
            const amount = parseFloat(data.amount) || 0;
            const payDate = (data.paymentDate || '').toString().trim();

            // غير زبناء اليوم + المبلغ > 0
            if(payDate === today && amount > 0){
                let status = data.routeStatus || 'pending';
                customers.push({
                    id: child.key,
                    name: data.name,
                    amount: amount,
                    status: status
                });
            }
        });

        // رتبهم: visited -> current -> pending
        customers.sort((a,b)=>{
            const order = {visited: 1, current: 2, pending: 3, closed: 4, comeback: 5};
            return order[a.status] - order[b.status];
        });

        // إلا ما كاينش current دير أول واحد current
        if(customers.length > 0 &&!customers.find(c => c.status === 'current')){
            customers[0].status = 'current';
            update(ref(db, 'customers/' + customers[0].id), {routeStatus: 'current'});
        }

        renderRoute();
    }else{
        document.getElementById('routeList').innerHTML = '<div style="text-align:center;padding:40px;color:#999">لا توجد زبناء اليوم</div>';
    }
});function renderRoute(){

let html = "";
let collected = 0;
let pending = 0;

document.getElementById("totalCustomers").innerText = customers.length;

customers.forEach((item,index)=>{

if(item.status==="visited"){
collected++;
}

if(item.status==="pending" || item.status==="current"){
pending++;
}

let colorClass = "pending";
let text = "⚪ Pending";

if(item.status==="current"){
colorClass="current";
text="🔵 Current";
}

if(item.status==="visited"){
colorClass="visited";
text="🟢 Collected";
}

if(item.status==="closed"){
colorClass="closed";
text="🟡 Closed";
}

if(item.status==="comeback"){
colorClass="comeback";
text="🟠 Come Back";
}

html += `
<div class="route-card">
<div class="route-top">
<div class="route-number ${colorClass}">${index+1}</div>
<div class="route-info">
<div class="route-name">${item.name}</div>
<div class="route-balance">💰 ${item.amount} MAD</div>
<div class="route-status status-${colorClass}">${text}</div>
</div>
</div>
<div class="actions">
<button class="btn-gray" onclick="moveUp(${index})" ${index===0?'disabled style="opacity:0.4"':''}>⬆️ Up</button>
<button class="btn-gray" onclick="moveDown(${index})" ${index===customers.length-1?'disabled style="opacity:0.4"':''}>⬇️ Down</button>
<button class="btn-green" onclick="markCollected(${index})">🟢 Collected</button>
<button class="btn-yellow" onclick="markClosed(${index})">🟡 Closed</button>
<button class="btn-orange" onclick="markComeBack(${index})">🟠 Come Back</button>
</div>
</div>
`;
});

document.getElementById("routeList").innerHTML = html;
document.getElementById("collectedCount").innerText = collected;
document.getElementById("pendingCount").innerText = pending;
}

function setNextCurrent(){
customers.forEach(item=>{
if(item.status === "current"){
item.status = "pending";
update(ref(db, 'customers/' + item.id), {routeStatus: 'pending'});
}
});

for(let i = 0; i < customers.length; i++){
if(customers[i].status === "pending"){
customers[i].status = "current";
update(ref(db, 'customers/' + customers[i].id), {routeStatus: 'current'});
break;
}
}

function markCollected(index){
customers[index].status = "visited";
update(ref(db, 'customers/' + customers[index].id), {
routeStatus: 'visited',
routeDate: today
});
setNextCurrent();
renderRoute();
}

function markClosed(index){
customers[index].status = "closed";
update(ref(db, 'customers/' + customers[index].id), {routeStatus: 'closed'});
setNextCurrent();
renderRoute();
}

function markComeBack(index){
let customer = customers[index];
customer.status = "comeback";
update(ref(db, 'customers/' + customer.id), {routeStatus: 'comeback'});

customers.splice(index, 1);
customers.push(customer);
setNextCurrent();
renderRoute();
}

document.getElementById("finishRouteBtn").onclick = function(){
if(confirm("Finish Route?")){
alert("Route Finished ✅");
window.location.href = "index.html";
}
};

function moveUp(index){
if(index === 0) return;
let temp = customers[index];
customers[index] = customers[index - 1];
customers[index - 1] = temp;
renderRoute();
}

function moveDown(index){
if(index === customers.length - 1) return;
let temp = customers[index];
customers[index] = customers[index + 1];
customers[index + 1] = temp;
renderRoute();
}
</script>

</body>
</html>
