<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Route Manual</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tahoma',sans-serif}
body{background:#f8fafc;padding:15px;padding-bottom:100px}

.header{background:#0F766E;color:white;padding:22px;border-radius:22px;text-align:center;font-size:24px;font-weight:bold;margin-bottom:18px;position:relative;box-shadow:0 4px 12px rgba(15,118,110,0.2)}
.back-btn{position:absolute;right:18px;top:18px;background:white;width:36px;height:36px;border-radius:10px;border:none;font-size:20px;cursor:pointer}

.add-box{background:white;padding:20px;border-radius:22px;margin-bottom:15px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.add-box input{width:100%;padding:16px;border:2px solid #e2e8f0;border-radius:14px;font-size:16px;text-align:right;background:#f8fafc}
.add-box input:focus{border-color:#0F766E;outline:none;background:white}
.add-btn{width:100%;padding:16px;margin-top:12px;border:none;border-radius:14px;background:#0F766E;color:white;font-size:17px;font-weight:bold;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.stat-card{background:white;padding:22px 10px;border-radius:20px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.stat-number{font-size:34px;font-weight:bold;color:#0F766E;margin-bottom:4px}
.stat-label{font-size:15px;color:#64748b}

.route-list{margin-top:10px}
.route-card{background:white;padding:18px;border-radius:18px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.05);display:flex;align-items:center;gap:15px;transition:0.2s}
.route-card:active{transform:scale(0.98)}

.route-number{width:52px;height:52px;border-radius:50%;color:white;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:21px;flex-shrink:0}
.route-number.pending{background:#2563eb}
.route-number.visited{background:#94a3b8}

.route-info{flex:1;text-align:right}
.route-name{font-size:19px;font-weight:bold;color:#1e293b;margin-bottom:3px}
.route-name.visited{color:#94a3b8;text-decoration:line-through}

.delete-btn{width:48px;height:48px;border-radius:14px;background:#fee2e2;border:none;cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center}

.clear-btn{width:100%;padding:18px;border:none;border-radius:18px;background:#ef4444;color:white;font-size:18px;font-weight:bold;margin-top:25px;box-shadow:0 4px 12px rgba(239,68,68,0.25);display:flex;align-items:center;justify-content:center;gap:8px}

.empty{text-align:center;padding:70px 20px;color:#94a3b8;font-size:17px}
.loading{text-align:center;padding:50px;color:#0F766E;font-size:16px}
</style>
</head>
<body>

<div class="header">
<button class="back-btn" onclick="window.location.href='index.html'">⬅️</button>
🗺️ Route Manual
</div>

<div class="add-box">
<input type="text" id="nameInput" placeholder="اكتب اسم الزبون + Enter">
<button class="add-btn" onclick="addCustomer()">➕ إضافة زبون</button>
</div>

<div class="stats">
<div class="stat-card">
<div class="stat-number" id="totalCount">0</div>
<div class="stat-label">المجموع</div>
</div>
<div class="stat-card">
<div class="stat-number" id="visitedCount">0</div>
<div class="stat-label">تمت الزيارة</div>
</div>
<div class="stat-card">
<div class="stat-number" id="pendingCount">0</div>
<div class="stat-label">متبقي</div>
</div>
</div>

<div id="routeList" class="loading">جار تحميل البيانات...</div>

<button class="clear-btn" onclick="clearAll()">🗑️ مسح كل شيء</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
import { getDatabase, ref, set, remove, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBCVOOouLET3GDGyHj2i7ncvUZBjUUVB7Y",
  authDomain: "karni-b9b34.firebaseapp.com",
  databaseURL: "https://karni-b9b34-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "karni-b9b34",
  storageBucket: "karni-b9b34.firebasestorage.app",
  messagingSenderId: "489835094040",
  appId: "1:489835094040:web:109e20fe7b65516903236d"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let routeList = [];

// ربط مباشر مع Firebase
onValue(ref(db, 'routeManual'), (snapshot)=>{
    routeList = snapshot.exists()? snapshot.val() : [];
    renderRoute();
});

window.addCustomer = function(){
    const nameInput = document.getElementById('nameInput');
    const name = nameInput.value.trim();

    if(!name){
        alert('كتب الاسم عاد');
        return;
    }

    routeList.push({
        id: Date.now(),
        name: name,
        status: 'pending'
    });

    set(ref(db, 'routeManual'), routeList);
    nameInput.value = '';
    nameInput.focus();
}

document.getElementById('nameInput').addEventListener('keypress', (e)=>{
    if(e.key === 'Enter') addCustomer();
});

window.deleteCustomer = function(id){
    if(confirm('مسح هاد الزبون؟')){
        routeList = routeList.filter(c => c.id!== id);
        set(ref(db, 'routeManual'), routeList);
    }
}

window.toggleStatus = function(id){
    let idx = routeList.findIndex(c => c.id === id);
    if(idx!== -1){
        routeList[idx].status = routeList[idx].status === 'pending'? 'visited' : 'pending';
        set(ref(db, 'routeManual'), routeList);
    }
}

window.clearAll = function(){
    if(confirm('⚠️ مسح كلشي من Firebase؟')){
        remove(ref(db, 'routeManual'));
    }
}

function renderRoute(){
    let html = '';
    let visited = 0;
    let pending = 0;

    if(routeList.length === 0){
        html = '<div class="empty">📝 الليست خاوية<br>زيد الأسماء من الفوق</div>';
    }else{
        routeList.forEach((item, index)=>{
            if(item.status === 'visited') visited++;
            else pending++;

            let isCurrent = item.status === 'pending' && index === routeList.findIndex(c => c.status === 'pending');
            let numberClass = item.status === 'visited'? 'visited' : 'pending';
            let nameClass = item.status === 'visited'? 'visited' : '';

            html += `
            <div class="route-card" onclick="toggleStatus(${item.id})">
                <button class="delete-btn" onclick="event.stopPropagation();deleteCustomer(${item.id})">🗑️</button>
                <div class="route-info">
                    <div class="route-name ${nameClass}">${item.name}</div>
                </div>
                <div class="route-number ${numberClass}">${index+1}</div>
            </div>
            `;
        });
    }

    document.getElementById('routeList').innerHTML = html;
    document.getElementById('totalCount').innerText = routeList.length;
    document.getElementById('visitedCount').innerText = visited;
    document.getElementById('pendingCount').innerText = pending;
}
</script>
</body>
</html>
