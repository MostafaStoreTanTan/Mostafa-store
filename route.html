<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Route</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fb;
padding:15px;
padding-bottom:100px;
}

.header{
background:#0F766E;
color:white;
padding:25px;
border-radius:20px;
text-align:center;
font-size:35px;
font-weight:bold;
margin-bottom:15px;
}

.stats{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
margin-bottom:15px;
}

.stat-card{
background:white;
padding:15px;
border-radius:18px;
text-align:center;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.stat-number{
font-size:24px;
font-weight:bold;
color:#0F766E;
}

.route-list{
margin-top:15px;
}

.route-item{
background:white;
padding:15px;
border-radius:18px;
margin-bottom:10px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
display:flex;
align-items:center;
gap:15px;
cursor:pointer;
}

.drag{
font-size:25px;
color:#666;
}

.customer-info{
flex:1;
}

.customer-name{
font-size:20px;
font-weight:bold;
}

.customer-balance{
margin-top:5px;
color:#0F766E;
font-weight:bold;
}

.finish-btn{
width:100%;
padding:16px;
border:none;
border-radius:15px;
background:#16a34a;
color:white;
font-size:18px;
font-weight:bold;
margin-top:15px;
}

</style>

</head>

<body>

<div class="header">
🗺️ Route Today
</div>

<div class="stats">

<div class="stat-card">

<div
class="stat-number"
id="customerCount">
0
</div>

<div>
Customers
</div>

</div>

<div class="stat-card">

<div
class="stat-number"
id="totalBalance">
0
</div>

<div>
Balance
</div>

</div>

</div>

<div
class="route-list"
id="routeList">
</div>

<button
class="finish-btn"
id="finishRouteBtn">

✅ Finish Route

</button>

 <script>

let people =
JSON.parse(
localStorage.getItem("people")
) || [];

let today =
new Date()
.toISOString()
.split("T")[0];

let routePeople = [];

people.forEach(person=>{

if(
person.dueDate === today
){

routePeople.push(person);

}

});

let totalBalance = 0;

routePeople.forEach(person=>{

let depot = 0;
let paid = 0;

if(person.operations){

person.operations.forEach(op=>{

if(op.type === "Depot"){
depot += Number(op.amount);
}

if(op.type === "Paid"){
paid += Number(op.amount);
}

});

}

person.balance =
depot - paid;

totalBalance += person.balance;

});

document.getElementById(
"customerCount"
).innerText =
routePeople.length;

document.getElementById(
"totalBalance"
).innerText =
totalBalance + " MAD";

renderRoute();

function renderRoute(){

let html = "";

if(
routePeople.length === 0
){

html = `

<div class="route-item">

<div class="customer-info">

<div class="customer-name">
No Customers Today
</div>

</div>

</div>

`;

}

routePeople.forEach(
(person,index)=>{

html += `

<div
class="route-item"
onclick="openCustomer(${index})">

<div class="drag">
☰
</div>

<div class="customer-info">

<div class="customer-name">

${person.name}

</div>

<div class="customer-balance">

💰 ${person.balance} MAD

</div>

</div>

</div>

`;

});

document.getElementById(
"routeList"
).innerHTML =
html;

}

function openCustomer(index){

let realIndex =
people.findIndex(
p => p.name ===
routePeople[index].name
);

localStorage.setItem(
"selectedCustomer",
realIndex
);

window.location.href =
"person.html";

}

document.getElementById(
"finishRouteBtn"
).onclick = function(){

if(
confirm(
"Finish Route?"
)
){

alert(
"Route Finished"
);

}

};

</script>

</body>

</html>
