<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Route Manual</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tahoma',sans-serif}
body{background:#f5f5f5;padding:15px;padding-bottom:120px}

.header{background:#0F766E;color:white;padding:20px;border-radius:25px;text-align:center;font-size:22px;font-weight:bold;margin-bottom:18px;position:relative;box-shadow:0 4px 12px rgba(15,118,110,0.2)}
.back-btn{position:absolute;left:15px;top:15px;background:white;width:40px;height:40px;border-radius:12px;border:none;font-size:22px;cursor:pointer;color:#0F766E;display:flex;align-items:center;justify-content:center}

.add-box{background:white;padding:20px;border-radius:20px;margin-bottom:15px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.add-box input{width:100%;padding:16px;border:2px solid #e5e7eb;border-radius:14px;font-size:16px;text-align:right;background:#f9fafb;color:#6b7280}
.add-box input:focus{border-color:#0F766E;outline:none;background:white}
.add-btn{width:100%;padding:16px;margin-top:12px;border:none;border-radius:14px;background:#0F766E;color:white;font-size:17px;font-weight:bold;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:white;padding:20px 10px;border-radius:20px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.stat-number{font-size:36px;font-weight:bold;color:#0F766E;margin-bottom:5px}
.stat-label{font-size:15px;color:#6b7280}

.route-list{margin-top:10px}
.route-card{background:white;padding:18px;border-radius:20px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.06);display:flex;align-items:center;gap:15px;position:relative}
.route-card:active{transform:scale(0.98)}

.route-number{width:50px;height:50px;border-radius:50%;background:#2563eb;color:white;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:20px;flex-shrink:0}
.route-number.visited{background:#9ca3af}

.route-name{flex:1;font-size:18px;font-weight:bold;color:#1f2937;text-align:right}
.route-name.visited{color:#9ca3af;text-decoration:line-through}

.delete-btn{width:45px;height:45px;border-radius:14px;background:#fee2e2;border:none;cursor:pointer;font-size:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0}

.drag-handle{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:24px;color:#d1d5db;cursor:grab;padding:5px}

.clear-btn{width:100%;padding:18px;border:none;border-radius:18px;background:#ef4444;color:white;font-size:18px;font-weight:bold;margin-top:25px;box-shadow:0 4px 12px rgba(239,68,68,0.25)}

.test-btn{width:100%;padding:15px;border:none;border-radius:14px;background:#3b82f6;color:white;font-size:16px;font-weight:bold;margin-bottom:15px;cursor:pointer}

.empty{text-align:center;padding:70px 20px;color:#9ca3af;font-size:17px}
.loading{text-align:center;padding:50px;color:#0F766E;font-size:16px}

.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#16a34a;color:white;padding:12px 24px;border-radius:12px;z-index:999;font-weight:bold;box-shadow:0 4px 12px rgba(22,163,74,0.3);animation:slideUp 0.3s}
@keyframes slideUp{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
</style>
</head>
<body>

<div class="header">
<button class="back-btn" onclick="window.location.href='index.html'">⬅️</button>
Route Manual 🗺️
</div>

<button class="test-btn" onclick="addTestData()">🧪 إضافة بيانات test</button>

<div class="add-box">
<input type="text" id="nameInput" placeholder="اكتب اسم الزبون + Enter">
<button class="add-btn" onclick="addCustomer()">➕ إضافة زبون</button>
</div>

<div class="stats">
<div class="stat-card">
<div class="stat-number" id="totalCount">0</div>
<div class="stat-label">المجموع</div>
</div>
<div class="stat-card">
<div class="stat-number" id="visitedCount">0</div>
<div class="stat-label">تمت الزيارة</div>
</div>
<div class="stat-card">
<div class="stat-number" id="pendingCount">0</div>
<div class="stat-label">متبقي</div>
</div>
</div>

<div id="routeList" class="loading">جار تحميل البيانات...</div>

<button class="clear-btn" onclick="clearAll()">🗑️ مسح كل شيء</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
import { getDatabase, ref, set, remove, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBCVOOouLET3GDGyHj2i7ncvUZBjUUVB7Y",
  authDomain: "karni-b9b34.firebaseapp.com",
  databaseURL: "https://karni-b9b34-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "karni-b9b34",
  storageBucket: "karni-b9b34.firebasestorage.app",
  messagingSenderId: "489835094040",
  appId: "1:489835094040:web:109e20fe7b65516903236d"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let routeList = [];

onValue(ref(db, 'routeManual'), (snapshot)=>{
    routeList = snapshot.exists()? snapshot.val() : [];
    renderRoute();
});

function showToast(msg){
    let toast = document.createElement('div');
    toast.className = 'toast';
    toast.innerText = msg;
    document.body.appendChild(toast);
    setTimeout(()=>toast.remove(), 1800);
}

function saveToFirebase(){
    set(ref(db, 'routeManual'), routeList).then(()=>{
        showToast('✅ تم الحفظ');
    }).catch(err=>{
        alert('❌ خطأ: ' + err.message);
    });
}

window.addCustomer = function(){
    const nameInput = document.getElementById('nameInput');
    const name = nameInput.value.trim();
    if(!name){ alert('كتب الاسم عاد'); return; }

    routeList.push({id: Date.now(), name: name, status: 'pending'});
    saveToFirebase();
    nameInput.value = '';
    nameInput.focus();
}

// خاصية test - تزيد 3 أسماء دغيا
window.addTestData = function(){
    routeList = [
        {id: Date.now(), name: 'Ali', status: 'pending'},
        {id: Date.now()+1, name: 'Khalid', status: 'pending'},
        {id: Date.now()+2, name: 'Lmelali', status: 'pending'}
    ];
    saveToFirebase();
    showToast('🧪 تم إضافة بيانات test');
}

document.getElementById('nameInput').addEventListener('keypress', (e)=>{
    if(e.key === 'Enter') addCustomer();
});

window.deleteCustomer = function(id){
    if(confirm('مسح هاد الزبون؟')){
        routeList = routeList.filter(c => c.id!== id);
        saveToFirebase();
    }
}

window.toggleStatus = function(id){
    let idx = routeList.findIndex(c => c.id === id);
    if(idx!== -1){
        routeList[idx].status = routeList[idx].status === 'pending'? 'visited' : 'pending';
        saveToFirebase();
    }
}

// سحب وإفلات drag & drop باش تبدل الأماكن
let draggedItem = null;

function renderRoute(){
    let html = '';
    let visited = 0;
    let pending = 0;

    if(routeList.length === 0){
        html = '<div class="empty">📝 الليست خاوية<br>زيد الأسماء من الفوق<br>ولا دير test</div>';
    }else{
        routeList.forEach((item, index)=>{
            if(item.status === 'visited') visited++;
            else pending++;

            let numberClass = item.status === 'visited'? 'visited' : '';
            let nameClass = item.status === 'visited'? 'visited' : '';

            html += `
            <div class="route-card" draggable="true" data-index="${index}" onclick="toggleStatus(${item.id})">
                <div class="drag-handle">⋮</div>
                <div class="route-name ${nameClass}">${item.name}</div>
                <button class="delete-btn" onclick="event.stopPropagation();deleteCustomer(${item.id})">🗑️</button>
                <div class="route-number ${numberClass}">${index+1}</div>
            </div>
            `;
        });
    }

    document.getElementById('routeList').innerHTML = html;
    document.getElementById('totalCount').innerText = routeList.length;
    document.getElementById('visitedCount').innerText = visited;
    document.getElementById('pendingCount').innerText = pending;

    // تفعيل السحب والإفلات
    document.querySelectorAll('.route-card').forEach(card=>{
        card.addEventListener('dragstart', e=>{
            draggedItem = e.target;
            e.target.style.opacity = '0.5';
        });
        card.addEventListener('dragend', e=>{
            e.target.style.opacity = '1';
        });
        card.addEventListener('dragover', e=>e.preventDefault());
        card.addEventListener('drop', e=>{
            e.preventDefault();
            if(draggedItem!== e.currentTarget){
                let fromIndex = parseInt(draggedItem.dataset.index);
                let toIndex = parseInt(e.currentTarget.dataset.index);

                let item = routeList.splice(fromIndex, 1)[0];
                routeList.splice(toIndex, 0, item);

                saveToFirebase();
            }
        });
    });
}

window.clearAll = function(){
    if(confirm('⚠️ مسح كلشي من Firebase؟')){
        remove(ref(db, 'routeManual')).then(()=>{
            showToast('✅ تم المسح');
        });
    }
}
</script>
</body>
</html>
