<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Route Manual</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tahoma',sans-serif}
body{background:#f5f7fa;padding:15px;padding-bottom:100px}
.header{background:#0F766E;color:white;padding:25px;border-radius:25px;text-align:center;font-size:26px;font-weight:bold;margin-bottom:15px;position:relative}
.back-btn{position:absolute;right:15px;top:20px;background:none;border:none;color:white;font-size:24px;cursor:pointer}

.add-section{background:white;padding:20px;border-radius:20px;margin-bottom:15px;box-shadow:0 3px 10px rgba(0,0,0,.08)}
.add-section input{width:100%;padding:15px;border:2px solid #e2e8f0;border-radius:12px;font-size:16px;margin-bottom:10px}
.add-section input:focus{border-color:#0F766E;outline:none}
.add-btn{width:100%;padding:15px;border:none;border-radius:12px;background:#0F766E;color:white;font-size:16px;font-weight:bold;cursor:pointer}
.add-btn:active{transform:scale(0.98)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:white;padding:20px 10px;border-radius:20px;text-align:center;box-shadow:0 3px 10px rgba(0,0,0,.08)}
.stat-number{font-size:32px;font-weight:bold;color:#0F766E}
.stat-label{font-size:14px;color:#64748b;margin-top:5px}

.route-list{margin-top:15px}
.route-card{background:white;padding:18px;border-radius:20px;margin-bottom:12px;box-shadow:0 3px 12px rgba(0,0,0,.08);display:flex;align-items:center;gap:15px}
.route-number{width:50px;height:50px;border-radius:50%;background:#2563eb;color:white;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:20px;flex-shrink:0}
.route-name{flex:1;font-size:20px;font-weight:bold;color:#1e293b}
.delete-btn{background:#ef4444;color:white;border:none;padding:10px 15px;border-radius:10px;font-weight:bold;cursor:pointer}

.clear-btn{width:100%;padding:20px;border:none;border-radius:20px;background:#ef4444;color:white;font-size:19px;font-weight:bold;margin-top:20px;box-shadow:0 4px 15px rgba(239,68,68,0.3);cursor:pointer}
.clear-btn:active{transform:scale(0.98)}

.empty{text-align:center;padding:60px 20px;color:#999;font-size:18px}
</style>
</head>
<body>

<div class="header">
<button class="back-btn" onclick="window.location.href='index.html'">⬅️</button>
Route Manual 🗺️
</div>

<div class="add-section">
<input type="text" id="nameInput" placeholder="اكتب اسم الزبون + Enter">
<button class="add-btn" onclick="addCustomer()">➕ إضافة زبون</button>
</div>

<div class="stats">
<div class="stat-card">
<div class="stat-number" id="totalCount">0</div>
<div class="stat-label">المجموع</div>
</div>
<div class="stat-card">
<div class="stat-number" id="visitedCount">0</div>
<div class="stat-label">تمت الزيارة</div>
</div>
<div class="stat-card">
<div class="stat-number" id="pendingCount">0</div>
<div class="stat-label">متبقي</div>
</div>
</div>

<div id="routeList" class="route-list"></div>

<button class="clear-btn" onclick="clearAll()">🗑️ مسح كل شيء</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
import { getDatabase, ref, get, set, remove } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBCVOOouLET3GDGyHj2i7ncvUZBjUUVB7Y",
  authDomain: "karni-b9b34.firebaseapp.com",
  databaseURL: "https://karni-b9b34-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "karni-b9b34",
  storageBucket: "karni-b9b34.firebasestorage.app",
  messagingSenderId: "489835094040",
  appId: "1:489835094040:web:109e20fe7b65516903236d"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let routeList = [];

// حمل الليست من Firebase منين تفتح الصفحة
loadRoute();

function loadRoute(){
    get(ref(db, 'routeManual')).then((snapshot)=>{
        if(snapshot.exists()){
            routeList = snapshot.val();
        }else{
            routeList = [];
        }
        renderRoute();
    });
}

window.addCustomer = function(){
    const nameInput = document.getElementById('nameInput');
    const name = nameInput.value.trim();
    
    if(!name){
        alert('كتب الاسم عاد');
        return;
    }

    routeList.push({
        id: Date.now(),
        name: name,
        status: 'pending'
    });

    saveToFirebase();
    nameInput.value = '';
    nameInput.focus();
}

// Enter باش تزيد
document.getElementById('nameInput').addEventListener('keypress', (e)=>{
    if(e.key === 'Enter') addCustomer();
});

window.deleteCustomer = function(id){
    if(confirm('مسح هاد الزبون؟')){
        routeList = routeList.filter(c => c.id !== id);
        saveToFirebase();
    }
}

window.toggleStatus = function(id){
    let customer = routeList.find(c => c.id === id);
    if(customer){
        customer.status = customer.status === 'pending' ? 'visited' : 'pending';
        saveToFirebase();
    }
}

window.clearAll = function(){
    if(confirm('واش متأكد بغيتي تمسح كلشي؟')){
        routeList = [];
        remove(ref(db, 'routeManual'));
        renderRoute();
        alert('تم مسح كل شيء ✅');
    }
}

function saveToFirebase(){
    set(ref(db, 'routeManual'), routeList);
    renderRoute();
}

function renderRoute(){
    let html = '';
    let visited = 0;
    let pending = 0;

    if(routeList.length === 0){
        html = '<div class="empty">📝 ما كاين حتى شي زبون<br>زيد الأسماء من الفوق</div>';
    }else{
        routeList.forEach((item, index)=>{
            if(item.status === 'visited') visited++;
            else pending++;

            html += `
            <div class="route-card" onclick="toggleStatus(${item.id})" style="cursor:pointer">
                <div class="route-number" style="background:${item.status==='visited'?'#16a34a':'#2563eb'}">
                    ${index+1}
                </div>
                <div class="route-name" style="text-decoration:${item.status==='visited'?'line-through':'none'};color:${item.status==='visited'?'#999':'#1e293b'}">
                    ${item.name}
                </div>
                <button class="delete-btn" onclick="event.stopPropagation();deleteCustomer(${item.id})">🗑️</button>
            </div>
            `;
        });
    }

    document.getElementById('routeList').innerHTML = html;
    document.getElementById('totalCount').innerText = routeList.length;
    document.getElementById('visitedCount').innerText = visited;
    document.getElementById('pendingCount').innerText = pending;
}
</script>
</body>
</html>
