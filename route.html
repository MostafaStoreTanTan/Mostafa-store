<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Route Map</title>

<style>

body{
font-family:Arial,sans-serif;
padding:15px;

background-image:url('file_00000000cb10722fbac9c57b53750eb9.png');
background-size:cover;
background-position:center;
background-attachment:fixed;
}

h1{
text-align:center;
margin-bottom:25px;
}

.route{
position:relative;
max-width:400px;
margin:auto;
min-height:2500px;
}

.line{
display:none;
}

.depot{
width:120px;
margin:auto;
background:#222;
color:white;
padding:15px;
border-radius:15px;
text-align:center;
font-weight:bold;
position:relative;
z-index:2;
}

.stop{
width:140px;
background:white;
padding:12px;
border-radius:15px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
margin-top:35px;
position:relative;
z-index:2;
}

.left{
margin-right:auto;
}

.right{
margin-left:auto;
}

.circle{
width:45px;
height:45px;
border-radius:50%;
background:#2196f3;
color:white;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
position:absolute;
top:50%;
transform:translateY(-50%);
}

.left .circle{
right:-95px;
}

.right .circle{
left:-95px;
}

.visited{
background:#4caf50 !important;
}

.name{
font-weight:bold;
font-size:18px;
}

.btn{
margin-top:10px;
padding:8px 12px;
border:none;
border-radius:8px;
background:green;
color:white;
}

</style>
</head>

<body>

<h1>🗺️ Route Map</h1>

<div class="route">

<div class="depot">
🏠 Depot
</div>

<div id="routeMap"></div>

</div>

<script>

let route =
JSON.parse(
localStorage.getItem("todayRoute")
) || [];

function renderRoute(){

let html = "";

route.forEach((person,index)=>{

let side =
index % 2 === 0
? "left"
: "right";

let visited =
person.visited
? "visited"
: "";

html += `

<div class="stop ${side}">

<div class="circle ${visited}">
${index+1}
</div>

<div class="name">
👤 ${person.name}
</div>

<button
class="btn"
onclick="markVisited(${index})">
🟢 Visited
</button>

</div>

`;

});

document.getElementById("routeMap")
.innerHTML = html;

}

function markVisited(index){

route[index].visited = true;

localStorage.setItem(
"todayRoute",
JSON.stringify(route)
);

renderRoute();

}

renderRoute();

</script>

</body>
</htmlYP>
