<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Route Today</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tahoma',sans-serif}
body{background:#f5f7fa;padding:15px;padding-bottom:100px}

.header{background:#0F766E;color:white;padding:25px;border-radius:25px;text-align:center;font-size:26px;font-weight:bold;margin-bottom:15px;box-shadow:0 4px 15px rgba(15,118,110,0.25)}
.back-btn{position:absolute;right:15px;top:20px;background:none;border:none;color:white;font-size:24px;cursor:pointer}

.date-picker{background:white;padding:15px;border-radius:20px;margin-bottom:15px;box-shadow:0 2px 8px rgba(0,0,0,.08);display:flex;align-items:center;gap:10px}
.date-picker label{font-weight:bold;color:#334155;font-size:15px}
.date-picker input{flex:1;padding:10px;border:2px solid #e2e8f0;border-radius:12px;font-size:16px;text-align:center}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:white;padding:20px 10px;border-radius:20px;text-align:center;box-shadow:0 3px 10px rgba(0,0,0,.08)}
.stat-number{font-size:32px;font-weight:bold;color:#0F766E;margin-bottom:5px}
.stat-label{font-size:14px;color:#64748b;font-weight:500}

.legend{display:flex;overflow:auto;gap:10px;padding:10px 0;margin-bottom:20px}
.legend-item{background:white;padding:12px 18px;border-radius:15px;display:flex;align-items:center;gap:8px;box-shadow:0 2px 8px rgba(0,0,0,.06);white-space:nowrap;font-size:14px;font-weight:500;color:#334155}
.dot{width:12px;height:12px;border-radius:50%}
.gray{background:#94a3b8}.blue{background:#2563eb}.green{background:#16a34a}.yellow{background:#facc15}.orange{background:#f97316}

.route-list{margin-top:15px}
.route-card{background:white;padding:18px;border-radius:20px;margin-bottom:12px;box-shadow:0 3px 12px rgba(0,0,0,.08)}
.route-top{display:flex;align-items:center;gap:15px;margin-bottom:12px}
.route-number{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;font-size:20px;flex-shrink:0}
.route-number.pending{background:#94a3b8}
.route-number.current{background:#2563eb}
.route-number.visited{background:#16a34a}
.route-number.closed{background:#facc15;color:#000}
.route-number.comeback{background:#f97316}
.route-info{flex:1}
.route-name{font-size:20px;font-weight:bold;color:#1e293b;margin-bottom:4px}
.route-balance{font-size:18px;font-weight:bold;color:#0F766E;display:flex;align-items:center;gap:5px}
.route-status{margin-top:6px;font-weight:bold;font-size:14px;display:flex;align-items:center;gap:6px}
.status-pending{color:#94a3b8}.status-current{color:#2563eb}.status-visited{color:#16a34a}.status-closed{color:#facc15}.status-comeback{color:#f97316}

.actions{display:flex;gap:8px;margin-top:15px;flex-wrap:wrap}
.actions button{border:none;padding:10px 12px;border-radius:12px;color:white;font-weight:bold;cursor:pointer;font-size:13px;flex:1;min-width:80px}
.actions button:active{transform:scale(0.96)}
.actions button:disabled{opacity:0.4;cursor:not-allowed}
.btn-gray{background:#cbd5e1;color:#475569}
.btn-green{background:#16a34a}
.btn-yellow{background:#facc15;color:#000}
.btn-orange{background:#f97316}

.finish-btn{width:100%;padding:20px;border:none;border-radius:20px;background:#16a34a;color:white;font-size:19px;font-weight:bold;margin-top:15px;box-shadow:0 4px 15px rgba(22,163,74,0.3);cursor:pointer}
.finish-btn:active{transform:scale(0.98)}

.no-route{text-align:center;padding:60px 20px;color:#999}
.no-route-icon{font-size:60px;margin-bottom:15px}
</style>
</head>
<body>

<div class="header" style="position:relative">
<button class="back-btn" onclick="window.location.href='index.html'">⬅️</button>
🗺️ Route Today
</div>

<div class="date-picker">
<label>📅 التاريخ:</label>
<input type="date" id="dateInput">
</div>

<div class="stats">
<div class="stat-card">
<div class="stat-number" id="pendingCount">0</div>
<div class="stat-label">Pending</div>
</div>
<div class="stat-card">
<div class="stat-number" id="collectedCount">0</div>
<div class="stat-label">Collected</div>
</div>
<div class="stat-card">
<div class="stat-number" id="totalCustomers">0</div>
<div class="stat-label">Customers</div>
</div>
</div>

<div class="legend">
<div class="legend-item"><div class="dot gray"></div>Pending</div>
<div class="legend-item"><div class="dot blue"></div>Current</div>
<div class="legend-item"><div class="dot green"></div>Collected</div>
<div class="legend-item"><div class="dot yellow"></div>Closed</div>
<div class="legend-item"><div class="dot orange"></div>Come Back</div>
</div>

<div id="routeList" class="route-list"></div>

<button id="finishRouteBtn" class="finish-btn">✅ Finish Route</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBCVOOouLET3GDGyHj2i7ncvUZBjUUVB7Y",
  authDomain: "karni-b9b34.firebaseapp.com",
  databaseURL: "https://karni-b9b34-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "karni-b9b34",
  storageBucket: "karni-b9b34.firebasestorage.app",
  messagingSenderId: "489835094040",
  appId: "1:489835094040:web:109e20fe7b65516903236d"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let allCustomers = [];
let routeCustomers = [];
let selectedDate = '';

function getTodayDate(){
    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const day = String(now.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
}

function normalizeDate(dateStr){
    dateStr = (dateStr || '').toString().trim();
    if(dateStr.includes('/')){
        let parts = dateStr.split('/');
        return `${parts[2]}-${parts[1].padStart(2,'0')}-${parts[0].padStart(2,'0')}`;
    }
    return dateStr;
}

// حط تاريخ اليوم فـ input
const today = getTodayDate();
document.getElementById('dateInput').value = today;
selectedDate = today;

loadCustomers();

// منين تبدل التاريخ
document.getElementById('dateInput').addEventListener('change', (e)=>{
    selectedDate = e.target.value;
    loadCustomers();
});

function loadCustomers(){
    get(ref(db, 'customers')).then((snapshot)=>{
        allCustomers = [];
        routeCustomers = [];

        if(snapshot.exists()){
            snapshot.forEach(child => {
                const data = child.val();
                const amount = parseFloat(data.amount) || 0;
                const payDate = normalizeDate(data.paymentDate);

                // القاعدة 1: المامحددش ليه تاريخ لا يظهر نهائياً
                if(!payDate || amount <= 0) return;

                // القاعدة 2: جيب جميع الأشخاص اللي عندهم التاريخ المحدد
                if(payDate === selectedDate){
                    let status = data.routeStatus || 'pending';
                    allCustomers.push({
                        id: child.key,
                        name: data.name,
                        amount: amount,
                        status: status,
                        payDate: payDate
                    });

                    // القاعدة 3: غير اللي تاريخو = اليوم يدوز للمسار
                    if(payDate === today){
                        routeCustomers.push({
                            id: child.key,
                            name: data.name,
                            amount: amount,
                            status: status
                        });
                    }
                }
            });

            // رتب المسار
            routeCustomers.sort((a,b)=>{
                const order = {visited: 1, current: 2, pending: 3, closed: 4, comeback: 5};
                return order[a.status] - order[b.status];
            });

            // دير أول واحد current إلا ما كاينش
            if(routeCustomers.length > 0 &&!routeCustomers.find(c => c.status === 'current')){
                routeCustomers[0].status = 'current';
                update(ref(db, 'customers/' + routeCustomers[0].id), {routeStatus: 'current'});
            }

            renderRoute();
        }
    });
}

function renderRoute(){
let html = "";
let collected = 0;
let pending = 0;

document.getElementById("totalCustomers").innerText = allCustomers.length;

// إلا التاريخ المحدد ماشي اليوم → عرض فقط + ما يبانوش الأزرار
let isToday = selectedDate === today;

if(routeCustomers.length === 0){
    html = `
    <div class="no-route">
        <div class="no-route-icon">📭</div>
        <div style="font-size:18px;font-weight:bold;margin-bottom:8px">لا توجد زبناء</div>
        <div style="font-size:14px">${isToday? 'لا يوجد زبناء لهذا اليوم' : 'اختر تاريخ اليوم لعرض المسار'}</div>
    </div>
    `;
}else{
    routeCustomers.forEach((item,index)=>{
        if(item.status==="visited") collected++;
        if(item.status==="pending" || item.status==="current") pending++;

        let colorClass = "pending";
        let text = "⚪ Pending";

        if(item.status==="current"){colorClass="current";text="🔵 Current";}
        if(item.status==="visited"){colorClass="visited";text="🟢 Collected";}
        if(item.status==="closed"){colorClass="closed";text="🟡 Closed";}
        if(item.status==="comeback"){colorClass="comeback";text="🟠 Come Back";}

        html += `
        <div class="route-card">
            <div class="route-top">
                <div class="route-number ${colorClass}">${index+1}</div>
                <div class="route-info">
                    <div class="route-name">${item.name}</div>
                    <div class="route-balance">💰 ${item.amount} MAD</div>
                    <div class="route-status status-${colorClass}">${text}</div>
                </div>
            </div>
            ${isToday? `
            <div class="actions">
                <button class="btn-gray" onclick="moveUp(${index})" ${index===0?'disabled':''}>⬆️ Up</button>
                <button class="btn-gray" onclick="moveDown(${index})" ${index===routeCustomers.length-1?'disabled':''}>⬇️ Down</button>
                <button class="btn-green" onclick="markCollected(${index})">🟢 Collected</button>
                <button class="btn-yellow" onclick="markClosed(${index})">🟡 Closed</button>
                <button class="btn-orange" onclick="markComeBack(${index})">🟠 Come Back</button>
            </div>
            ` : ''}
        </div>
        `;
    });
}

document.getElementById("routeList").innerHTML = html;
document.getElementById("collectedCount").innerText = collected;
document.getElementById("pendingCount").innerText = pending;

// خبي زر Finish إلا ماشي اليوم
document.getElementById("finishRouteBtn").style.display = isToday? 'block' : 'none';
}

function setNextCurrent(){
routeCustomers.forEach(item=>{
if(item.status === "current"){
item.status = "pending";
update(ref(db, 'customers/' + item.id), {routeStatus: 'pending'});
}
});

for(let i = 0; i < routeCustomers.length; i++){
if(routeCustomers[i].status === "pending"){
routeCustomers[i].status = "current";
update(ref(db, 'customers/' + routeCustomers[i].id), {routeStatus: 'current'});
break;
}
}

window.markCollected = function(index){
routeCustomers[index].status = "visited";
update(ref(db, 'customers/' + routeCustomers[index].id), {
routeStatus: 'visited',
routeDate: today
});
setNextCurrent();
renderRoute();
}

window.markClosed = function(index){
routeCustomers[index].status = "closed";
update(ref(db, 'customers/' + routeCustomers[index].id), {routeStatus: 'closed'});
setNextCurrent();
renderRoute();
}

window.markComeBack = function(index){
let customer = routeCustomers[index];
customer.status = "comeback";
update(ref(db, 'customers/' + customer.id), {routeStatus: 'comeback'});

routeCustomers.splice(index, 1);
routeCustomers.push(customer);
setNextCurrent();
renderRoute();
}

document.getElementById("finishRouteBtn").onclick = function(){
if(confirm("واش كملتي المسار؟")){
alert("تم إنهاء المسار بنجاح ✅");
window.location.href = "index.html";
}
};

window.moveUp = function(index){
if(index === 0) return;
let temp = routeCustomers[index];
routeCustomers[index] = routeCustomers[index - 1];
routeCustomers[index - 1] = temp;
renderRoute();
}

window.moveDown = function(index){
if(index === routeCustomers.length - 1) return;
let temp = routeCustomers[index];
routeCustomers[index] = routeCustomers[index + 1];
routeCustomers[index + 1] = temp;
renderRoute();
}
</script>
</body>
</html>
