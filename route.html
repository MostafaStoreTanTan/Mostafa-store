<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Today's Route</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f5f5f5;
padding:15px;
}

h1{
text-align:center;
margin-bottom:20px;
}

.client{
background:white;
padding:15px;
margin-top:10px;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

button{
padding:8px 12px;
border:none;
border-radius:8px;
background:green;
color:white;
margin-top:10px;
cursor:pointer;
}

.depot{
background:#222;
color:white;
text-align:center;
font-weight:bold;
}

</style>
</head>

<body>

<h1>📍 Today's Route</h1>

<div id="routeList"></div>

<script>

let route =
JSON.parse(
localStorage.getItem("todayRoute")
) || [];

function renderRoute(){

let html = `
<div class="client depot">
🏠 Depot
</div>
`;

route.forEach((person,index)=>{

let color =
person.visited ?
"#d4edda" :
"white";

html += `
<div
class="client"
style="background:${color};"
>

<h3>
📍 ${index + 1}. ${person.name}
</h3>

<button onclick="markVisited(${index})">
🟢 Visited
</button>

</div>
`;

});

document.getElementById("routeList")
.innerHTML = html;

}

function markVisited(index){

route[index].visited = true;

localStorage.setItem(
"todayRoute",
JSON.stringify(route)
);

renderRoute();

}

renderRoute();

</script>

</body>
</html>
