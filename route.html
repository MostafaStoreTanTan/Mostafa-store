<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Route</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fb;
padding:15px;
padding-bottom:100px;
}

.header{
background:#0F766E;
color:white;
padding:25px;
border-radius:20px;
text-align:center;
font-size:35px;
font-weight:bold;
margin-bottom:15px;
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-bottom:15px;
}

.stat-card{
background:white;
padding:15px;
border-radius:18px;
text-align:center;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.stat-number{
font-size:24px;
font-weight:bold;
color:#0F766E;
}

.stat-label{
font-size:13px;
color:#666;
margin-top:5px;
}

.legend{
display:flex;
overflow:auto;
gap:10px;
padding:10px 0;
margin-bottom:15px;
}

.legend-item{
background:white;
padding:10px 15px;
border-radius:15px;
display:flex;
align-items:center;
gap:8px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
white-space:nowrap;
}

.dot{
width:14px;
height:14px;
border-radius:50%;
}

.green{
background:#16a34a;
}

.blue{
background:#2563eb;
}

.gray{
background:#9ca3af;
}

.yellow{
background:#facc15;
}

.orange{
background:#f97316;
}

.route-list{
margin-top:15px;
}

.route-card{
background:white;
padding:18px;
border-radius:20px;
margin-bottom:12px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.route-top{
display:flex;
align-items:center;
gap:12px;
}

.route-number{
width:45px;
height:45px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
color:white;
font-weight:bold;
font-size:18px;
}

.route-name{
font-size:22px;
font-weight:bold;
}

.route-balance{
margin-top:5px;
font-weight:bold;
color:#0F766E;
}

.route-status{
margin-top:8px;
font-weight:bold;
}

.actions{
display:flex;
gap:8px;
margin-top:15px;
flex-wrap:wrap;
}

.actions button{
border:none;
padding:10px 12px;
border-radius:12px;
color:white;
font-weight:bold;
cursor:pointer;
}

.btn-green{
background:#16a34a;
}

.btn-yellow{
background:#facc15;
color:black;
}

.btn-orange{
background:#f97316;
}

.finish-btn{
width:100%;
padding:18px;
border:none;
border-radius:18px;
background:#16a34a;
color:white;
font-size:18px;
font-weight:bold;
margin-top:15px;
}

</style>

</head>

<body>

<div class="header">
🗺️ Route Today
</div>

<div class="stats">

<div class="stat-card">
<div
class="stat-number"
id="totalCustomers">
0
</div>
<div class="stat-label">
Customers
</div>
</div>

<div class="stat-card">
<div
class="stat-number"
id="collectedCount">
0
</div>
<div class="stat-label">
Collected
</div>
</div>

<div class="stat-card">
<div
class="stat-number"
id="pendingCount">
0
</div>
<div class="stat-label">
Pending
</div>
</div>

</div>

<div class="legend">

<div class="legend-item">
<div class="dot green"></div>
Collected
</div>

<div class="legend-item">
<div class="dot blue"></div>
Current
</div>

<div class="legend-item">
<div class="dot gray"></div>
Pending
</div>

<div class="legend-item">
<div class="dot yellow"></div>
Closed
</div>

<div class="legend-item">
<div class="dot orange"></div>
Come Back
</div>

</div>

<div
id="routeList"
class="route-list">
</div>

<button
id="finishRouteBtn"
class="finish-btn">

✅ Finish Route

</button>

<script>

let people =
JSON.parse(
localStorage.getItem("people")
) || [];

let today =
new Date()
.toISOString()
.split("T")[0];

let route =
JSON.parse(
localStorage.getItem("routeToday")
);

if(!route){

route = [];

people.forEach(person=>{

if(
person.dueDate === today
){

route.push({

name:person.name,

status:"pending"

});

}

});

if(route.length > 0){

route[0].status =
"current";

}

localStorage.setItem(
"routeToday",
JSON.stringify(route)
);

}

renderRoute();

function renderRoute(){

let html = "";

let collected = 0;
let pending = 0;

document.getElementById(
"totalCustomers"
).innerText =
route.length;

route.forEach((item,index)=>{

if(item.status==="collected"){
collected++;
}

if(
item.status==="pending" ||
item.status==="current"
){
pending++;
}

let color = "#9ca3af";
let text = "⚪ Pending";

if(
item.status==="current"
){
color="#2563eb";
text="🔵 Current";
}

if(
item.status==="collected"
){
color="#16a34a";
text="🟢 Collected";
}

if(
item.status==="closed"
){
color="#facc15";
text="🟡 Closed";
}

if(
item.status==="comeback"
){
color="#f97316";
text="🟠 Come Back";
}

let person =
people.find(
p=>p.name===item.name
);

let balance = 0;

if(
person &&
person.operations
){

let depot = 0;
let paid = 0;

person.operations.forEach(op=>{

if(op.type==="Depot"){
depot += Number(op.amount);
}

if(op.type==="Paid"){
paid += Number(op.amount);
}

});

balance = depot - paid;

}

html += `

<div class="route-card">

<div
class="route-top"
onclick="openCustomer('${item.name}')">

<div
class="route-number"
style="background:${color};">

${index+1}

</div>

<div>

<div class="route-name">

${item.name}

</div>

<div class="route-balance">

💰 ${balance} MAD

</div>

<div class="route-status">

${text}

</div>

</div>

</div>

<div class="actions">

<button
class="move-btn"
onclick="moveUp(${index})">

⬆️ Up

</button>

<button
class="move-btn"
onclick="moveDown(${index})">

⬇️ Down

</button>

<button
class="btn-green"
onclick="markCollected(${index})">

🟢 Collected

</button>

<button
class="btn-yellow"
onclick="markClosed(${index})">

🟡 Closed

</button>

<button
class="btn-orange"
onclick="markComeBack(${index})">

🟠 Come Back

</button>

</div>

</div>

`;

});

document.getElementById(
"routeList"
).innerHTML =
html;

document.getElementById(
"collectedCount"
).innerText =
collected;

document.getElementById(
"pendingCount"
).innerText =
pending;

} 

function openCustomer(name){

let realIndex =
people.findIndex(
p => p.name === name
);

localStorage.setItem(
"selectedCustomer",
realIndex
);

window.location.href =
"person.html";

}

function setNextCurrent(){

let currentFound = false;

route.forEach(item=>{

if(
item.status === "current"
){

currentFound = true;

item.status =
"pending";

}

});

for(
let i = 0;
i < route.length;
i++
){

if(
route[i].status === "pending"
){

route[i].status =
"current";

break;

}

}

}

function markCollected(index){

route[index].status =
"collected";

setNextCurrent();

localStorage.setItem(
"routeToday",
JSON.stringify(route)
);

renderRoute();

}

function markClosed(index){

route[index].status =
"closed";

setNextCurrent();

localStorage.setItem(
"routeToday",
JSON.stringify(route)
);

renderRoute();

}

function markComeBack(index){

let customer =
route[index];

customer.status =
"comeback";

route.splice(
index,
1
);

route.push(customer);

setNextCurrent();

localStorage.setItem(
"routeToday",
JSON.stringify(route)
);

renderRoute();

}

document.getElementById(
"finishRouteBtn"
).onclick = function(){

if(
confirm(
"Finish Route ?"
)
){

localStorage.removeItem(
"routeToday"
);

alert(
"Route Finished"
);

location.reload();

}

};

function moveUp(index){

if(index === 0) return;

let temp =
route[index];

route[index] =
route[index - 1];

route[index - 1] =
temp;

localStorage.setItem(
"routeToday",
JSON.stringify(route)
);

renderRoute();

}

function moveDown(index){

if(
index === route.length - 1
) return;

let temp =
route[index];

route[index] =
route[index + 1];

route[index + 1] =
temp;

localStorage.setItem(
"routeToday",
JSON.stringify(route)
);

renderRoute();

}
   
</script>

</body>

</html>
