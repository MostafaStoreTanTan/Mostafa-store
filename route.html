<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Route Map v2</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fa;
padding:15px;
padding-bottom:100px;
}

.header{
background:#0F766E;
color:white;
padding:20px;
border-radius:20px;
text-align:center;
font-size:28px;
font-weight:bold;
margin-bottom:15px;
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-bottom:20px;
}

.stat{
background:white;
padding:15px;
border-radius:15px;
text-align:center;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.stat-number{
font-size:24px;
font-weight:bold;
}

.total{
color:#111;
}

.visited{
color:#16a34a;
}

.current{
color:#2563eb;
}

.pending{
color:#9ca3af;
}

.route-container{
max-width:700px;
margin:auto;
}

.depot{
background:white;
padding:15px;
border-radius:18px;
margin-bottom:15px;
text-align:center;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.stop-card{
background:white;
border-radius:18px;
padding:15px;
margin-bottom:15px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
display:flex;
align-items:center;
gap:15px;
}

.stop-number{
width:45px;
height:45px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
color:white;
font-size:18px;
flex-shrink:0;
}

.number-visited{
background:#16a34a;
}

.number-current{
background:#2563eb;
}

.number-pending{
background:#9ca3af;
}

.stop-info{
flex:1;
}

.stop-name{
font-size:20px;
font-weight:bold;
margin-bottom:5px;
}

.stop-balance{
color:#0F766E;
font-weight:bold;
margin-bottom:5px;
}

.stop-note{
font-size:13px;
color:#666;
margin-bottom:5px;
}

.stop-status{
font-weight:bold;
}

.status-visited{
color:#16a34a;
}

.status-current{
color:#2563eb;
}

.status-pending{
color:#9ca3af;
}

.visit-btn{
padding:10px 15px;
border:none;
border-radius:10px;
background:#16a34a;
color:white;
font-weight:bold;
}

.legend{
background:white;
padding:15px;
border-radius:15px;
display:flex;
justify-content:space-around;
margin-top:15px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.finish-btn{
width:100%;
margin-top:15px;
padding:16px;
border:none;
border-radius:15px;
background:#9ca3af;
color:white;
font-size:18px;
font-weight:bold;
}

.finished{
background:#16a34a !important;
}

</style>
</head>

<body>

<div class="header">
🗺️ Route Map
</div>

<div class="stats">

<div class="stat">
<div class="stat-number total" id="totalCount">0</div>
<div>Total</div>
</div>

<div class="stat">
<div class="stat-number visited" id="visitedCount">0</div>
<div>Visited</div>
</div>

<div class="stat">
<div class="stat-number current" id="currentCount">0</div>
<div>Current</div>
</div>

<div class="stat">
<div class="stat-number pending" id="pendingCount">0</div>
<div>Pending</div>
</div>

</div>

<div class="route-container">

<div class="depot">
🏠 Depot Start
</div>

<div id="routeList"></div>

<div class="legend">
<span>🟢 Visited</span>
<span>🔵 Current</span>
<span>⚪ Pending</span>
</div>

<button
class="finish-btn"
id="finishBtn">
Finish Route
</button>

</div>

<script>

let route =
JSON.parse(
localStorage.getItem("todayRoute")
) || [];

function renderRoute(){

let html = "";

let visitedCount =
route.filter(
person => person.visited
).length;

document.getElementById("totalCount")
.innerText = route.length;

document.getElementById("visitedCount")
.innerText = visitedCount;

document.getElementById("currentCount")
.innerText =
route.length > visitedCount
? 1
: 0;

document.getElementById("pendingCount")
.innerText =
route.length - visitedCount;

route.forEach((person,index)=>{

let stateClass =
"number-pending";

let statusClass =
"status-pending";

let statusText =
"Pending";

if(person.visited){

stateClass =
"number-visited";

statusClass =
"status-visited";

statusText =
"Visited";

}
else if(index === visitedCount){

stateClass =
"number-current";

statusClass =
"status-current";

statusText =
"Current";

}

html += `

<div class="stop-card">

<div class="stop-number ${stateClass}">
${index+1}
</div>

<div class="stop-info">

<div class="stop-name">
${person.name}
</div>

<div class="stop-balance">
💰 ${person.balance || 0} MAD
</div>

${
person.note
?
`
<div class="stop-note">
📝 ${person.note}
</div>
`
:
""
}

<div class="stop-status ${statusClass}">
${statusText}
</div>

</div>

${
!person.visited
?
`
<button
class="visit-btn"
onclick="markVisited(${index})">
✓ Visit
</button>
`
:
""
}

</div>

`;

});

document.getElementById("routeList")
.innerHTML = html;

let finishBtn =
document.getElementById("finishBtn");

if(
route.length > 0 &&
visitedCount === route.length
){

finishBtn.classList.add(
"finished"
);

finishBtn.innerText =
"✓ Route Finished";

}else{

finishBtn.classList.remove(
"finished"
);

finishBtn.innerText =
"Finish Route";

}

}

function markVisited(index){

route[index].visited = true;

localStorage.setItem(
"todayRoute",
JSON.stringify(route)
);

renderRoute();

}

document
.getElementById("finishBtn")
.onclick = function(){

if(route.length === 0){
alert("Route is empty");
return;
}

let visitedCount =
route.filter(
person => person.visited
).length;

if(
visitedCount !== route.length
){
alert(
"Visit all customers first"
);
return;
}

alert(
"Route Completed Successfully ✅"
);

};

renderRoute();

</script>

</body>
</html>
