<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Route</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f5f5f5;
padding:15px;
}

h1{
text-align:center;
}

.client{
background:white;
padding:15px;
margin-top:10px;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

</style>
</head>

<body>

<h1>📍 Today's Route</h1>

<div id="routeList"></div>

<script>

let route =
JSON.parse(
localStorage.getItem("todayRoute")
) || [];

let html = "";

route.forEach((person,index)=>{

html += `
<div class="client">
${index + 1}. ${person.name}
</div>
`;

});

document.getElementById("routeList")
.innerHTML = html;

</script>

</body>
</html>
