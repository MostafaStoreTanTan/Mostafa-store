<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Route Map</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tahoma',sans-serif}
body{background:#f0f4f8}

.header{background:#0F766E;color:white;padding:18px 20px;text-align:center;font-size:20px;font-weight:bold;display:flex;align-items:center;justify-content:space-between}
.header button{background:white;border:none;width:36px;height:36px;border-radius:10px;font-size:20px;cursor:pointer;color:#0F766E}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px;background:white}
.stat-card{text-align:center;padding:10px}
.stat-number{font-size:24px;font-weight:bold;color:#0F766E}
.stat-label{font-size:12px;color:#64748b}

.map-container{position:relative;width:100%;height:70vh;background:#e8f0f7;overflow:hidden}
.map-bg{position:absolute;width:100%;height:100%;background-image:radial-gradient(#d1d5db 1px, transparent 1px);background-size:30px 30px;opacity:0.3}

.route-path{position:absolute;top:0;left:0;width:100%;height:100%}
.route-path svg{width:100%;height:100%}

.point{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:8px;z-index:10}
.point-label{background:white;padding:8px 12px;border-radius:12px;box-shadow:0 3px 10px rgba(0,0,0,.15);font-size:14px;white-space:nowrap}
.point-label.name{font-weight:bold;color:#1e293b}
.point-label.status{font-size:12px;margin-top:2px}
.point-label.visited.status{color:#16a34a}
.point-label.current.status{color:#2563eb}
.point-label.pending.status{color:#6b7280}
.point-label.closed.status{color:#1f2937}
.point-label.postponed.status{color:#f97316}

.point-dot{width:36px;height:36px;border-radius:50%;color:white;font-weight:bold;display:flex;align-items:center;justify-content:center;font-size:16px;border:3px solid white;box-shadow:0 3px 8px rgba(0,0,0,.2)}
.point-dot.visited{background:#16a34a}
.point-dot.current{background:#2563eb}
.point-dot.pending{background:#9ca3af}
.point-dot.closed{background:#1f2937}
.point-dot.closed-note{background:#dc2626}
.point-dot.postponed{background:#f97316}

.add-box{position:fixed;bottom:0;left:0;right:0;background:white;padding:15px;border-radius:20px 20px 0 0;box-shadow:0 -4px 15px rgba(0,0,0,.1)}
.add-box input{width:100%;padding:14px;border:2px solid #e5e7eb;border-radius:12px;font-size:16px;text-align:right}
.add-btn{width:100%;padding:14px;margin-top:10px;border:none;border-radius:12px;background:#0F766E;color:white;font-size:16px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>

<div class="header">
<button onclick="window.location.href='index.html'">⬅️</button>
🗺️ Route
<button onclick="toggleView()">📋</button>
</div>

<div class="stats">
<div class="stat-card">
<div class="stat-number" id="totalCount">0</div>
<div class="stat-label">Total</div>
</div>
<div class="stat-card">
<div class="stat-number" id="visitedCount">0</div>
<div class="stat-label">Visited</div>
</div>
<div class="stat-card">
<div class="stat-number" id="currentCount">0</div>
<div class="stat-label">Current</div>
</div>
<div class="stat-card">
<div class="stat-number" id="pendingCount">0</div>
<div class="stat-label">Pending</div>
</div>
</div>

<div class="map-container" id="mapContainer">
<div class="map-bg"></div>
<div class="route-path">
<svg>
<path id="routePath" fill="none" stroke="#374151" stroke-width="8" stroke-dasharray="10 8" stroke-linecap="round"/>
</svg>
</div>
<div id="pointsContainer"></div>
</div>

<div class="add-box">
<input type="text" id="nameInput" placeholder="اكتب اسم الزبون + Enter">
<button class="add-btn" onclick="addCustomer()">➕ إضافة زبون</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBCVOOouLET3GDGyHj2i7ncvUZBjUUVB7Y",
  authDomain: "karni-b9b34.firebaseapp.com",
  databaseURL: "https://karni-b9b34-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "karni-b9b34",
  storageBucket: "karni-b9b34.firebasestorage.app",
  messagingSenderId: "489835094040",
  appId: "1:489835094040:web:109e20fe7b65516903236d"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let routeList = [];

onValue(ref(db, 'routeManual'), (snapshot)=>{
    routeList = snapshot.exists()? snapshot.val() : [];
    renderMap();
});

window.addCustomer = function(){
    const nameInput = document.getElementById('nameInput');
    const name = nameInput.value.trim();
    if(!name) return;

    routeList.push({
        id: Date.now(),
        name: name,
        status: 'pending',
        note: ''
    });
    set(ref(db, 'routeManual'), routeList);
    nameInput.value = '';
}

document.getElementById('nameInput').addEventListener('keypress', (e)=>{
    if(e.key === 'Enter') addCustomer();
});

window.toggleView = function(){
    window.location.href = 'route.html';
}

// رسم الطريق المنحني + الدوائر
function renderMap(){
    const container = document.getElementById('pointsContainer');
    const path = document.getElementById('routePath');
    container.innerHTML = '';

    let pending = 0, current = 0, visited = 0;

    if(routeList.length === 0){
        path.setAttribute('d', '');
        document.getElementById('totalCount').innerText = 0;
        return;
    }

    // حساب نقاط الطريق المنحني
    let points = [];
    let height = document.getElementById('mapContainer').offsetHeight;
    let width = document.getElementById('mapContainer').offsetWidth;

    routeList.forEach((item, index)=>{
        let y = 80 + (index * (height - 160) / Math.max(routeList.length - 1, 1));
        let x = width/2 + Math.sin(index * 0.8) * (width * 0.25);
        points.push({x, y});
    });

    // رسم مسار SVG
    if(points.length > 1){
        let d = `M ${points[0].x} ${points[0].y}`;
        for(let i = 1; i < points.length; i++){
            let cpX = (points[i-1].x + points[i].x) / 2;
            d += ` Q ${cpX} ${points[i-1].y}, ${points[i].x} ${points[i].y}`;
        }
        path.setAttribute('d', d);
    }

    // رسم النقط
    routeList.forEach((item, index)=>{
        if(item.status === 'pending') pending++;
        if(item.status === 'current') current++;
        if(item.status === 'visited') visited++;

        if(pending > 0 && item.status === 'pending' && current === 0){
            item.status = 'current';
            current = 1;
            pending--;
        }

        let point = points[index];
        let statusText = item.status === 'current'? 'Current' :
                        item.status === 'visited'? 'Visited' :
                        item.status === 'closed'? 'Closed' :
                        item.status === 'closed-note'? 'Closed' :
                        item.status === 'postponed'? 'Postponed' : 'Pending';

        let isLeft = index % 2 === 0; // مرة يمين مرة يسار

        container.innerHTML += `
        <div class="point" style="top:${point.y}px;left:${point.x}px;flex-direction:${isLeft?'row-reverse':'row'}">
            <div class="point-dot ${item.status}">${index+1}</div>
            <div class="point-label ${item.status}">
                <div class="name">${item.name}</div>
                <div class="status">${statusText}</div>
            </div>
        </div>
        `;
    });

    document.getElementById('totalCount').innerText = routeList.length;
    document.getElementById('visitedCount').innerText = visited;
    document.getElementById('currentCount').innerText = current;
    document.getElementById('pendingCount').innerText = pending;
}

window.addEventListener('resize', renderMap);
</script>
</body>
</html>
