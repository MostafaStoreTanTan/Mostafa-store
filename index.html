<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>📒 Karni</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fb;
padding-bottom:100px;
}

.header{
background:#0F766E;
color:white;
padding:30px 20px;
text-align:center;
font-size:42px;
font-weight:800;
letter-spacing:1px;
box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.dashboard{
padding:15px;
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
}

.stat-card{
background:white;
border-radius:18px;
padding:15px;
text-align:center;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.stat-number{
font-size:26px;
font-weight:bold;
color:#0F766E;
}

.stat-label{
margin-top:5px;
font-size:14px;
color:#666;
}

.search-box{
padding:15px;
}

.search-box input{
width:100%;
padding:15px;
border:none;
border-radius:15px;
background:white;
box-shadow:0 2px 8px rgba(0,0,0,.08);
font-size:16px;
}

.tabs{
display:flex;
gap:10px;
overflow:auto;
padding:0 15px 15px;
}

.tab-btn{
padding:12px 18px;
border:none;
border-radius:15px;
background:white;
white-space:nowrap;
box-shadow:0 2px 8px rgba(0,0,0,.08);
cursor:pointer;
}

.people-list{
padding:15px;
}

.person-card{
background:white;
padding:15px;
border-radius:18px;
margin-bottom:15px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.person-name{
font-size:22px;
font-weight:bold;
margin-bottom:5px;
}

.person-balance{
font-size:24px;
font-weight:bold;
color:#0F766E;
margin-bottom:8px;
}

.person-info{
font-size:14px;
color:#666;
margin-top:5px;
}

.person-actions{
display:flex;
gap:8px;
margin-top:12px;
flex-wrap:wrap;
}

.person-actions button{
padding:10px 14px;
border:none;
border-radius:10px;
cursor:pointer;
}

.profile-btn{
background:#2563eb;
color:white;
}

.favorite-btn{
background:#fbbf24;
}

.fab{
position:fixed;
right:20px;
bottom:20px;
width:70px;
height:70px;
border:none;
border-radius:50%;
background:#14B8A6;
color:white;
font-size:40px;
font-weight:bold;
}

.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.45);
justify-content:center;
align-items:center;
padding:20px;
}

.modal-content{
background:white;
width:100%;
max-width:450px;
padding:20px;
border-radius:20px;
}

.modal-content input,
.modal-content textarea{
width:100%;
padding:12px;
margin-bottom:10px;
border:1px solid #ddd;
border-radius:12px;
}

.save-btn{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#14B8A6;
color:white;
font-size:16px;
font-weight:bold;
}

</style>

</head>

<body>

<div class="header">
📒 Karni
</div>

<div class="dashboard">

<div class="stat-card">
<div class="stat-number" id="totalAmount">
0
</div>
<div class="stat-label">
💰 Amount
</div>
</div>

<div class="stat-card">
<div class="stat-number" id="peopleCount">
0
</div>
<div class="stat-label">
👥 Customers
</div>
</div>

<div class="stat-card">
<div class="stat-number" id="overdueCount">
0
</div>
<div class="stat-label">
🔴 Overdue
</div>
</div>

<div class="stat-card">
<div class="stat-number" id="todayCount">
0
</div>
<div class="stat-label">
🟢 Today
</div>
</div>

</div>

<div class="search-box">

<input
type="text"
id="search"
placeholder="🔍 Search Customer">

</div>

<div class="tabs">

<button class="tab-btn">
📋 All
</button>

<button class="tab-btn">
⭐ Favorites
</button>

<button class="tab-btn">
🔴 Overdue
</button>

<button class="tab-btn">
🟢 Today
</button>

<button class="tab-btn">
🟡 Upcoming
</button>

</div>

<div
class="people-list"
id="peopleList">
</div>

<button
class="fab"
onclick="openModal()">
+
</button>

<div
class="modal"
id="personModal">

<div class="modal-content">

<h2>
➕ Add Customer
</h2>

<input
type="text"
id="personName"
placeholder="Customer Name">

<input
type="tel"
id="personPhone"
placeholder="Phone Number">

<input
type="date"
id="personDueDate">

<textarea
id="personNote"
placeholder="First Note">
</textarea>

<button
class="save-btn"
id="savePersonBtn">
Save Customer
</button>

</div>

</div>

<script>

let people =
JSON.parse(
localStorage.getItem("people")
) || [];

let currentTab =
"all";

function savePeople(){

localStorage.setItem(
"people",
JSON.stringify(people)
);

}

function openModal(){

document.getElementById(
"personModal"
).style.display =
"flex";

}

function closeModal(){

document.getElementById(
"personModal"
).style.display =
"none";

}

document
.getElementById(
"savePersonBtn"
)
.onclick = function(){

let name =
document
.getElementById(
"personName"
)
.value.trim();

if(!name){

alert(
"Enter Customer Name"
);

return;

}

people.unshift({

name:name,

phone:
document
.getElementById(
"personPhone"
)
.value,

dueDate:
document
.getElementById(
"personDueDate"
)
.value,

rating:0,

favorite:false,

location:"",

photo:"",

operations:[],

conversation:[],

notes:[
document
.getElementById(
"personNote"
)
.value
]

});

savePeople();

closeModal();

location.reload();

};

function renderPeople(){

let html = "";

let totalAmount = 0;

let today =
new Date()
.toISOString()
.split("T")[0];

let overdue = 0;
let todayCount = 0;
let upcoming = 0;

let search =
document
.getElementById("search")
.value
.toLowerCase();

people.forEach(person=>{

let balance = 0;

if(person.operations){

person.operations.forEach(op=>{

if(op.type === "Depot"){
balance += Number(op.amount);
}

if(op.type === "Paid"){
balance -= Number(op.amount);
}

});

}

person.realBalance = balance;

totalAmount += balance;

if(balance > 0){

if(
person.dueDate &&
person.dueDate < today
){
overdue++;
}

else if(
person.dueDate === today
){
todayCount++;
}

else if(
person.dueDate > today
){
upcoming++;
}

}

});

document
.getElementById("totalAmount")
.innerText =
totalAmount + " MAD";

document
.getElementById("peopleCount")
.innerText =
people.length;

document
.getElementById("overdueCount")
.innerText =
overdue;

document
.getElementById("todayCount")
.innerText =
todayCount;

people.forEach(
(person,index)=>{

if(
search &&
!person.name
.toLowerCase()
.includes(search)
){
return;
}

if(
currentTab === "favorites" &&
!person.favorite
){
return;
}

if(
currentTab === "overdue" &&
!(
person.realBalance > 0 &&
person.dueDate &&
person.dueDate < today
)
){
return;
}

if(
currentTab === "today" &&
!(
person.realBalance > 0 &&
person.dueDate === today
)
){
return;
}

if(
currentTab === "upcoming" &&
!(
person.realBalance > 0 &&
person.dueDate > today
)
){
return;
}

let stars =
"⭐".repeat(
person.rating || 0
);

html += `

<div class="person-card">

<div class="person-name">
${stars}
${person.name}
</div>

<div class="person-balance">
${person.realBalance} MAD
</div>

<div class="person-info">
📞 ${person.phone || "-"}
</div>

${
person.dueDate
?
`
<div class="person-info">
📅 ${person.dueDate}
</div>
`
:
""
}

${
person.location
?
`
<div class="person-info">
📍 Location Saved
</div>
`
:
""
}

<div class="person-actions">

<button
class="profile-btn"
onclick="openProfile(${index})">
👤 Profile
</button>

<button
class="favorite-btn"
onclick="toggleFavorite(${index})">
⭐
</button>

</div>

</div>

`;

});

document
.getElementById("peopleList")
.innerHTML =
html;

}

function toggleFavorite(index){

people[index].favorite =
!people[index].favorite;

savePeople();

renderPeople();

}

function openProfile(index){

localStorage.setItem(
"selectedCustomer",
index
);

window.location.href =
"person.html";

}

document
.querySelectorAll(".tab-btn")
.forEach((btn,index)=>{

btn.onclick = function(){

if(index === 0)
currentTab = "all";

if(index === 1)
currentTab = "favorites";

if(index === 2)
currentTab = "overdue";

if(index === 3)
currentTab = "today";

if(index === 4)
currentTab = "upcoming";

renderPeople();

};

});

document
.getElementById("search")
.addEventListener(
"input",
renderPeople
);

renderPeople();
  
</script>

</body>
</html>
