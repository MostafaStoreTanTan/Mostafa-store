<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karni Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{font-family:'Tajawal',sans-serif;margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#00d4ff 0%,#00a8ff 100%);min-height:100vh;padding-bottom:80px}
.header{padding:20px;text-align:center;color:white}
.header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.header h1{font-size:28px;font-weight:900;display:flex;align-items:center;gap:8px}
.header-btn{width:45px;height:45px;border-radius:15px;background:rgba(255,255,255,0.25);border:none;color:white;font-size:20px;cursor:pointer}
.firebase-badge{background:rgba(255,255,255,0.25);padding:8px 20px;border-radius:25px;display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:14px}
.dot{width:10px;height:10px;background:#06d6a0;border-radius:50%}
.container{padding:20px}
.search-box{background:white;border-radius:20px;padding:15px 20px;display:flex;align-items:center;gap:12px;margin-bottom:20px;box-shadow:0 4px 15px rgba(0,0,0,0.1)}
.search-box input{border:none;outline:none;width:100%;font-size:16px;text-align:right}
.filter-btns{display:flex;gap:10px;margin-bottom:25px}
.filter-btn{flex:1;padding:12px;border-radius:25px;border:2px solid white;background:transparent;color:white;font-weight:800;font-size:16px;cursor:pointer}
.filter-btn.active{background:white;color:#00a8ff}
.customer-card{background:white;border-radius:22px;padding:20px;margin-bottom:15px;box-shadow:0 5px 20px rgba(0,0,0,0.1)}
.customer-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.customer-name{font-size:22px;font-weight:900;color:#1d3557}
.avatar{width:55px;height:55px;border-radius:18px;background:#e9ecef;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:#00a8ff}
.amount{font-size:36px;font-weight:900;color:#00a8ff;text-align:center;margin:15px 0}
.customer-info{display:flex;justify-content:center;align-items:center;gap:15px;color:#666;font-size:15px;margin-bottom:15px}
.btns{display:flex;gap:10px}
.btn{flex:1;padding:14px;border:none;border-radius:14px;font-weight:900;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;color:white}
.btn-delete{background:#ef476f}
.btn-paid{background:#06d6a0}
.btn-details{background:#4361ee}
.add-btn{position:fixed;bottom:30px;left:30px;width:65px;height:65px;border-radius:50%;background:linear-gradient(135deg,#00d4ff 0%,#00a8ff 100%);border:none;color:white;font-size:35px;cursor:pointer;box-shadow:0 8px 25px rgba(0,168,255,0.4)}
.loading{text-align:center;color:white;padding:80px 20px;font-size:24px;font-weight:800}
</style>
<script type="importmap">{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js","firebase/database":"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"}}</script>
<script type="module">
import { initializeApp } from 'firebase/app';
import { getDatabase, ref, onValue, remove, update } from 'firebase/database';

// بيانات Gmail القديم - بدلهم بمعلوماتك
const app = initializeApp({
apiKey: "AIzaSyBCVOOouLET3GDGyHj2i7ncvUZBjUUVB7Y",
databaseURL: "https://users-1eecc-default-rtdb.firebaseio.com",
projectId: "users-1eecc"
});
const db = getDatabase(app);

// تحميل الزبناء
onValue(ref(db, 'customers'), (snapshot)=>{
const data = snapshot.val() || {};
const container = document.getElementById('customersList');

if(Object.keys(data).length === 0){
container.innerHTML = '<div class="loading">لا يوجد زبناء<br>اضغط + لإضافة زبون</div>';
return;
}

let html = '';
for(let id in data){
const c = data[id];
const balance = (c.depot || 0) - (c.paid || 0);
const firstLetter = c.name? c.name.charAt(0).toUpperCase() : 'A';

html += `
<div class="customer-card">
<div class="customer-header">
<div class="customer-name">${c.name}</div>
<div class="avatar">${firstLetter}</div>
</div>
<div class="amount">${balance} درهم</div>
<div class="customer-info">
<i class="fas fa-calendar"></i> ${c.paymentDate || 'بدون تاريخ'}
</div>
<div class="btns">
<button class="btn btn-delete" onclick="deleteCustomer('${id}')"><i class="fas fa-trash"></i></button>
<button class="btn btn-paid" onclick="markPaid('${id}', ${c.depot})"><i class="fas fa-check"></i></button>
<button class="btn btn-details" onclick="openPerson('${id}')"><i class="fas fa-user"></i> التفاصيل</button>
</div>
</div>
`;
}
container.innerHTML = html;
});

// الدوال
window.openPerson = function(id){
window.location.href = 'person.html?id=' + id;
}

window.deleteCustomer = async function(id){
if(confirm('حذف الزبون؟')){
await remove(ref(db, 'customers/'+id));
}
}

window.markPaid = async function(id, depot){
await update(ref(db, 'customers/'+id), {
paid: depot,
balance: 0,
status: 'paid',
updatedAt: Date.now()
});
alert('تم وضع علامة مخلص ✅');
}
</script>
</head>
<body>
<div class="header">
<div class="header-top">
<button class="header-btn"><i class="fas fa-moon"></i></button>
<h1><i class="fas fa-book"></i> Karni Pro</h1>
<button class="header-btn"><i class="fas fa-chart-bar"></i></button>
</div>
<div class="firebase-badge">
<span class="dot"></span> متصل بـ Firebase
</div>
</div>

<div class="container">
<div class="search-box">
<i class="fas fa-search"></i>
<input type="text" placeholder="ابحث عن زبون...">
</div>

<div class="filter-btns">
<button class="filter-btn">قادم</button>
<button class="filter-btn">متأخر</button>
<button class="filter-btn">اليوم</button>
<button class="filter-btn active">الكل</button>
</div>

<div id="customersList" class="loading">جاري التحميل...</div>
</div>

<button class="add-btn">+</button>
</body>
</html>
