<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Karni v3</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fb;
padding-bottom:100px;
}

.header{
background:#0F766E;
color:white;
padding:22px;
text-align:center;
font-size:30px;
font-weight:bold;
}

.dashboard{
padding:15px;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
}

.stat-card{
background:white;
border-radius:18px;
padding:15px;
text-align:center;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.stat-number{
font-size:24px;
font-weight:bold;
color:#0F766E;
}

.stat-label{
font-size:13px;
color:#666;
margin-top:5px;
}

.route-btn{
width:calc(100% - 30px);
margin:0 15px 15px;
padding:16px;
border:none;
border-radius:18px;
background:#2563eb;
color:white;
font-size:18px;
font-weight:bold;
}

.search-box{
padding:0 15px;
margin-bottom:10px;
}

.search-box input{
width:100%;
padding:14px;
border:none;
border-radius:15px;
background:white;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.tabs{
display:flex;
overflow:auto;
gap:8px;
padding:0 15px 15px;
}

.tab-btn{
padding:10px 15px;
border:none;
border-radius:15px;
background:white;
white-space:nowrap;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.people-list{
padding:15px;
}

.person-card{
background:white;
padding:15px;
border-radius:18px;
margin-bottom:12px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.person-name{
font-size:20px;
font-weight:bold;
margin-bottom:5px;
}

.person-balance{
font-size:18px;
font-weight:bold;
color:#0F766E;
}

.person-info{
margin-top:5px;
color:#666;
font-size:14px;
}

.person-actions{
display:flex;
flex-wrap:wrap;
gap:5px;
margin-top:12px;
}

.person-actions button{
padding:8px 12px;
border:none;
border-radius:10px;
cursor:pointer;
}

.fab{
position:fixed;
right:20px;
bottom:20px;
width:65px;
height:65px;
border-radius:50%;
border:none;
background:#14B8A6;
color:white;
font-size:35px;
font-weight:bold;
}

.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.45);
justify-content:center;
align-items:center;
padding:20px;
}

.modal-content{
background:white;
width:100%;
max-width:450px;
padding:20px;
border-radius:20px;
}

.modal-content h2{
margin-bottom:15px;
}

.modal-content input,
.modal-content textarea{
width:100%;
padding:12px;
margin-bottom:10px;
border:1px solid #ddd;
border-radius:12px;
}

.stars{
display:flex;
gap:5px;
margin-bottom:15px;
font-size:28px;
}

.star{
cursor:pointer;
color:#ccc;
}

.star.active{
color:#fbbf24;
}

.save-btn{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#14B8A6;
color:white;
font-size:16px;
font-weight:bold;
}

</style>
</head>

<body>

<div class="header">
Karni v3
</div>

<div class="dashboard">

<div class="stat-card">
<div class="stat-number" id="totalAmount">0</div>
<div class="stat-label">Amount</div>
</div>

<div class="stat-card">
<div class="stat-number" id="peopleCount">0</div>
<div class="stat-label">People</div>
</div>

<div class="stat-card">
<div class="stat-number" id="routeCount">0</div>
<div class="stat-label">Route</div>
</div>

<div class="stat-card">
<div class="stat-number" id="overdueCount">0</div>
<div class="stat-label">Overdue</div>
</div>

<div class="stat-card">
<div class="stat-number" id="todayCount">0</div>
<div class="stat-label">Today</div>
</div>

<div class="stat-card">
<div class="stat-number" id="upcomingCount">0</div>
<div class="stat-label">Upcoming</div>
</div>

</div>

<a href="route.html">
<button class="route-btn">
🗺️ Open Route Map
</button>
</a>

<div class="search-box">
<input
type="text"
id="search"
placeholder="Search Customer">
</div>

<div class="tabs">

<button class="tab-btn">📋 All</button>

<button class="tab-btn">⭐ Favorites</button>

<button class="tab-btn">🔴 Overdue</button>

<button class="tab-btn">🟢 Today</button>

<button class="tab-btn">🟡 Upcoming</button>

</div>

<div
class="people-list"
id="peopleList">
</div>

<button
class="fab"
onclick="openModal()">
+
</button>

<div
class="modal"
id="personModal">

<div class="modal-content">

<h2>Add Customer</h2>

<input
type="text"
id="personName"
placeholder="Name">

<input
type="tel"
id="personPhone"
placeholder="Phone Number">

<input
type="number"
id="personBalance"
placeholder="Initial Balance">

<input
type="date"
id="personDueDate">

<textarea
id="personNote"
placeholder="First Note">
</textarea>

<div class="stars">

<span class="star">★</span>
<span class="star">★</span>
<span class="star">★</span>
<span class="star">★</span>
<span class="star">★</span>

</div>

<button
class="save-btn"
id="savePersonBtn">
Save Customer
</button>

</div>

</div>

<script>

let people =
JSON.parse(
localStorage.getItem("people")
) || [];

let selectedRating = 0;
let currentTab = "all";

const stars =
document.querySelectorAll(".star");

stars.forEach((star,index)=>{

star.onclick = function(){

selectedRating = index + 1;

stars.forEach((s,i)=>{

if(i <= index){
s.classList.add("active");
}else{
s.classList.remove("active");
}

});

};

});

function savePeople(){

localStorage.setItem(
"people",
JSON.stringify(people)
);

}

function openModal(){

document.getElementById("personModal")
.style.display = "flex";

}

function closeModal(){

document.getElementById("personModal")
.style.display = "none";

}

document
.getElementById("savePersonBtn")
.onclick = function(){

const name =
document.getElementById("personName")
.value.trim();

if(name === ""){
alert("Enter customer name");
return;
}

people.unshift({

name:name,

phone:
document.getElementById("personPhone")
.value,

balance:Number(
document.getElementById("personBalance")
.value
) || 0,

dueDate:
document.getElementById("personDueDate")
.value,

rating:selectedRating,

favorite:false,

notes:[
document.getElementById("personNote")
.value
],

history:[],

createdAt:
new Date().toISOString()

});

savePeople();

closeModal();

renderPeople();

};

document
.querySelectorAll(".tab-btn")
.forEach((btn,index)=>{

btn.onclick = function(){

if(index === 0)
currentTab = "all";

if(index === 1)
currentTab = "favorites";

if(index === 2)
currentTab = "overdue";

if(index === 3)
currentTab = "today";

if(index === 4)
currentTab = "upcoming";

renderPeople();

};

});

function renderPeople(){

let html = "";

let totalAmount = 0;

let today =
new Date()
.toISOString()
.split("T")[0];

let overdue = 0;
let todayCounter = 0;
let upcoming = 0;

let route =
JSON.parse(
localStorage.getItem("todayRoute")
) || [];

document.getElementById("routeCount")
.innerText = route.length;

people.sort((a,b)=>{

if(a.favorite && !b.favorite)
return -1;

if(!a.favorite && b.favorite)
return 1;

return 0;

});

people.forEach(person=>{

totalAmount += person.balance;

if(person.balance > 0){

if(
person.dueDate &&
person.dueDate < today
){
overdue++;
}

else if(
person.dueDate === today
){
todayCounter++;
}

else if(
person.dueDate > today
){
upcoming++;
}

}

});

document.getElementById("totalAmount")
.innerText = totalAmount;

document.getElementById("peopleCount")
.innerText = people.length;

document.getElementById("overdueCount")
.innerText = overdue;

document.getElementById("todayCount")
.innerText = todayCounter;

document.getElementById("upcomingCount")
.innerText = upcoming;

let search =
document.getElementById("search")
.value.toLowerCase();

people.forEach((person,index)=>{

if(
search &&
!person.name
.toLowerCase()
.includes(search)
){
return;
}

if(
currentTab === "favorites" &&
!person.favorite
){
return;
}

if(
currentTab === "overdue" &&
!(
person.balance > 0 &&
person.dueDate &&
person.dueDate < today
)
){
return;
}

if(
currentTab === "today" &&
!(
person.balance > 0 &&
person.dueDate === today
)
){
return;
}

if(
currentTab === "upcoming" &&
!(
person.balance > 0 &&
person.dueDate > today
)
){
return;
}

let starsHtml = "";

for(
let i = 0;
i < person.rating;
i++
){
starsHtml += "⭐";
}

html += `

<div class="person-card">

<div class="person-name">
${starsHtml}
${person.name}
</div>

<div class="person-balance">
${person.balance} MAD
</div>

<div class="person-info">
📞 ${person.phone || "-"}
</div>

${
person.dueDate
?
`
<div class="person-info">
📅 ${person.dueDate}
</div>
`
:
""
}

${
person.notes &&
person.notes[0]
?
`
<div class="person-info">
📝 ${person.notes[0]}
</div>
`
:
""
}

<div class="person-actions">

<button onclick="addDebt(${index})">
+ Debt
</button>

<button onclick="addPayment(${index})">
- Payment
</button>

<button onclick="toggleFavorite(${index})">
⭐
</button>

<button onclick="addToRoute(${index})">
📍 Route
</button>

<button onclick="openProfile(${index})">
👤 Profile
</button>

</div>

</div>

`;

});

document.getElementById("peopleList")
.innerHTML = html;

}

function addDebt(index){

let amount =
prompt("Debt Amount");

if(!amount) return;

people[index].balance +=
Number(amount);

people[index].history.push({

type:"Debt",

amount:Number(amount),

date:
new Date().toLocaleDateString(),

time:
new Date().toLocaleTimeString()

});

savePeople();

renderPeople();

}

function addPayment(index){

let amount =
prompt("Payment Amount");

if(!amount) return;

people[index].balance -=
Number(amount);

if(
people[index].balance < 0
){
people[index].balance = 0;
}

people[index].history.push({

type:"Payment",

amount:Number(amount),

date:
new Date().toLocaleDateString(),

time:
new Date().toLocaleTimeString()

});

savePeople();

renderPeople();

}

function toggleFavorite(index){

people[index].favorite =
!people[index].favorite;

savePeople();

renderPeople();

}

function addToRoute(index){

let route =
JSON.parse(
localStorage.getItem("todayRoute")
) || [];

let exists =
route.some(
p => p.name === people[index].name
);

if(exists){
alert("Already in route");
return;
}

route.push(people[index]);

localStorage.setItem(
"todayRoute",
JSON.stringify(route)
);

alert("Added To Route");

}

document
.getElementById("search")
.addEventListener(
"input",
renderPeople
);

function openProfile(index){

localStorage.setItem(
"selectedCustomer",
index
);

window.location.href =
"person.html";

}

renderPeople();

</script>

</body>
</html>
