<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Karni</title>

<link rel="icon" href="IMG-20260531-WA0000.jpg">

<meta name="theme-color" content="#0F766E">

<link rel="apple-touch-icon" href="IMG-20260531-WA0000.jpg">

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
}

.header{
background:#0F766E;
color:white;
padding:20px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.cards{
padding:15px;
}

.card{
background:white;
padding:20px;
margin-bottom:15px;
border-radius:15px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.value{
font-size:30px;
font-weight:bold;
color:#0F766E;
}

.btn{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#14B8A6;
color:white;
font-size:18px;
cursor:pointer;
margin-top:10px;
}

.person{
background:white;
padding:15px;
margin-top:10px;
border-radius:12px;
box-shadow:0 2px 6px rgba(0,0,0,.1);
}

input{
width:100%;
padding:12px;
margin-top:10px;
border:1px solid #ddd;
border-radius:10px;
box-sizing:border-box;
}

</style>
</head>

<body>

<div class="header">
Karni
</div>

<div class="card">
<p>Total Amount</p>
<div class="value" id="totalAmount">0 MAD</div>
</div>

<div class="card">
<p>People</p>
<div class="value" id="peopleCount">0</div>
</div>

<input type="text" id="search" placeholder="🔍 Search person..." onkeyup="renderPeople()">

<input type="text" id="name" placeholder="Person Name">

<button class="btn" onclick="addPerson()">
+ Add Person
</button>

<div style="display:flex;gap:5px;margin-top:10px;">

<button onclick="currentTab='overdue';renderPeople()">
🔴 Overdue (<span id="overdueCount">0</span>)
</button>

<button onclick="currentTab='today';renderPeople()">
🟢 Today (<span id="todayCount">0</span>)
</button>

<button onclick="currentTab='upcoming';renderPeople()">
🟡 Upcoming (<span id="upcomingCount">0</span>)
</button>

<button onclick="currentTab='all';renderPeople()">
📋 All
</button>

</div>

<div id="peopleList"></div>

</div>

<script>

let people = JSON.parse(localStorage.getItem("people")) || [];

let currentTab = "all";
  
function renderPeople(){

document.getElementById("peopleCount").innerText = people.length;

let total = 0;

people.forEach(person => {
total += person.balance;
});

people.sort((a,b) => {
return (b.favorite === true) - (a.favorite === true);
});

document.getElementById("totalAmount").innerText =
total + " MAD";

let today = new Date().toISOString().split("T")[0];

let overdueCount = 0;
let todayCount = 0;
let upcomingCount = 0;

people.forEach(person => {

if(!person.dueDate) return;

if(person.dueDate < today){
overdueCount++;
}
else if(person.dueDate === today){
todayCount++;
}
else{
upcomingCount++;
}

});

document.getElementById("overdueCount").innerText =
overdueCount;

document.getElementById("todayCount").innerText =
todayCount;

document.getElementById("upcomingCount").innerText =
upcomingCount;

let html = "";

let search = document.getElementById("search")
? document.getElementById("search").value.toLowerCase()
: "";

people.forEach((person,index)=>{

if(
search &&
!person.name.toLowerCase().includes(search)
){
return;
}

let today = new Date().toISOString().split("T")[0];

if(currentTab === "overdue"){

if(
!person.dueDate ||
person.dueDate >= today
){
return;
}

}

if(currentTab === "today"){

if(person.dueDate !== today){
return;
}

}

if(currentTab === "upcoming"){

if(
!person.dueDate ||
person.dueDate <= today
){
return;
}

}

html += `
<div class="person">

<h3>

<button onclick="toggleFavorite(${index})" style="border:none;background:none;font-size:28px;cursor:pointer;">
${person.favorite ? "⭐" : "☆"}
</button>

👤 ${person.name}

</h3>

<p>💰 Balance: ${person.balance} MAD</p>

${person.dueDate ? `
<p>📅 Due Date: ${person.dueDate}</p>
` : ""}

<button onclick="addDebt(${index})">
+ Debt
</button>

<button onclick="addPayment(${index})">
- Payment
</button>

<button onclick="toggleMenu(${index})">
⚙️ More
</button>

<div id="menu-${index}" style="display:none;">

<button onclick="deletePerson(${index})">
🗑 Delete
</button>

<button onclick="editNote(${index})">
📝 Note
</button>

<button onclick="editPerson(${index})">
✏️ Edit Name
</button>

<button onclick="deleteNote(${index})">
❌ Delete Note
</button>

<button onclick="openDatePicker(${index})">
📅 Due Date
</button>

<input
type="date"
id="date-${index}"
style="display:none"
onchange="saveDueDate(${index},this.value)">

${person.note ? `<p>📝 ${person.note}</p>` : ""}

<h4>History</h4>

${person.history ?
person.history.map((item,i) =>
`<p>
${item}
<button onclick="editHistory(${index},${i})">✏️</button>
<button onclick="deleteHistory(${index},${i})">❌</button>
</p>`
).join("")
: ""}

</div>
`;

});

document.getElementById("peopleList").innerHTML = html;

}

function addPerson(){

const name = document.getElementById("name").value;

if(name === ""){
alert("Enter a name");
return;
}

people.push({
name:name,
balance:0,
history:[],
favorite:false
});

localStorage.setItem("people", JSON.stringify(people));

document.getElementById("name").value = "";

renderPeople();

}
function addDebt(index){

let amount = prompt("Debt Amount");

if(!amount) return;

people[index].balance += Number(amount);

if(!people[index].history){
people[index].history = [];
}

people[index].history.push(
"➕ Debt: " + amount + " MAD | " +
new Date().toLocaleString()
);

localStorage.setItem("people", JSON.stringify(people));

renderPeople();

}

function addPayment(index){

let amount = prompt("Payment Amount");

if(!amount) return;

people[index].balance -= Number(amount);

if(!people[index].history){
people[index].history = [];
}

people[index].history.push(
"➖ Payment: " + amount + " MAD | " +
new Date().toLocaleString()
);

if(people[index].balance < 0){
people[index].balance = 0;
}

localStorage.setItem("people", JSON.stringify(people));

renderPeople();

}

function deletePerson(index){

if(confirm("Delete this person?")){

people.splice(index,1);

localStorage.setItem(
"people",
JSON.stringify(people)
);

renderPeople();

}

} 

function deleteHistory(personIndex, historyIndex){

if(confirm("Delete this operation?")){

people[personIndex].history.splice(historyIndex,1);

localStorage.setItem(
"people",
JSON.stringify(people)
);

renderPeople();

}

}

function editHistory(personIndex, historyIndex){

let newText = prompt(
"Edit operation",
people[personIndex].history[historyIndex]
);

if(newText === null || newText.trim() === ""){
return;
}

people[personIndex].history[historyIndex] = newText;

localStorage.setItem(
"people",
JSON.stringify(people)
);

renderPeople();

}

function editPerson(index){

let newName = prompt(
"Edit name",
people[index].name
);

if(newName === null || newName.trim() === ""){
return;
}

people[index].name = newName;

localStorage.setItem(
"people",
JSON.stringify(people)
);

renderPeople();

}

function editNote(index){

let note = prompt(
"Write a note",
people[index].note || ""
);

if(note === null) return;

people[index].note = note;

localStorage.setItem(
"people",
JSON.stringify(people)
);

renderPeople();

}

function deleteNote(index){

if(confirm("Delete note?")){

people[index].note = "";

localStorage.setItem(
"people",
JSON.stringify(people)
);

renderPeople();

}

}

function openDatePicker(index){

document
.getElementById(`date-${index}`)
.showPicker();

}

function saveDueDate(index,date){

people[index].dueDate = date;

localStorage.setItem(
"people",
JSON.stringify(people)
);

renderPeople();

}

function toggleFavorite(index){

people[index].favorite =
!people[index].favorite;

localStorage.setItem(
"people",
JSON.stringify(people)
);

renderPeople();

}

renderPeople();
  
</script>

</body>
</html>
