<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karni</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
}

.header{
background:#0F766E;
color:white;
padding:20px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.cards{
padding:15px;
}

.card{
background:white;
padding:20px;
margin-bottom:15px;
border-radius:15px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.value{
font-size:30px;
font-weight:bold;
color:#0F766E;
}

.btn{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#14B8A6;
color:white;
font-size:18px;
cursor:pointer;
}

</style>
</head>

<body>

<div class="header">
Karni
</div>

<div class="cards">

<div class="card">
<p>Total Amount</p>
<div class="value">0 MAD</div>
</div>

<div class="card">
<p>People</p>
<div class="value">0</div>
</div>

<button class="btn">
+ Add Person
</button>

</div>

</body>
</html>
