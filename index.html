<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karni</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
}

.header{
background:#0F766E;
color:white;
padding:20px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.cards{
padding:15px;
}

.card{
background:white;
padding:20px;
margin-bottom:15px;
border-radius:15px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.value{
font-size:30px;
font-weight:bold;
color:#0F766E;
}

.btn{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#14B8A6;
color:white;
font-size:18px;
cursor:pointer;
margin-top:10px;
}

.person{
background:white;
padding:15px;
margin-top:10px;
border-radius:12px;
box-shadow:0 2px 6px rgba(0,0,0,.1);
}

input{
width:100%;
padding:12px;
margin-top:10px;
border:1px solid #ddd;
border-radius:10px;
box-sizing:border-box;
}

</style>
</head>

<body>

<div class="header">
Karni
</div>

<div class="card">
<p>Total Amount</p>
<div class="value" id="totalAmount">0 MAD</div>
</div>

<div class="card">
<p>People</p>
<div class="value" id="peopleCount">0</div>
</div>

<input type="text" id="name" placeholder="Person Name">

<button class="btn" onclick="addPerson()">
+ Add Person
</button>

<div id="peopleList"></div>

</div>

<script>

let people = JSON.parse(localStorage.getItem("people")) || [];

function renderPeople(){

document.getElementById("peopleCount").innerText = people.length;

  let total = 0;

people.forEach(person => {
total += person.balance;
});

document.getElementById("totalAmount").innerText =
total + " MAD";
  
let html = "";

people.forEach((person,index)=>{

html += `
<div class="person">

<h3>👤 ${person.name}</h3>

<p>💰 Balance: ${person.balance} MAD</p>

<button onclick="addDebt(${index})">
+ Debt
</button>

<button onclick="addPayment(${index})">
- Payment
</button>

<button onclick="deletePerson(${index})">
🗑 Delete
</button>

<h4>History</h4>

${person.history ?
person.history.map(item =>
`<p>${item}</p>`
).join("")
: ""}

</div>
`;

});

document.getElementById("peopleList").innerHTML = html;

}

function addPerson(){

const name = document.getElementById("name").value;

if(name === ""){
alert("Enter a name");
return;
}

people.push({
name:name,
balance:0,
history:[],
note:""
});

localStorage.setItem("people", JSON.stringify(people));

document.getElementById("name").value = "";

renderPeople();

}
function addDebt(index){

let amount = prompt("Debt Amount");

if(!amount) return;

people[index].balance += Number(amount);

if(!people[index].history){
people[index].history = [];
}

people[index].history.push(
"➖ Payment: " + amount + " MAD | " +
new Date().toLocaleString()
);

localStorage.setItem("people", JSON.stringify(people));

renderPeople();

}

function addPayment(index){

let amount = prompt("Payment Amount");

if(!amount) return;

people[index].balance -= Number(amount);

if(!people[index].history){
people[index].history = [];
}

people[index].history.push(
"➖ Payment: " + amount + " MAD"
);

if(people[index].balance < 0){
people[index].balance = 0;
}

localStorage.setItem("people", JSON.stringify(people));

renderPeople();

}

function deletePerson(index){

if(confirm("Delete this person?")){

people.splice(index,1);

localStorage.setItem(
"people",
JSON.stringify(people)
);

renderPeople();

}

}

renderPeople();

</script>

</body>
</html>
