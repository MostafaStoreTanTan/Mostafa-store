<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>📒 Karni</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fb;
padding-bottom:100px;
}

.header{
background:#0F766E;
color:white;
padding:28px 20px;
text-align:center;
font-size:42px;
font-weight:800;
letter-spacing:1px;
box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.dashboard{
padding:15px;
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
}

.stat-card{
background:white;
border-radius:18px;
padding:15px;
text-align:center;
box-shadow:0 2px 8px rgba(0,0,0,.08);
cursor:pointer;
}

.stat-number{
font-size:26px;
font-weight:bold;
color:#0F766E;
}

.stat-label{
font-size:14px;
color:#666;
margin-top:5px;
}

.big-btn{
width:calc(100% - 30px);
margin:0 15px 10px;
padding:16px;
border:none;
border-radius:18px;
font-size:18px;
font-weight:bold;
color:white;
cursor:pointer;
}

.route-btn{
background:#2563eb;
}

.calendar-btn{
background:#0F766E;
}

.search-box{
padding:15px;
}

.search-box input{
width:100%;
padding:15px;
border:none;
border-radius:15px;
background:white;
box-shadow:0 2px 8px rgba(0,0,0,.08);
font-size:16px;
}

.tabs{
display:flex;
gap:10px;
overflow:auto;
padding:0 15px 15px;
}

.tab-btn{
padding:12px 18px;
border:none;
border-radius:15px;
background:white;
white-space:nowrap;
box-shadow:0 2px 8px rgba(0,0,0,.08);
cursor:pointer;
}

.people-list{
padding:15px;
}

</style>

</head>

<body>

<div class="header">
📒 Karni
</div>

<div class="dashboard">

<div class="stat-card">
<div class="stat-number"
id="totalAmount">
0
</div>
<div class="stat-label">
💰 Amount
</div>
</div>

<div class="stat-card">
<div class="stat-number"
id="peopleCount">
0
</div>
<div class="stat-label">
👥 Customers
</div>
</div>

<div class="stat-card">
<div class="stat-number"
id="overdueCount">
0
</div>
<div class="stat-label">
🔴 Overdue
</div>
</div>

<div class="stat-card">
<div class="stat-number"
id="todayCount">
0
</div>
<div class="stat-label">
🟢 Today
</div>
</div>

<div class="stat-card">
<div class="stat-number"
id="upcomingCount">
0
</div>
<div class="stat-label">
🟡 Upcoming
</div>
</div>

<div class="stat-card"
onclick="location.href='route.html'">

<div class="stat-number"
id="routeCount">
0
</div>

<div class="stat-label">
🗺️ Route
</div>

</div>

</div>

<a href="calendar.html">

<button
class="big-btn calendar-btn">

📅 Calendar

</button>

</a>

<div class="search-box">

<input
type="text"
id="search"
placeholder="🔍 Search Customer">

</div>

<div class="tabs">

<button class="tab-btn">
📋 All
</button>

<button class="tab-btn">
⭐ Favorites
</button>

<button class="tab-btn">
🔴 Overdue
</button>

<button class="tab-btn">
🟢 Today
</button>

<button class="tab-btn">
🟡 Upcoming
</button>

</div>

<div
class="people-list"
id="peopleList">
</div>

<button
class="fab"
onclick="openModal()">
+
</button>

<div
class="modal"
id="personModal">

<div class="modal-content">

<h2>
➕ Add Customer
</h2>

<input
type="text"
id="personName"
placeholder="Customer Name">

<input
type="tel"
id="personPhone"
placeholder="Phone Number">

<input
type="date"
id="personDueDate">

<input
type="text"
id="personLocation"
placeholder="Google Maps Link">

<textarea
id="personNote"
placeholder="First Note">
</textarea>

<button
class="save-btn"
id="savePersonBtn">
Save Customer
</button>

</div>

</div>

<style>

.person-card{
background:white;
padding:15px;
border-radius:18px;
margin-bottom:15px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.person-top{
display:flex;
align-items:center;
gap:12px;
}

.person-photo{
width:60px;
height:60px;
border-radius:50%;
background:#ddd;
overflow:hidden;
flex-shrink:0;
}

.person-photo img{
width:100%;
height:100%;
object-fit:cover;
}

.person-data{
flex:1;
}

.person-name{
font-size:20px;
font-weight:bold;
}

.person-balance{
font-size:22px;
font-weight:bold;
color:#0F766E;
margin-top:5px;
}

.person-info{
font-size:14px;
color:#666;
margin-top:4px;
}

.person-actions{
display:flex;
gap:8px;
margin-top:12px;
flex-wrap:wrap;
}

.profile-btn{
background:#2563eb;
color:white;
border:none;
padding:10px 14px;
border-radius:10px;
}

.favorite-btn{
background:#fbbf24;
border:none;
padding:10px 14px;
border-radius:10px;
}

.fab{
position:fixed;
right:20px;
bottom:20px;
width:70px;
height:70px;
border:none;
border-radius:50%;
background:#14B8A6;
color:white;
font-size:40px;
font-weight:bold;
}

.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.45);
justify-content:center;
align-items:center;
padding:20px;
}

.modal-content{
background:white;
width:100%;
max-width:450px;
padding:20px;
border-radius:20px;
}

.modal-content h2{
margin-bottom:15px;
}

.modal-content input,
.modal-content textarea{
width:100%;
padding:12px;
margin-bottom:10px;
border:1px solid #ddd;
border-radius:12px;
}

.save-btn{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#14B8A6;
color:white;
font-size:16px;
font-weight:bold;
}

</style>  

<script>

let people =
JSON.parse(
localStorage.getItem("people")
) || [];

let currentTab = "all";

function savePeople(){

localStorage.setItem(
"people",
JSON.stringify(people)
);

}

function openModal(){

document.getElementById(
"personModal"
).style.display =
"flex";

}

function closeModal(){

document.getElementById(
"personModal"
).style.display =
"none";

}

document.getElementById(
"savePersonBtn"
).onclick = function(){

let name =
document.getElementById(
"personName"
).value.trim();

if(!name){

alert(
"Enter Customer Name"
);

return;

}

people.unshift({

name:name,

phone:
document.getElementById(
"personPhone"
).value,

dueDate:
document.getElementById(
"personDueDate"
).value,

location:
document.getElementById(
"personLocation"
).value,

rating:0,

favorite:false,

photo:"",

operations:[],

conversation:[],

notes:[
document.getElementById(
"personNote"
).value
]

});

savePeople();

closeModal();

renderPeople();

};

function renderPeople(){

let html = "";

let totalAmount = 0;

let today =
new Date()
.toISOString()
.split("T")[0];

let overdue = 0;
let todayCount = 0;
let upcoming = 0;

let search =
document.getElementById(
"search"
).value.toLowerCase();

people.forEach(person=>{

let balance = 0;

if(person.operations){

person.operations.forEach(op=>{

if(op.type === "Depot"){
balance += Number(op.amount);
}

if(op.type === "Paid"){
balance -= Number(op.amount);
}

});

}

person.realBalance = balance;

totalAmount += balance;

if(balance > 0){

if(
person.dueDate &&
person.dueDate < today
){
overdue++;
}

else if(
person.dueDate === today
){
todayCount++;
}

else if(
person.dueDate > today
){
upcoming++;
}

}

});

document.getElementById(
"totalAmount"
).innerText =
totalAmount + " MAD";

document.getElementById(
"peopleCount"
).innerText =
people.length;

document.getElementById(
"overdueCount"
).innerText =
overdue;

document.getElementById(
"todayCount"
).innerText =
todayCount;

document.getElementById(
"upcomingCount"
).innerText =
upcoming;

document.getElementById(
"routeCount"
).innerText =
todayCount;

people.forEach(
(person,index)=>{

if(
search &&
!person.name
.toLowerCase()
.includes(search)
){
return;
}

if(
currentTab === "favorites" &&
!person.favorite
){
return;
}

if(
currentTab === "overdue" &&
!(
person.realBalance > 0 &&
person.dueDate &&
person.dueDate < today
)
){
return;
}

if(
currentTab === "today" &&
!(
person.realBalance > 0 &&
person.dueDate === today
)
){
return;
}

if(
currentTab === "upcoming" &&
!(
person.realBalance > 0 &&
person.dueDate > today
)
){
return;
}

let stars =
"⭐".repeat(
person.rating || 0
);

let lastNote = "";

if(
person.notes &&
person.notes.length
){

let note =
person.notes[
person.notes.length - 1
];

if(
typeof note === "object"
){
lastNote =
note.text || "";
}
else{
lastNote =
note;
}

}

html += `

<div class="person-card">

<div class="person-top">

<div class="person-photo">

${
person.photo
?
`<img src="${person.photo}">`
:
""
}

</div>

<div class="person-data">

<div class="person-name">

${stars}
${person.name}

</div>

<div class="person-balance">

${person.realBalance}
MAD

</div>

</div>

</div>

<div class="person-info">
📞 ${person.phone || "-"}
</div>

${
person.dueDate
?
`
<div class="person-info">
📅 ${person.dueDate}
</div>
`
:
""
}

${
person.location
?
`
<div class="person-info">
📍 Location Saved
</div>
`
:
""
}

${
lastNote
?
`
<div class="person-info">
📝 ${lastNote}
</div>
`
:
""
}

<div class="person-actions">

<button
class="profile-btn"
onclick="openProfile(${index})">
👤 Profile
</button>

<button
class="favorite-btn"
onclick="toggleFavorite(${index})">
⭐
</button>

<button
style="
background:#ef4444;
color:white;
border:none;
padding:10px 14px;
border-radius:10px;
"
onclick="deleteCustomer(${index})">
🗑 Delete
</button>

</div>

</div>

`;

});

document.getElementById(
"peopleList"
).innerHTML =
html;

}

function toggleFavorite(index){

people[index].favorite =
!people[index].favorite;

savePeople();

renderPeople();

}

function openProfile(index){

localStorage.setItem(
"selectedCustomer",
index
);

window.location.href =
"person.html";

}

document
.querySelectorAll(".tab-btn")
.forEach((btn,index)=>{

btn.onclick = function(){

if(index === 0)
currentTab = "all";

if(index === 1)
currentTab = "favorites";

if(index === 2)
currentTab = "overdue";

if(index === 3)
currentTab = "today";

if(index === 4)
currentTab = "upcoming";

renderPeople();

};

});

document.getElementById(
"search"
).addEventListener(
"input",
renderPeople
);

function deleteCustomer(index){

if(
confirm(
"Delete this customer?"
)
){

people.splice(index,1);

savePeople();

renderPeople();

}

}
  
renderPeople();

</script>
