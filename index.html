<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Karni v2</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fa;
padding-bottom:100px;
}

.header{
background:#0F766E;
color:white;
padding:25px;
text-align:center;
font-size:30px;
font-weight:bold;
box-shadow:0 3px 10px rgba(0,0,0,.15);
}

.dashboard{
padding:15px;
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.card{
background:white;
padding:18px;
border-radius:18px;
box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.card-title{
font-size:14px;
color:#666;
margin-bottom:8px;
}

.card-value{
font-size:28px;
font-weight:bold;
color:#0F766E;
}

.search-box{
padding:0 15px;
}

.search-box input{
width:100%;
padding:14px;
border:none;
border-radius:15px;
background:white;
box-shadow:0 2px 8px rgba(0,0,0,.08);
font-size:16px;
}

.people-section{
padding:15px;
}

.person-card{
background:white;
padding:15px;
border-radius:18px;
margin-bottom:12px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.person-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:10px;
}

.person-name{
font-size:20px;
font-weight:bold;
}

.person-balance{
font-size:18px;
font-weight:bold;
color:#0F766E;
}

.note{
margin-top:5px;
color:#666;
font-size:14px;
}

.date{
margin-top:5px;
font-size:14px;
color:#555;
}

.actions{
display:flex;
flex-wrap:wrap;
gap:6px;
margin-top:12px;
}

.actions button{
padding:8px 12px;
border:none;
border-radius:10px;
cursor:pointer;
}

.btn-debt{
background:#dbeafe;
}

.btn-payment{
background:#dcfce7;
}

.btn-route{
background:#fef3c7;
}

.btn-more{
background:#ececec;
}

.fab{
position:fixed;
right:20px;
bottom:20px;
width:65px;
height:65px;
border-radius:50%;
border:none;
background:#14B8A6;
color:white;
font-size:35px;
font-weight:bold;
cursor:pointer;
box-shadow:0 5px 15px rgba(0,0,0,.2);
}

.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.5);
justify-content:center;
align-items:center;
padding:20px;
}

.modal-content{
background:white;
width:100%;
max-width:400px;
padding:20px;
border-radius:20px;
}

.modal-content h2{
margin-bottom:15px;
}

.modal-content input,
.modal-content textarea{
width:100%;
padding:12px;
margin-bottom:12px;
border:1px solid #ddd;
border-radius:12px;
}

.modal-buttons{
display:flex;
gap:10px;
}

.save-btn{
flex:1;
background:#14B8A6;
color:white;
border:none;
padding:12px;
border-radius:12px;
}

.cancel-btn{
flex:1;
background:#eee;
border:none;
padding:12px;
border-radius:12px;
}

</style>
</head>

<body>

<div class="header">
Karni v2
</div>

<div class="dashboard">

<div class="card">
<div class="card-title">Total Amount</div>
<div class="card-value" id="totalAmount">0 MAD</div>
</div>

<div class="card">
<div class="card-title">People</div>
<div class="card-value" id="peopleCount">0</div>
</div>

<div class="card">
<div class="card-title">Route Today</div>
<div class="card-value" id="routeCount">0</div>
</div>

<div class="card">
<div class="card-title">Collected</div>
<div class="card-value" id="collectedAmount">0</div>
</div>

</div>

<div class="search-box">
<input
type="text"
id="search"
placeholder="🔍 Search person...">
</div>

<div class="people-section" id="peopleList">
</div>

<button class="fab" onclick="openModal()">
+
</button>

<div class="modal" id="personModal">

<div class="modal-content">

<h2>Add Person</h2>

<input
type="text"
id="personName"
placeholder="Person Name">

<textarea
id="personNote"
placeholder="Note"></textarea>

<input
type="number"
id="personBalance"
placeholder="Initial Balance">

<input
type="date"
id="personDate">

<div class="modal-buttons">

<button
class="save-btn"
onclick="addPerson()">
Save
</button>

<button
class="cancel-btn"
onclick="closeModal()">
Cancel
</button>

</div>

</div>

</div>

<script>

let people =
JSON.parse(localStorage.getItem("people")) || [];

function savePeople(){
localStorage.setItem(
"people",
JSON.stringify(people)
);
}

function openModal(){
document.getElementById("personModal")
.style.display = "flex";
}

function closeModal(){
document.getElementById("personModal")
.style.display = "none";
}

function addPerson(){

let name =
document.getElementById("personName")
.value.trim();

if(name === ""){
alert("Enter person name");
return;
}

let note =
document.getElementById("personNote")
.value;

let balance =
Number(
document.getElementById("personBalance")
.value
) || 0;

let dueDate =
document.getElementById("personDate")
.value;

people.unshift({
name:name,
note:note,
balance:balance,
dueDate:dueDate,
favorite:false,
history:[]
});

savePeople();

document.getElementById("personName").value="";
document.getElementById("personNote").value="";
document.getElementById("personBalance").value="";
document.getElementById("personDate").value="";

closeModal();

renderPeople();

}

function renderPeople(){

let html = "";

let totalAmount = 0;

people.forEach(person=>{
totalAmount += person.balance;
});

document.getElementById("totalAmount")
.innerText = totalAmount + " MAD";

document.getElementById("peopleCount")
.innerText = people.length;

let route =
JSON.parse(
localStorage.getItem("todayRoute")
) || [];

document.getElementById("routeCount")
.innerText = route.length;

let search =
document.getElementById("search")
.value.toLowerCase();

people.forEach((person,index)=>{

if(
search &&
!person.name.toLowerCase()
.includes(search)
){
return;
}

html += `

<div class="person-card">

<div class="person-header">

<div class="person-name">
${person.favorite ? "⭐" : ""}
${person.name}
</div>

<div class="person-balance">
${person.balance} MAD
</div>

</div>

${person.note ?
`
<div class="note">
📝 ${person.note}
</div>
`
:
""
}

${person.dueDate ?
`
<div class="date">
📅 ${person.dueDate}
</div>
`
:
""
}

<div class="actions">

<button
class="btn-debt"
onclick="addDebt(${index})">
+ Debt
</button>

<button
class="btn-payment"
onclick="addPayment(${index})">
- Payment
</button>

<button
class="btn-route"
onclick="addToRoute(${index})">
📍 Route
</button>

<button
class="btn-more"
onclick="toggleFavorite(${index})">
⭐
</button>

<button
class="btn-more"
onclick="editPerson(${index})">
✏️
</button>

<button
class="btn-more"
onclick="deletePerson(${index})">
🗑
</button>

</div>

</div>

`;

});

document.getElementById("peopleList")
.innerHTML = html;

}

function addDebt(index){

let amount =
prompt("Debt Amount");

if(!amount) return;

people[index].balance +=
Number(amount);

savePeople();

renderPeople();

}

function addPayment(index){

let amount =
prompt("Payment Amount");

if(!amount) return;

people[index].balance -=
Number(amount);

if(
people[index].balance < 0
){
people[index].balance = 0;
}

savePeople();

renderPeople();

}

function deletePerson(index){

if(
confirm("Delete this person?")
){

people.splice(index,1);

savePeople();

renderPeople();

}

}

function editPerson(index){

let newName =
prompt(
"Edit Name",
people[index].name
);

if(
newName === null ||
newName.trim()===""
){
return;
}

people[index].name =
newName;

savePeople();

renderPeople();

}

function toggleFavorite(index){

people[index].favorite =
!people[index].favorite;

savePeople();

renderPeople();

}

function addToRoute(index){

let route =
JSON.parse(
localStorage.getItem("todayRoute")
) || [];

let exists =
route.some(
p => p.name === people[index].name
);

if(exists){
alert("Already in route");
return;
}

route.push(people[index]);

localStorage.setItem(
"todayRoute",
JSON.stringify(route)
);

renderPeople();

alert("Added To Route ✅");

}

document
.getElementById("search")
.addEventListener(
"input",
renderPeople
);

renderPeople();

</script>  

</body>
</html>
