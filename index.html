<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Store</title>
    <style>
        :root {
            --primary-bg: #f8f9fa;
            --card-bg: #ffffff;
            --black: #000000;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--primary-bg);
            margin: 0;
            padding: 10px;
        }

        /* الهيدر */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
        }

        .cart-btn {
            background: var(--black);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 14px;
        }

        .admin-btn {
            background: none;
            border: 1px solid #ccc;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 5px;
        }

        /* شبكة المنتجات */
        .products-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 10px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            position: relative;
        }

        .product-card img {
            width: 100%;
            height: 150px;
            object-fit: contain;
            border-radius: 10px;
        }

        .product-info h3 { margin: 10px 0 5px; font-size: 16px; }
        .product-info p { color: #666; font-size: 14px; margin-bottom: 10px; }

        .add-to-cart {
            background: var(--black);
            color: white;
            width: 100%;
            border: none;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
        }

        .delete-btn {
            display: none; /* يظهر فقط للآدمن */
            position: absolute;
            top: 5px;
            right: 5px;
            background: red;
            color: white;
            border: none;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            cursor: pointer;
        }

        /* نافذة الإضافة (Modal) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .save-btn { background: #28a745; color: white; border: none; width: 100%; padding: 12px; border-radius: 8px; margin-top: 10px; }
    </style>
</head>
<body>

    <header>
        <div class="cart-btn">السلة (0) 🧺</div>
        <div style="font-weight: bold;">My Store 🛒</div>
        <button class="admin-btn" onclick="checkAdmin()">Admin</button>
    </header>

    <div id="adminPanel" style="display:none; background: #eee; padding: 10px; margin-top: 10px; border-radius: 10px; text-align: center;">
        <span>لوحة التحكم: </span>
        <button onclick="document.getElementById('addModal').style.display='flex'">+ إضافة منتج جديد</button>
        <button onclick="logoutAdmin()" style="color:red">خروج</button>
    </div>

    <div class="products-grid" id="productsGrid">
        </div>

    <div class="modal" id="addModal">
        <div class="modal-content">
            <h3>إضافة منتج جديد</h3>
            <input type="text" id="pName" placeholder="اسم المنتج">
            <input type="text" id="pPrice" placeholder="الثمن">
            <input type="text" id="pBox" placeholder="عدد القطع في العلبة">
            <input type="file" id="pImage" accept="image/*">
            <button class="save-btn" onclick="saveProduct()">حفظ المنتج</button>
            <button onclick="document.getElementById('addModal').style.display='none'" style="background:none; border:none; color:grey; width:100%; margin-top:10px;">إلغاء</button>
        </div>
    </div>

    <script>
        let isAdmin = false;

        // التحقق من كود الآدمن
        function checkAdmin() {
            let code = prompt("أدخل كود الآدمن:");
            if (code === "1245") {
                isAdmin = true;
                document.getElementById('adminPanel').style.display = 'block';
                renderProducts();
            } else {
                alert("الكود غير صحيح!");
            }
        }

        function logoutAdmin() {
            isAdmin = false;
            document.getElementById('adminPanel').style.display = 'none';
            renderProducts();
        }

        // حفظ المنتج في LocalStorage
        function saveProduct() {
            const name = document.getElementById('pName').value;
            const price = document.getElementById('pPrice').value;
            const box = document.getElementById('pBox').value;
            const imageFile = document.getElementById('pImage').files[0];

            if (name && price && imageFile) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const products = JSON.parse(localStorage.getItem('myStoreProducts') || '[]');
                    products.push({
                        id: Date.now(),
                        name: name,
                        price: price,
                        box: box,
                        image: e.target.result // يحول الصورة إلى نص طويل (Base64) لتعمل من الهاتف
                    });
                    localStorage.setItem('myStoreProducts', JSON.stringify(products));
                    renderProducts();
                    document.getElementById('addModal').style.display = 'none';
                    // مسح الخانات
                    document.getElementById('pName').value = '';
                    document.getElementById('pPrice').value = '';
                    document.getElementById('pBox').value = '';
                };
                reader.readAsDataURL(imageFile);
            } else {
                alert("يرجى ملء جميع الخانات واختيار صورة");
            }
        }

        // عرض المنتجات
        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            const products = JSON.parse(localStorage.getItem('myStoreProducts') || '[]');
            grid.innerHTML = '';

            products.forEach(p => {
                grid.innerHTML += `
                    <div class="product-card">
                        ${isAdmin ? `<button class="delete-btn" style="display:block" onclick="deleteProduct(${p.id})">×</button>` : ''}
                        <img src="${p.image}" alt="${p.name}">
                        <div class="product-info">
                            <h3>${p.name}</h3>
                            <p>${p.price} - ${p.box}</p>
                        </div>
                        <button class="add-to-cart">أضف للسلة</button>
                    </div>
                `;
            });
        }

        // حذف منتج
        function deleteProduct(id) {
            if (confirm("هل أنت متأكد من حذف هذا المنتج؟")) {
                let products = JSON.parse(localStorage.getItem('myStoreProducts') || '[]');
                products = products.filter(p => p.id !== id);
                localStorage.setItem('myStoreProducts', JSON.stringify(products));
                renderProducts();
            }
        }

        // تحميل المنتجات عند فتح الصفحة
        renderProducts();
    </script>
</body>
</html>
